# CircleCI release pipeline — build the six release images and push them to ghcr.io.
#
# Why this exists: the Mac dev box builds linux/amd64 under QEMU and runs Docker in a
# memory-boxed VM, so `make release-push` there is slow and OOM-crashes the multi-arch
# buildx. CircleCI runs native Linux, so the amd64 half is native and there is no VM
# memory ceiling.
#
# Shape (owner's call): ONE parallel job per image (matrix over the six), so a slow image
# never blocks the others and any single image can be re-run alone. Each job just calls
# `make release-push-one SVC=<image>` — the build args live in the Makefile, never here, so
# the two cannot drift.
#
# Trigger: a git tag matching /^v.*/ (e.g. v0.1.42). TAG is passed from the tag that fired
# the pipeline, so the image version is exactly the tag.
#
# Setup the owner does once, in the CircleCI project settings (Environment Variables):
#   GHCR_USER  = atmaxmoj
#   GHCR_TOKEN = a GitHub PAT (classic) with write:packages   [mark it masked]
#
# arm64 is emulated via QEMU here (amd64 runner). If arm64 build time is a problem, split
# each job into a native amd64 job + a native arm64 job (arm.large executor) that each push
# a per-arch tag, plus a manifest job that combines them — native both ways, no QEMU.

version: 2.1

executors:
  linux:
    machine:
      image: ubuntu-2404:current
    resource_class: large

jobs:
  build-push:
    parameters:
      image:
        type: string
    executor: linux
    steps:
      - checkout
      - run:
          name: Log in to ghcr.io
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Register QEMU for arm64 emulation
          command: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - run:
          name: Build + push standmeet-<< parameters.image >> (multi-arch → ghcr)
          command: |
            # app + builder build the SDK on the runner (pnpm), so node/pnpm must be on PATH in
            # THIS shell — a separate step loses the nvm/corepack PATH (that was the first failure).
            # backend / db / im-bridge / updater are self-contained Docker builds and skip this.
            case "<< parameters.image >>" in
              app|builder)
                nvm install 22 >/dev/null && nvm alias default 22 && nvm use 22
                corepack enable ;;
            esac
            make release-push-one SVC=<< parameters.image >> TAG="<< pipeline.git.tag >>"
          no_output_timeout: 45m

  # quality —— the local gates, run on the server for every push to main (refactor ledger R23).
  # Before this, every gate ran only in lefthook: `--no-verify`, or a checkout without hooks,
  # shipped unchecked. The tool versions match the dev box (`go version -m` on its binaries);
  # change them here and there together. Dependencies are installed first: the frontend lint
  # targets print "[skip]" and pass when node_modules is missing, and a skip is not a pass.
  quality:
    parameters:
      target:
        type: string
    executor: linux
    steps:
      - checkout
      - run:
          name: Tools (Go, golangci-lint, go-arch-lint, go-escape-lint, gocyclo, gitleaks, node)
          command: |
            # The image ships its own Go in /usr/local/go; unpacking over it mixes two trees.
            sudo rm -rf /usr/local/go
            curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
            echo 'export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH' >> "$BASH_ENV"
            export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
            go install github.com/fe3dback/go-arch-lint@v1.15.0
            go install github.com/maxpoletaev/go-escape-lint@v0.0.0-20240522212809-bd7ef3ec9ca4
            go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
            curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
              | sudo tar -C /usr/local/bin -xz gitleaks
            nvm install 22 >/dev/null && nvm alias default 22
            # nvm is a shell function of the login shell; later steps get node by PATH instead.
            echo "export PATH=$(dirname "$(nvm which 22)"):\$PATH" >> "$BASH_ENV"
      - run:
          name: Dependencies (workspace install; the SDK build the builder vendors)
          command: |
            corepack enable && corepack prepare pnpm@9.15.0 --activate
            pnpm install --frozen-lockfile
            make sdk-build builder-vendor
          no_output_timeout: 20m
      - run:
          name: make << parameters.target >>
          command: make << parameters.target >>
          no_output_timeout: 45m

  # npm-publish —— the five @standmeet/* packages at the tag's version (docs/release-npm.md).
  # NPM_TOKEN (an npm automation token with publish rights on @standmeet) in the project's
  # Environment Variables turns it on; without it the job says so and passes.
  npm-publish:
    executor: linux
    steps:
      - checkout
      - run:
          name: Publish @standmeet/* to npm
          command: |
            nvm install 22 >/dev/null && nvm alias default 22 && nvm use 22
            corepack enable
            make npm-publish TAG="<< pipeline.git.tag >>"

workflows:
  quality:
    jobs:
      - quality:
          name: << matrix.target >>
          matrix:
            parameters:
              target: [lint, backend-test, test-unit]
          filters:
            branches:
              only: main
  release:
    jobs:
      - build-push:
          name: build-<< matrix.image >>
          matrix:
            parameters:
              image: [backend, app, builder, im-bridge, db, updater]
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - npm-publish:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
