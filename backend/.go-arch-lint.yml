version: 3
workdir: .
allow:
  depOnAnyVendor: true   # 第三方库（chi、pgx、mcp-go、anthropic-sdk-go 等）
                         # 任何 component 可用；这里只约束 internal 的依赖图。
  deepScan: false        # cmd/server/main.go 是 composition root，
                         # 跨所有 layer 是预期；关闭 deepScan 避免误报。

# 测试文件不参与架构约束 —— 架构图管的是生产依赖；外部 test 包 import 自身、
# 跨层 import 都是正常的，不该被架构规则误判。
excludeFiles:
  - "^.*_test\\.go$"
  # composition root 的插件接线文件：唯一 import 外置能力 module（独立 go.mod，
  # import path 落在 standmeet 根前缀下、arch-lint 当 internal 但映不到组）做
  # in-process 加载的地方。跟 cmd 关 deepScan 同理 —— composition root 跨边界是
  # 预期，不该被内部依赖图规则误判。
  - "^.*cmd/server/plugins\\.go$"

# Components 命名对齐 Otium auth。按外部系统切 infra（postgres / inference /
# storage / sandbox 各自独立）而不是扁平 infra/。
components:
  domain:
    in: internal/domain
  usecases:
    in: internal/usecases
  obsidian:
    in: internal/usecases/obsidian        # Obsidian vault import/export
  postgres:
    in: internal/postgres                 # 含 sqlc 生成的 dbq 子包
  dbq:
    in: internal/postgres/dbq
  session:
    in: internal/session
  config:
    in: internal/config
  apierr:
    in: internal/apierr                   # HTTP error envelope 翻译 helper
  middleware:
    in: internal/middleware               # chi middleware: WithOwner, RequireCSRF
  mcphandle:
    in: internal/routes/mcphandle         # owner MCP handles (controller layer): mcp-go server + tool handlers
  inference:
    in: internal/inference                # LLM provider abstraction
  agentcore:
    in: agentcore                         # public facade over the agentic loop (eval-harness 等 out-of-module driver 入口)
  plugins:
    in: internal/plugins                  # J phase: Plugin interface + Registry
  pluginjobs:
    in: internal/plugins/jobs             # J phase: jobs plugin entry (Plugin impl)
  jobsuc:
    in: internal/plugins/jobs/jobsuc      # J.2: jobs plugin usecases (jobs / resume / applications)
  jobsmcp:
    in: internal/plugins/jobs/jobsmcp     # J.3: jobs plugin MCP capabilities + views + helpers
  jobsadmin:
    in: internal/plugins/jobs/jobsadmin   # J.4: jobs plugin admin REST routes (drafts / applications list)
  jobcache:
    in: internal/plugins/jobs/cache       # J phase: jobs plugin cache sub-pkg (Redis 1d TTL)
  jobfetch:
    in: internal/plugins/jobs/fetch       # J phase: jobs plugin fetch sub-pkg (Greenhouse / Lever / Ashby / ...)
  jobdedup:
    in: internal/plugins/jobs/dedup       # J.6c: cross-source dedup (canonical URL + composite key)
  gcal:
    in: internal/gcal                     # Google OAuth + Calendar HTTP client (events.insert / freeBusy / token refresh)
  gotenberg:
    in: internal/gotenberg                # HTTP client for the Gotenberg PDF render sidecar
  printsess:
    in: internal/printsess                # Redis 60s stash for gotenberg-bound resume payload
  marketplace:
    in: internal/marketplace              # skill marketplace aggregation client (GitHub + SkillsMP)
  captcha:
    in: internal/captcha                  # Cloudflare Turnstile / noop captcha verifier abstraction
  sandbox:
    in: internal/sandbox                  # owner-curated skill script 在 docker container 里跑
  capreg:
    in: internal/capreg              # Phase B Capability registry: visitor + owner MCP 三处消费的统一注册口
  prompts:
    in: internal/prompts                  # Phase D-1: system prompt fragments 单一源 (md files + go:embed)
  mcpclient:
    in: internal/mcpclient                # 调外部 MCP server (owner-registered)
  mcpplugin:
    in: internal/mcpplugin                # C1: 装机插件 manifest 解析 + 发现来源 (leaf)
  capsocket:
    in: internal/capsocket                # 窄 unix-socket host 服务：断网沙箱插件经 bind 进的 socket 调后端 op (leaf)
  sandboxws:
    in: internal/sandboxws                # per-session 沙箱工作区生命周期：懒建/TTL/cron sweep (leaf)
  storage:
    in: internal/storage                  # MinIO/S3 对象存储 (图片 / 附件)
  mailer:
    in: internal/mailer                   # 出站 SMTP 发信 (net/smtp，owner 自带 mail server)
  connector:
    in: internal/connector                # Phase B: Nango-style 连接器层 —— 解密凭据 + 代调外部 (gcal/mailer)；凭据永不出 vault 进 usecases
  cryptobox:
    in: internal/cryptobox                # AES-GCM 对称加密 helper（owner key 存储等）
  retry:
    in: internal/retry                    # #132 通用可配重试 infra（退避/封顶/retryable/ctx 打断）；leaf，connector 代调架其上
  sysroutes:
    in: internal/routes/sys
  adminroutes:
    in: internal/routes/admin
  publicroutes:
    in: internal/routes/public            # /api/v1/* — SDK / visitor entry
  server:
    in: internal/server
  cmd:
    in: cmd/server

deps:
  # Domain 纯内核，无 internal 依赖。
  domain:
    mayDependOn: []
    anyVendorDeps: true

  # Usecases 编排 domain + infra（postgres / session / inference / jobcache / jobfetch）。
  # PDF 渲染走 usecases.PDFRenderer 接口；实现（gotenberg）由 wireup 注入，
  # usecases 自己不引 gotenberg 包。
  usecases:
    mayDependOn:
      - domain
      - postgres
      - session
      - inference
      - cryptobox
      - sandbox
      - mcpclient
      - storage
      - capreg
      - prompts
      - mcpplugin
      - capsocket
    anyVendorDeps: true

  # mailer —— 出站 SMTP 发信 leaf 包，纯 stdlib (net/smtp)，无 internal 依赖。
  mailer:
    mayDependOn: []
    anyVendorDeps: true

  # connector —— Phase B Nango-proxy 层：唯一解密 owner 凭据 + 代调外部
  # (gcal / mailer) 的地方。usecases 只持 CalendarProxy / MailProxy 接口，
  # 凭据永不进 usecases。实现外部能力 → 依赖 gcal + mailer + domain；
  # 复用 usecases 的 DTO 类型 (FreeBusyReq / MailMessage 等) → 依赖 usecases。
  connector:
    mayDependOn:
      - domain
      - usecases
      - gcal
      - mailer
      - retry
    anyVendorDeps: true

  # retry —— #132 通用可配重试 infra leaf：纯 stdlib (context/time)，无 internal 依赖。
  # connector 代调外部（gcal/mailer，第三方易抖）按 call-class 在它之上配策略（D-6/D-7）。
  retry:
    mayDependOn: []
    anyVendorDeps: true

  # sandbox 调外部 docker，仅依赖 stdlib + domain (SkillScript)。
  sandbox:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # capreg —— Phase B Capability interface + Registry。leaf-ish 包，
  # 只依赖 inference (ToolSpec / ToolExecutor) + domain (RoleSnapshot 类型)。
  # 具体 Capability 实现放在 usecases / mcp 等更高层，反向 import 本包注册。
  capreg:
    mayDependOn:
      - inference
      - domain
    anyVendorDeps: true

  # prompts —— Phase D-1: leaf 包，只 stdlib (embed)；所有引 system prompt
  # fragment 的地方 (usecases capability impl / sysroutes endpoint /
  # publicroutes endpoint) 都从这里 load，不再硬编码字符串。
  prompts:
    mayDependOn: []
    anyVendorDeps: true

  # mcpclient 调 owner-registered 外部 MCP HTTP server。
  mcpclient:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # capsocket —— 窄 host unix-socket 服务 leaf：line-JSON 分发，无 internal 依赖。
  capsocket:
    mayDependOn: []
    anyVendorDeps: true

  # storage 是 S3 / MinIO 客户端，纯 vendor + stdlib。
  storage:
    mayDependOn: []
    anyVendorDeps: true

  # Postgres Repository 把 sqlc 生成的 dbq 映射到 domain types。
  # cryptobox 给 owner-supplied key 落盘前加密（AI provider key 等）。
  postgres:
    mayDependOn:
      - domain
      - dbq
      - cryptobox
    anyVendorDeps: true

  # sqlc 生成的查询代码；其他业务不该直接 import，必须经 postgres Repository。
  dbq:
    mayDependOn: []
    anyVendorDeps: true

  # Session 管理 setup token、login session、API token。
  # domain 是单向值对象（PathPermission 等）—— session 内置入参/出参字段，
  # 不耦合业务逻辑。其他 internal 包仍走 narrow interface 注入。
  session:
    mayDependOn: [domain]
    anyVendorDeps: true

  config:
    mayDependOn: []
    anyVendorDeps: true

  # apierr 是无依赖的 envelope 翻译 util；任何 routes 包可 import 来做
  # error → HTTP envelope 映射。
  apierr:
    mayDependOn: []
    anyVendorDeps: true

  # middleware 包含 owner auth gate（WithOwner）+ CSRF gate + LoginGuard
  # (rate-limit + captcha + equal-time)。session 给 token lookup；captcha
  # 给 LoginGuard 的 Verifier 接口。
  middleware:
    mayDependOn:
      - session
      - captcha
    anyVendorDeps: true

  # mcphandle 是 owner AI 客户端用的 MCP server (controller 层)；通过 OwnerLookup
  # 接口注入 owner profile 查询，避免直接 import postgres；usecases 提供 token verify。
  mcphandle:
    mayDependOn:
      - domain
      - usecases
      - capreg
      - jobsuc
      - jobsmcp
    anyVendorDeps: true

  # inference 是 LLM provider 抽象（Anthropic / OpenAI / Mock）。
  # 不依赖任何 internal（纯接口 + 实现 + sentinel errors）。
  # cryptobox: resolver 用来解密 byoai key (Redis 拿到的是密文)；其他业务
  # 仍走 narrow OwnerLookup 接口，不耦合具体 repo。
  inference:
    mayDependOn:
      - cryptobox
      - domain   # AICredential value object，统一 byoai 跟 owner key 的 shape
    anyVendorDeps: true

  # agentcore —— public facade：把 internal/inference 的 agentic loop 表面
  # (AgentSink / AgentTurnInput / BuildAgentIterator / DriveAgentLoop) re-export
  # 给 out-of-module driver (eval-harness)。loop 表面无逻辑，纯 alias +
  # pass-through。F.2 起多一个 BuildVisitorAgent：驱动真 visitor capability 装配
  # (usecases.RegisterVisitorSkills + AssembleVisitor + ComposeSystemPrompt) over
  # fixture 数据源，所以多依赖 usecases/capreg/domain/postgres —— 跑的是
  # prod 同一套 agentic 功能，只换注入的 repo。backend 内部无人 import 它。
  agentcore:
    mayDependOn:
      - inference
      - usecases
      - capreg
      - domain
      - postgres
      - sandbox
      - mcpplugin
    anyVendorDeps: true

  # jobcache —— Redis-backed 1d TTL 池子，存 fetcher 抓的 FetchedJob。
  # plugins —— J phase: Plugin interface + Registry + optional hooks
  # (CapabilityRegistrar / AdminRouter)。J.5 起 hooks 需要 capreg +
  # chi (vendor)；boundary 仍 leaf 不耦合任何业务包。
  plugins:
    mayDependOn:
      - domain
      - capreg
    anyVendorDeps: true

  # pluginjobs —— J phase: jobs plugin entry。J.5 起持 Deps 闭包 + 实现
  # CapabilityRegistrar (调 jobsmcp) + AdminRouter (调 jobsadmin)；
  # 它是 jobs plugin 整套面 (uc / mcp / admin / fetch / cache) 的拼装层。
  pluginjobs:
    mayDependOn:
      - plugins
      - capreg
      - jobcache
      - jobfetch
      - jobsuc
      - jobsmcp
      - jobsadmin
      - postgres
    anyVendorDeps: true

  # jobsuc —— J.2: jobs plugin usecases。J 期前住 usecases；搬过来后跟核
  # 心 usecases 同款依赖集 (domain/postgres/cryptobox + jobfetch/jobcache)。
  # 依赖核心 usecases 是因为复用 ErrEmptyField 这种通用 sentinel；后续 J
  # 期把 sentinel 抽到 domain 后可断这条。
  jobsuc:
    mayDependOn:
      - domain
      - postgres
      - usecases
      - jobcache
      - jobfetch
      - jobdedup
    anyVendorDeps: true

  # jobdedup —— J.6c: cross-source dedup (canonical URL + composite key)。
  # 纯函数；只依赖 domain.FetchedJob shape。
  jobdedup:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # jobsmcp —— J.3: jobs plugin MCP capabilities + result wire views。
  # 跨 capreg 注册到核心 Registry；依赖 jobsuc 拿 *Deps。
  jobsmcp:
    mayDependOn:
      - domain
      - capreg
      - jobsuc
    anyVendorDeps: true

  # jobsadmin —— J.4: jobs plugin admin REST routes (drafts / applications list)。
  # 自包响应 helpers (writeServerErr / nullTime)，不抄 adminroutes 的 Handlers。
  jobsadmin:
    mayDependOn:
      - domain
      - postgres
      - middleware
      - apierr
    anyVendorDeps: true

  # 依赖 domain 是因为它要 marshal 真实 domain 结构（不糊弄成 []byte）。
  jobcache:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # jobfetch —— 6+ 个 source adapter（Greenhouse / Lever / Ashby / RemoteOK
  # / WWR / HN / SmartRecruiters / Workable）。纯外部 HTTP，依赖 domain 是
  # 为了返回 FetchedJob。各 adapter 的 base URL 可被 env 覆写（e2e mock）。
  jobfetch:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # gcal —— Google OAuth (token exchange + refresh) + Calendar API
  # (events.insert + freeBusy) HTTP client。usecases.CalendarBooker 接口的
  # 实现；wireup 注入。endpoints 走 env (GOOGLE_OAUTH_BASE_URL /
  # GOOGLE_CALENDAR_BASE_URL) 默认 prod，e2e 指向 job-board-mock。
  gcal:
    mayDependOn: []
    anyVendorDeps: true

  # gotenberg —— thin HTTP client for the Gotenberg sidecar (headless
  # Chromium PDF rendering). usecases.PDFRenderer 接口的 v1 实现。
  # 不依赖 domain / postgres —— 调 RenderURL(printURL) 就完事；wireup 里
  # 通过 adapter 把 *domain.Application + qrURL 编码进 print URL。
  gotenberg:
    mayDependOn: []
    anyVendorDeps: true

  # printsess —— Redis 60s 一次性 stash，存放 gotenberg 取走的 resume
  # 渲染 payload (application + qrURL)。
  # sys routes 读它（/internal/print-session/{token}），wireup 里 gotenberg
  # adapter 写它。
  printsess:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # marketplace —— skill marketplace 聚合客户端（GitHub anthropics/skills +
  # SkillsMP HTTP API + in-memory cache）。usecases 通过接口注入，admin
  # routes 不直接 import。
  marketplace:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # captcha —— Cloudflare Turnstile + noop verifier。Verifier 接口注入到
  # middleware (LoginGuard) 做请求级校验。无 internal 依赖（接收 secret /
  # token / IP 全是 string，输出 sentinel error）。
  captcha:
    mayDependOn: []
    anyVendorDeps: true

  # cryptobox 是无依赖的 AES-GCM helper；任何 internal 包可以 import 来落盘
  # 加密。本身只读 INSTANCE_SECRET env，不绕回任何 internal 模块。
  cryptobox:
    mayDependOn: []
    anyVendorDeps: true

  # sys routes (/internal/healthz, tls-ask, log, builds) 需要 ping db / redis
  # 所以可以 import postgres。redis 客户端是 vendor。domain 也用得到：
  # /internal/builds/claim 在 no-pending 时返 ErrCustomPageBuildNotFound。
  sysroutes:
    mayDependOn:
      - domain
      - postgres
      - printsess
      - session
      - usecases
      - capreg
      - sandboxws
    anyVendorDeps: true

  # sandboxws —— per-session 沙箱工作区生命周期 leaf：纯 stdlib (os/filepath/sync/time)。
  sandboxws:
    mayDependOn: []
    anyVendorDeps: true

  # admin routes (/api/admin/*) 派发到 usecases；handler 自己 cyclo ≤3。
  # 需要 domain（sentinel errors 翻译）+ session（first-run.txt 清理 / cookie 名）
  # + usecases + apierr（error envelope）+ middleware（ctx key + cookie 名）。
  adminroutes:
    mayDependOn:
      - domain
      - usecases
      - obsidian
      - session
      - postgres
      - apierr
      - middleware
      - storage
      - inference   # /ai-provider/presets 暴露 preset 表给 admin UI
      - connector   # /connectors/* OAuth init/callback + mail OTP 经连接器层（不直碰 gcal/mailer）
      - capreg      # Phase H /capabilities：列 registry origin + owner-enable 开关
    anyVendorDeps: true

  # obsidian —— Obsidian vault 双向 sync 子用例：frontmatter codec / image
  # ref rewriter / zip export / multipart import。靠 usecases.SavePost 走
  # 那条 atomic asset 路径，所以单向依赖 usecases；不被 usecases 反向 import。
  obsidian:
    mayDependOn:
      - domain
      - usecases
      - postgres
      - storage
    anyVendorDeps: true

  # public routes (/api/v1/*) —— SDK + visitor 落地点；走 visitor session
  # token bearer auth；SSE 流式 chat。
  publicroutes:
    mayDependOn:
      - domain
      - usecases
      - session
      - inference
      - apierr
      - capreg # D-2: /api/v1/sessions 返 capability_state + part_ids，读 Registry
      - cryptobox   # BYOAI envelope (HKDF + AES-GCM) 解封 X-BYOAI-Key header
      - prompts     # GET /api/v1/prompts/{id} 直接 dump fragment 文本
      - gotenberg   # GET /report/{id}/pdf —— ErrNotConfigured sentinel + ReportPDFRenderer
    anyVendorDeps: true

  # server 装配 chi 路由 + middleware；挂 admin / sysroutes / mcphandle / public sub-router。
  server:
    mayDependOn:
      - sysroutes
      - adminroutes
      - publicroutes
      - usecases
      - session
      - middleware
      - mcphandle
      - postgres
      - captcha
      - plugins
    anyVendorDeps: true

  # cmd/ 是 composition root —— 唯一允许跨所有 layer 的地方。
  cmd:
    mayDependOn:
      - config
      - domain
      - postgres
      - session
      - usecases
      - sysroutes
      - adminroutes
      - publicroutes
      - mcphandle
      - inference
      - jobcache
      - jobfetch
      - jobsuc
      - gotenberg
      - gcal
      - connector
      - printsess
      - marketplace
      - captcha
      - cryptobox
      - sandbox
      - mcpclient
      - mcpplugin
      - storage
      - server
      - capreg
      - plugins
      - pluginjobs
      - capsocket
      - sandboxws
    anyVendorDeps: true
