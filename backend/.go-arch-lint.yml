version: 3
workdir: .
allow:
  depOnAnyVendor: true   # 第三方库（chi、pgx、mcp-go、anthropic-sdk-go 等）
                         # 任何 component 可用；这里只约束 internal 的依赖图。
  deepScan: false        # cmd/server/main.go 是 composition root，
                         # 跨所有 layer 是预期；关闭 deepScan 避免误报。

# 测试文件不参与架构约束 —— 架构图管的是生产依赖；外部 test 包 import 自身、
# 跨层 import 都是正常的，不该被架构规则误判。
excludeFiles:
  - "^.*_test\\.go$"
  # composition root 的插件接线文件：唯一 import 外置能力 module（独立 go.mod，
  # import path 落在 standmeet 根前缀下、arch-lint 当 internal 但映不到组）做
  # in-process 加载的地方。跟 cmd 关 deepScan 同理 —— composition root 跨边界是
  # 预期，不该被内部依赖图规则误判。
  - "^.*cmd/server/plugins\\.go$"

# Components 命名对齐 Otium auth。按外部系统切 infra（postgres / inference /
# storage / sandbox 各自独立）而不是扁平 infra/。
components:
  domain:
    in: internal/domain
  usecases:
    in: internal/usecases
  obsidian:
    in: internal/usecases/obsidian        # Obsidian vault import/export
  postgres:
    in: internal/postgres                 # 含 sqlc 生成的 dbq 子包
  dbq:
    in: internal/postgres/dbq
  session:
    in: internal/session
  config:
    in: internal/config
  apierr:
    in: internal/apierr                   # HTTP error envelope 翻译 helper
  middleware:
    in: internal/middleware               # chi middleware: WithOwner, RequireCSRF
  mcphandle:
    in: internal/routes/mcphandle         # owner MCP handles (controller layer): mcp-go server + tool handlers
  inference:
    in: internal/inference                # LLM provider abstraction
  agentcore:
    in: agentcore                         # public facade over the agentic loop (eval-harness 等 out-of-module driver 入口)
  plugins:
    in: internal/plugins                  # J phase: Plugin interface + Registry
  pluginjobs:
    in: internal/plugins/jobs             # J phase: jobs plugin entry (Plugin impl)
  pluginownercore:
    in: internal/plugins/ownercore        # #135: owner-core caps externalized off core mcphandle (me; codes/chat/calendar next)
  pluginbooker:
    in: internal/plugins/booker           # #135 Slice 4: booking cluster (list_slots / cancel / policy / store) drained off the kernel
  jobsuc:
    in: internal/plugins/jobs/jobsuc      # J.2: jobs plugin usecases (jobs / resume / applications)
  jobsmcp:
    in: internal/plugins/jobs/jobsmcp     # J.3: jobs plugin MCP capabilities + views + helpers
  mcputil:
    in: internal/mcputil                  # shared owner-MCP result marshaller (mcphandle + owner-cap plugins)
  jobsadmin:
    in: internal/plugins/jobs/jobsadmin   # J.4: jobs plugin admin REST routes (drafts / applications list)
  jobcache:
    in: internal/plugins/jobs/cache       # J phase: jobs plugin cache sub-pkg (Redis 1d TTL)
  jobfetch:
    in: internal/plugins/jobs/fetch       # J phase: jobs plugin fetch sub-pkg (Greenhouse / Lever / Ashby / ...)
  jobdedup:
    in: internal/plugins/jobs/dedup       # J.6c: cross-source dedup (canonical URL + composite key)
  gotenberg:
    in: internal/gotenberg                # HTTP client for the Gotenberg PDF render sidecar
  printsess:
    in: internal/printsess                # Redis 60s stash for gotenberg-bound resume payload
  jobregistry:
    in: internal/jobregistry              # Monitor: in-process scheduled-job registry (last-run/status)
  marketplace:
    in: internal/marketplace              # skill marketplace aggregation client (GitHub + SkillsMP)
  stats:
    in: internal/stats                    # #135: Monitor 观测面领域值对象 (activity/growth/graph/jobs)
  security:
    in: internal/security                 # #135: 请求级防护域 (banned_ip; captcha/replay 后续并入)
  jobsdomain:
    in: internal/jobsdomain                # #135: jobs 领域值对象 (fetched_job/job_source/application/resume*)；leaf, 依赖 domain 拿 AccessCode
  conversationdomain:
    in: internal/conversationdomain        # #135: conversation 领域值对象 (chat/dialog/message/chat_report/citation)；依赖 corpusdomain 拿 DocumentGenre
  corpusdomain:
    in: internal/corpusdomain              # #135: corpus 领域值对象 (content/document/raw/wiki/writing/output/cover/tree_node/asset/uri/visibility)；依赖 domain 拿 Timestamps/Integration
  accessdomain:
    in: internal/accessdomain              # #135: access 领域值对象 (access_code/access_request/visitor_profile)；pure leaf
  captcha:
    in: internal/captcha                  # Cloudflare Turnstile / noop captcha verifier abstraction
  sandbox:
    in: internal/sandbox                  # owner-curated skill script 在 docker container 里跑
  capreg:
    in: internal/capreg              # Phase B Capability registry: visitor + owner MCP 三处消费的统一注册口
  prompts:
    in: internal/prompts                  # Phase D-1: system prompt fragments 单一源 (md files + go:embed)
  mcpclient:
    in: internal/mcpclient                # 调外部 MCP server (owner-registered)
  mcpplugin:
    in: internal/mcpplugin                # C1: 装机插件 manifest 解析 + 发现来源 (leaf)
  capsocket:
    in: internal/capsocket                # 窄 unix-socket host 服务：断网沙箱插件经 bind 进的 socket 调后端 op (leaf)
  sandboxws:
    in: internal/sandboxws                # per-session 沙箱工作区生命周期：懒建/TTL/cron sweep (leaf)
  storage:
    in: internal/storage                  # MinIO/S3 对象存储 (图片 / 附件)
  mailer:
    in: internal/mailer                   # 出站 SMTP 发信 (net/smtp，owner 自带 mail server)
  connector:
    in: internal/connector                # Phase B: Nango-style 连接器层 —— 解密凭据 + 代调外部 (gcal/mailer)；凭据永不出 vault 进 usecases
  connectoropenapi:
    in: internal/connector/openapi        # #155: 通用 openapi 连接器执行核（spec+JSONata+HTTP）；schemaless-JSON 边界，leaf
  connectorcontract:
    in: internal/connector/contract       # #135 Slice A: 连接器轴的类型化 CATEGORY 契约 (CalendarProxy + DTO)；内核零类型句柄，契约住这
  connectorconsumer:
    in: internal/connector/consumer       # #135: 连接器轴消费者契约 leaf (AgentToolConnector/AgentOp/ErrMailNotConfigured)；无 CalendarProxy，内核可依赖
  connectorbuiltins:
    in: connectors                        # built-in connector data (embedded manifest/spec/binding) + Load — own top-level dir, out of internal/
  connectorsvc:
    in: internal/connectorsvc             # #155: 连接器 admin 编排（凭据/connect/oauth dance/activate）——routes 层之下，cyclop ≤5
  cryptobox:
    in: internal/cryptobox                # AES-GCM 对称加密 helper（owner key 存储等）
  capstore:
    in: internal/capstore                 # #135 constrained-reachback: per-plugin 隔离 JSONB 存储（每 connector/mcp 一 schema）；leaf，只依赖 pgx
  retry:
    in: internal/retry                    # #132 通用可配重试 infra（退避/封顶/retryable/ctx 打断）；leaf，connector 代调架其上
  httpx:
    in: internal/httpx                    # #132 唯一出站 HTTP client（retry+timeout+可组合 base）；leaf，所有出站者依赖它
  search:
    in: internal/search                   # 1b corpus 词法检索 Meili 封装；leaf，只依赖 meili SDK
  facadeparity:
    in: internal/facadeparity             # facade-parity 强制 gate 机制；纯 std leaf，无 internal/vendor 依赖
  paritymanifest:
    in: internal/paritymanifest           # facade-parity 的具体 owner manifest + 真 facade 对照；依赖 facadeparity
  sysroutes:
    in: internal/routes/sys
  adminroutes:
    in: internal/routes/admin
  publicroutes:
    in: internal/routes/public            # /api/v1/* — SDK / visitor entry
  pubapi:
    in: internal/routes/pubapi            # /api/pub/v1/* — API-key facade (facade-directions.md)
  connectorroutes:
    in: internal/routes/connector         # socket 入站 API controller: connector.invoke (薄壳→connector.Slots)
  capstoreroutes:
    in: internal/routes/capstore          # socket 入站 API controller: capstore.* (薄壳→BoundStore)
  ownerroutes:
    in: internal/routes/owner             # socket 入站 API controller: owner.meta (薄壳→OwnerMetaLookup)
  reportroutes:
    in: internal/routes/report            # socket 入站 API controller: report.store (sanitize/render/store)
  conversationroutes:
    in: internal/routes/conversation      # socket 入站 API controller: conversation.read
  inferenceroutes:
    in: internal/routes/inference         # socket 入站 API controller: inference.generate
  server:
    in: internal/server
  cmd:
    in: cmd/server

deps:
  # Domain 纯内核，无 internal 依赖。
  domain:
    mayDependOn: []
    anyVendorDeps: true

  # Usecases 编排 domain + infra（postgres / session / inference / jobcache / jobfetch）。
  # PDF 渲染走 usecases.PDFRenderer 接口；实现（gotenberg）由 wireup 注入，
  # usecases 自己不引 gotenberg 包。
  usecases:
    mayDependOn:
      - accessdomain
      - corpusdomain
      - conversationdomain
      - domain
      - postgres
      - session
      - inference
      - cryptobox
      - sandbox
      - mcpclient
      - storage
      - capreg
      - prompts
      - mcpplugin
      - capsocket
      - search
      - connectorconsumer
      - marketplace
    anyVendorDeps: true

  # mailer —— 出站 SMTP 发信 leaf 包，纯 stdlib (net/smtp)，无 internal 依赖。
  mailer:
    mayDependOn: []
    anyVendorDeps: true

  # search —— 1b corpus 词法检索 Meili 封装 leaf：只依赖 meili SDK（vendor），无 internal 依赖。
  search:
    mayDependOn: []
    anyVendorDeps: true

  # facadeparity —— facade-parity 强制 gate 的 facade-无关机制：std（fmt/sort/strings）+ 测试
  # testify；无 internal 依赖。真源 manifest + 真 facade 枚举在上层接线（不入本 leaf）。
  facadeparity:
    mayDependOn: []
    anyVendorDeps: true

  # paritymanifest —— facade-parity 的具体 owner 能力 manifest（真源）+ 真 facade 对照。只依赖
  # facadeparity（机制）；被 pluginownercore 的 conformance test 消费。
  paritymanifest:
    mayDependOn:
      - facadeparity
    anyVendorDeps: false

  # connector —— Phase B Nango-proxy 层：唯一解密 owner 凭据 + 代调外部
  # (gcal / mailer) 的地方。usecases 只持 CalendarProxy / MailProxy 接口，
  # 凭据永不进 usecases。实现外部能力 → 依赖 gcal + mailer + domain；
  # 复用 usecases 的 DTO 类型 (FreeBusyReq / MailMessage 等) → 依赖 usecases。
  connector:
    mayDependOn:
      - domain
      - connectorcontract
      - connectorconsumer
      - mailer
      - retry
      - httpx
      - connectoropenapi
    anyVendorDeps: true

  # connectorconsumer —— 连接器轴消费者契约 leaf(AgentToolConnector/AgentOp/ErrMailNotConfigured)。
  # 纯 context/json/errors,无 internal 依赖:连接器实现它、内核装配面/owner工具/admin 消费它。
  connectorconsumer:
    mayDependOn: []
    anyVendorDeps: true

  # connectorroutes —— socket 入站 API 的 controller 层(跟 HTTP routes 同层):connector.invoke 的薄壳,
  # 只解 socket 参数 + 转发进 connector 业务域(Invoker,由 connector.Slots 满足)。只依赖 capsocket 那根传输。
  connectorroutes:
    mayDependOn:
      - capsocket
    anyVendorDeps: true

  # capstoreroutes / ownerroutes —— 同 connectorroutes,socket 入站 API 的 controller 薄壳。
  capstoreroutes:
    mayDependOn:
      - capsocket
    anyVendorDeps: true
  ownerroutes:
    mayDependOn:
      - capsocket
      - domain
    anyVendorDeps: true
  reportroutes:
    mayDependOn:
      - capsocket
      - usecases
      - postgres
    anyVendorDeps: true
  conversationroutes:
    mayDependOn:
      - capsocket
      - postgres
    anyVendorDeps: true
  inferenceroutes:
    mayDependOn:
      - capsocket
      - inference
    anyVendorDeps: true

  # connectorcontract —— #135 Slice A: 连接器轴的类型化 CATEGORY 契约 (CalendarProxy + DTO)。
  # 纯 context/time,无 internal 依赖:连接器实现它、能力插件消费它、组装根接线,内核持零句柄。
  connectorcontract:
    mayDependOn: []
    anyVendorDeps: true

  # pluginbooker —— #135 Slice 4: booking 逻辑 (owner list_slots / cancel + visitor cancel + policy
  # + store 契约) 从内核 drain 出来。只依赖 connectorcontract (CalendarProxy) + domain (BookingPolicy
  # / CodeBooking / BookConflict*)。store/proxy 都是接口,由组装根注入具体实现。
  pluginbooker:
    mayDependOn:
      - connectorcontract
      - domain
    anyVendorDeps: true



  # connectoropenapi —— #155 通用 openapi 执行核 leaf：spec 解析 + JSONata 绑定 + HTTP 代调。
  # 纯 stdlib + vendor (jsonata-go / yaml)，无 internal 依赖（provider 的一切都在 spec+binding
  # 数据里）。schemaless-JSON 边界，golangci 对本路径豁免 forbidigo `any`。
  connectoropenapi:
    mayDependOn: []
    anyVendorDeps: true

  # connectorbuiltins —— #155 内置连接器数据：embed 的 manifest/spec/binding 文件 + Load。
  # 装配走 connector.AssembleOpenAPI（依赖 connector）；yaml 解析（vendor）。
  connectorbuiltins:
    mayDependOn:
      - connector
    anyVendorDeps: true

  # connectorsvc —— #155 连接器 admin 编排：凭据/connect/oauth dance/activate/disconnect。
  # routes 层之下（cyclop ≤5，不受 routes ≤3 约束）。读写连接器存储 + 走 OAuth dance。
  connectorsvc:
    mayDependOn:
      - connector
      - postgres
      - domain
    anyVendorDeps: true

  # retry —— #132 通用可配重试 infra leaf：纯 stdlib (context/time)，无 internal 依赖。
  # connector 代调外部（gcal/mailer，第三方易抖）按 call-class 在它之上配策略（D-6/D-7）。
  retry:
    mayDependOn: []
    anyVendorDeps: true

  # httpx —— #132 唯一出站 HTTP client leaf：纯 stdlib (net/http/context/time)，无 internal 依赖。
  # check-no-raw-http lint 保证所有出站 http.Client 只在这里构造；各出站子系统依赖它。
  httpx:
    mayDependOn: []
    anyVendorDeps: true

  # sandbox 调外部 docker，仅依赖 stdlib + domain (SkillScript)。
  sandbox:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # capreg —— Phase B Capability interface + Registry。leaf-ish 包，
  # 只依赖 inference (ToolSpec / ToolExecutor) + domain (RoleSnapshot 类型)。
  # 具体 Capability 实现放在 usecases / mcp 等更高层，反向 import 本包注册。
  capreg:
    mayDependOn:
      - accessdomain
      - inference
      - domain
    anyVendorDeps: true

  # prompts —— Phase D-1: leaf 包，只 stdlib (embed)；所有引 system prompt
  # fragment 的地方 (usecases capability impl / sysroutes endpoint /
  # publicroutes endpoint) 都从这里 load，不再硬编码字符串。
  prompts:
    mayDependOn: []
    anyVendorDeps: true

  # mcpclient 调 owner-registered 外部 MCP HTTP server。
  mcpclient:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # capsocket —— 窄 host unix-socket 服务 leaf：line-JSON 分发，无 internal 依赖。
  capsocket:
    mayDependOn: []
    anyVendorDeps: true

  # storage 是 S3 / MinIO 客户端，纯 vendor + stdlib。
  storage:
    mayDependOn: []
    anyVendorDeps: true

  # Postgres Repository 把 sqlc 生成的 dbq 映射到 domain types。
  # cryptobox 给 owner-supplied key 落盘前加密（AI provider key 等）。
  postgres:
    mayDependOn:
      - accessdomain
      - corpusdomain
      - conversationdomain
      - jobsdomain
      - domain
      - dbq
      - cryptobox
      - stats
      - security
    anyVendorDeps: true

  # sqlc 生成的查询代码；其他业务不该直接 import，必须经 postgres Repository。
  dbq:
    mayDependOn: []
    anyVendorDeps: true

  # Session 管理 setup token、login session、API token。
  # domain 是单向值对象（PathPermission 等）—— session 内置入参/出参字段，
  # 不耦合业务逻辑。其他 internal 包仍走 narrow interface 注入。
  session:
    mayDependOn: [domain, accessdomain]
    anyVendorDeps: true

  config:
    mayDependOn: []
    anyVendorDeps: true

  # apierr 是无依赖的 envelope 翻译 util；任何 routes 包可 import 来做
  # error → HTTP envelope 映射。
  apierr:
    mayDependOn: []
    anyVendorDeps: true

  # middleware 包含 owner auth gate（WithOwner）+ CSRF gate + LoginGuard
  # (rate-limit + captcha + equal-time)。session 给 token lookup；captcha
  # 给 LoginGuard 的 Verifier 接口。
  middleware:
    mayDependOn:
      - session
      - captcha
    anyVendorDeps: true

  # mcphandle 是 owner AI 客户端用的 MCP server (controller 层)；通过 OwnerLookup
  # 接口注入 owner profile 查询，避免直接 import postgres；usecases 提供 token verify。
  mcphandle:
    mayDependOn:
      - domain
      - usecases
      - capreg
      - mcputil
      - jobsuc
      - jobsmcp
      - httpx
    anyVendorDeps: true

  # inference 是 LLM provider 抽象（Anthropic / OpenAI / Mock）。
  # 不依赖任何 internal（纯接口 + 实现 + sentinel errors）。
  # cryptobox: resolver 用来解密 byoai key (Redis 拿到的是密文)；其他业务
  # 仍走 narrow OwnerLookup 接口，不耦合具体 repo。
  inference:
    mayDependOn:
      - cryptobox
      - domain   # AICredential value object，统一 byoai 跟 owner key 的 shape
      - httpx
    anyVendorDeps: true

  # agentcore —— public facade：把 internal/inference 的 agentic loop 表面
  # (AgentSink / AgentTurnInput / BuildAgentIterator / DriveAgentLoop) re-export
  # 给 out-of-module driver (eval-harness)。loop 表面无逻辑，纯 alias +
  # pass-through。F.2 起多一个 BuildVisitorAgent：驱动真 visitor capability 装配
  # (usecases.RegisterVisitorSkills + AssembleVisitor + ComposeSystemPrompt) over
  # fixture 数据源，所以多依赖 usecases/capreg/domain/postgres —— 跑的是
  # prod 同一套 agentic 功能，只换注入的 repo。backend 内部无人 import 它。
  agentcore:
    mayDependOn:
      - corpusdomain
      - inference
      - usecases
      - capreg
      - domain
      - postgres
      - sandbox
      - mcpplugin
      - capsocket
    anyVendorDeps: true

  # jobcache —— Redis-backed 1d TTL 池子，存 fetcher 抓的 FetchedJob。
  # plugins —— J phase: Plugin interface + Registry + optional hooks
  # (CapabilityRegistrar / AdminRouter)。J.5 起 hooks 需要 capreg +
  # chi (vendor)；boundary 仍 leaf 不耦合任何业务包。
  plugins:
    mayDependOn:
      - domain
      - capreg
    anyVendorDeps: true

  # pluginjobs —— J phase: jobs plugin entry。J.5 起持 Deps 闭包 + 实现
  # CapabilityRegistrar (调 jobsmcp) + AdminRouter (调 jobsadmin)；
  # 它是 jobs plugin 整套面 (uc / mcp / admin / fetch / cache) 的拼装层。
  pluginjobs:
    mayDependOn:
      - plugins
      - capreg
      - jobcache
      - jobfetch
      - jobsuc
      - jobsmcp
      - jobsadmin
      - postgres
    anyVendorDeps: true

  # pluginownercore —— #135: owner-core owner-MCP caps externalized off core mcphandle. Self-contained:
  # its own narrow OwnerLookup interface (postgres.OwnerRepo satisfies it structurally at cmd), so no
  # postgres import here. Registers into capreg via the plugins.CapabilityRegistrar hook.
  pluginownercore:
    mayDependOn:
      - accessdomain
      - corpusdomain
      - conversationdomain
      - plugins
      - capreg
      - domain
      - mcputil
      - usecases
      - httpx
      - paritymanifest
      - connectorcontract
      - connectorconsumer
      - pluginbooker
      - stats
      - security
    anyVendorDeps: true

  # jobsuc —— J.2: jobs plugin usecases。J 期前住 usecases；搬过来后跟核
  # 心 usecases 同款依赖集 (domain/postgres/cryptobox + jobfetch/jobcache)。
  # 依赖核心 usecases 是因为复用 ErrEmptyField 这种通用 sentinel；后续 J
  # 期把 sentinel 抽到 domain 后可断这条。
  jobsuc:
    mayDependOn:
      - jobsdomain
      - domain
      - postgres
      - usecases
      - jobcache
      - jobfetch
      - jobdedup
    anyVendorDeps: true

  # jobdedup —— J.6c: cross-source dedup (canonical URL + composite key)。
  # 纯函数；只依赖 domain.FetchedJob shape。
  jobdedup:
    mayDependOn:
      - jobsdomain
      - domain
    anyVendorDeps: true

  # jobsmcp —— J.3: jobs plugin MCP capabilities + result wire views。
  # 跨 capreg 注册到核心 Registry；依赖 jobsuc 拿 *Deps。
  jobsmcp:
    mayDependOn:
      - jobsdomain
      - domain
      - capreg
      - mcputil
      - jobsuc
    anyVendorDeps: true

  # mcputil —— shared owner-MCP result marshaller. Leaf: only capreg (for MCPResult).
  mcputil:
    mayDependOn:
      - capreg
    anyVendorDeps: true

  # jobsadmin —— J.4: jobs plugin admin REST routes (drafts / applications list)。
  # 自包响应 helpers (writeServerErr / nullTime)，不抄 adminroutes 的 Handlers。
  jobsadmin:
    mayDependOn:
      - jobsdomain
      - domain
      - postgres
      - middleware
      - apierr
    anyVendorDeps: true

  # 依赖 domain 是因为它要 marshal 真实 domain 结构（不糊弄成 []byte）。
  jobcache:
    mayDependOn:
      - jobsdomain
      - domain
    anyVendorDeps: true

  # jobfetch —— 6+ 个 source adapter（Greenhouse / Lever / Ashby / RemoteOK
  # / WWR / HN / SmartRecruiters / Workable）。纯外部 HTTP，依赖 domain 是
  # 为了返回 FetchedJob。各 adapter 的 base URL 可被 env 覆写（e2e mock）。
  jobfetch:
    mayDependOn:
      - jobsdomain
      - domain
      - httpx
    anyVendorDeps: true

  # gotenberg —— thin HTTP client for the Gotenberg sidecar (headless
  # Chromium PDF rendering). usecases.PDFRenderer 接口的 v1 实现。
  # 不依赖 domain / postgres —— 调 RenderURL(printURL) 就完事；wireup 里
  # 通过 adapter 把 *domain.Application + qrURL 编码进 print URL。
  gotenberg:
    mayDependOn:
      - httpx
    anyVendorDeps: true

  # printsess —— Redis 60s 一次性 stash，存放 gotenberg 取走的 resume
  # 渲染 payload (application + qrURL)。
  # sys routes 读它（/internal/print-session/{token}），wireup 里 gotenberg
  # adapter 写它。
  printsess:
    mayDependOn:
      - jobsdomain
      - domain
    anyVendorDeps: true

  jobregistry:
    mayDependOn:
      - domain
      - stats
    anyVendorDeps: true

  # stats —— #135 Monitor 观测面领域值对象 leaf：从现有行派生的只读快照，无 internal 依赖。
  stats:
    mayDependOn: []
    anyVendorDeps: true

  # security —— #135 请求级防护域 leaf：BannedIP 值对象（captcha/replay 后续并入），无 internal 依赖。
  security:
    mayDependOn: []
    anyVendorDeps: true

  # jobsdomain —— #135 jobs 领域值对象 leaf：依赖 accessdomain（CommittedApplication 内嵌 AccessCode）。
  jobsdomain:
    mayDependOn:
      - accessdomain
    anyVendorDeps: true

  # conversationdomain —— #135 conversation 领域值对象：Citation.Genre = corpusdomain.DocumentGenre。
  conversationdomain:
    mayDependOn:
      - corpusdomain
    anyVendorDeps: true

  # corpusdomain —— #135 corpus 领域值对象：实体依赖 domain 的共享 VO（Timestamps/Integration）。
  corpusdomain:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # accessdomain —— #135 access 领域值对象 leaf：AccessCode/CodeMember/AccessRequest/VisitorProfile，无 internal 依赖。
  accessdomain:
    mayDependOn: []
    anyVendorDeps: true

  # marketplace —— skill marketplace 聚合客户端（GitHub anthropics/skills +
  # SkillsMP HTTP API + in-memory cache）。usecases 通过接口注入，admin
  # routes 不直接 import。
  marketplace:
    mayDependOn:
      - domain
      - httpx
    anyVendorDeps: true

  # captcha —— Cloudflare Turnstile + noop verifier。Verifier 接口注入到
  # middleware (LoginGuard) 做请求级校验。无 internal 依赖（接收 secret /
  # token / IP 全是 string，输出 sentinel error）。
  captcha:
    mayDependOn:
      - httpx
    anyVendorDeps: true

  # cryptobox 是无依赖的 AES-GCM helper；任何 internal 包可以 import 来落盘
  # 加密。本身只读 INSTANCE_SECRET env，不绕回任何 internal 模块。
  cryptobox:
    mayDependOn: []
    anyVendorDeps: true

  # capstore —— per-plugin 隔离文档存储（每 connector/mcp 一 schema）。leaf：只依赖 pgx，
  # 不绕回任何 internal 业务模块。schema 名从 host 可信 (kind,id) 推 + DROP 守卫见包内。
  capstore:
    mayDependOn: []   # #135: socket.go(capstore.* host op)已移到 internal/routes/capstore;本包回归纯 leaf
    anyVendorDeps: true


  # sys routes (/internal/healthz, tls-ask, log, builds) 需要 ping db / redis
  # 所以可以 import postgres。redis 客户端是 vendor。domain 也用得到：
  # /internal/builds/claim 在 no-pending 时返 ErrCustomPageBuildNotFound。
  sysroutes:
    mayDependOn:
      - domain
      - postgres
      - printsess
      - session
      - usecases
      - capreg
      - sandboxws
      - connectorcontract  # #155 连接器 diag：CalendarProxy/DTO 类型契约
      - middleware  # #155 连接器 diag：owner id 从 context（middleware.OwnerIDFrom）
    anyVendorDeps: true

  # sandboxws —— per-session 沙箱工作区生命周期 leaf：纯 stdlib (os/filepath/sync/time)。
  sandboxws:
    mayDependOn: []
    anyVendorDeps: true

  # admin routes (/api/admin/*) 派发到 usecases；handler 自己 cyclo ≤3。
  # 需要 domain（sentinel errors 翻译）+ session（first-run.txt 清理 / cookie 名）
  # + usecases + apierr（error envelope）+ middleware（ctx key + cookie 名）。
  adminroutes:
    mayDependOn:
      - accessdomain
      - corpusdomain
      - conversationdomain
      - domain
      - usecases
      - obsidian
      - session
      - postgres
      - apierr
      - middleware
      - storage
      - connectorconsumer
      - inference   # /ai-provider/presets 暴露 preset 表给 admin UI
      - connector   # /connectors/* 经连接器层（不直碰 gcal/mailer）
      - connectorcontract # #135 Slice 5: /connectors/mail 凭据表单 + 测试发信走 MailProxy 契约
      - connectorsvc # #155 /connectors/* 编排（凭据/connect/oauth/activate）抽到 service
      - capreg      # Phase H /capabilities：列 registry origin + owner-enable 开关
      - pluginbooker # #190 /bookings + /booking-policy: booker.CodeBooking / BookingPolicy types
      - marketplace # /marketplace: writeMarketplace renders []marketplace.MarketSkill
      - stats       # #135 /stats/*: Monitor activity/growth/graph/jobs value objects
      - security    # #135 /ip-bans: BannedIP value object
    anyVendorDeps: true

  # obsidian —— Obsidian vault 双向 sync 子用例：frontmatter codec / image
  # ref rewriter / zip export / multipart import。靠 usecases.SavePost 走
  # 那条 atomic asset 路径，所以单向依赖 usecases；不被 usecases 反向 import。
  obsidian:
    mayDependOn:
      - corpusdomain
      - domain
      - usecases
      - postgres
      - storage
    anyVendorDeps: true

  # public routes (/api/v1/*) —— SDK + visitor 落地点；走 visitor session
  # token bearer auth；SSE 流式 chat。
  publicroutes:
    mayDependOn:
      - accessdomain
      - corpusdomain
      - conversationdomain
      - domain
      - usecases
      - session
      - inference
      - apierr
      - capreg # D-2: /api/v1/sessions 返 capability_state + part_ids，读 Registry
      - cryptobox   # BYOAI envelope (HKDF + AES-GCM) 解封 X-BYOAI-Key header
      - httpx   # #132 /api/v1 inference-models 列表探测走统一 client
      - prompts     # GET /api/v1/prompts/{id} 直接 dump fragment 文本
      - gotenberg   # GET /report/{id}/pdf —— ErrNotConfigured sentinel + ReportPDFRenderer
      - pluginbooker # #135 Slice 4: visitor cancel-own-booking usecase
    anyVendorDeps: true

  # pubapi —— API-key facade. Reuses the visitor assembly (capreg) + usecases; whitelists non-Agentic
  # outward tools via paritymanifest. Own auth (api-key), no CSRF/owner-session.
  pubapi:
    mayDependOn:
      - domain
      - usecases
      - capreg
      - paritymanifest
    anyVendorDeps: true

  # server 装配 chi 路由 + middleware；挂 admin / sysroutes / mcphandle / public sub-router。
  server:
    mayDependOn:
      - sysroutes
      - adminroutes
      - publicroutes
      - pubapi
      - usecases
      - session
      - middleware
      - mcphandle
      - postgres
      - captcha
      - plugins
    anyVendorDeps: true

  # cmd/ 是 composition root —— 唯一允许跨所有 layer 的地方。
  cmd:
    mayDependOn:
      - jobsdomain
      - config
      - domain
      - postgres
      - session
      - usecases
      - sysroutes
      - adminroutes
      - publicroutes
      - pubapi
      - connectorroutes
      - capstoreroutes
      - ownerroutes
      - reportroutes
      - conversationroutes
      - inferenceroutes
      - mcphandle
      - inference
      - jobcache
      - jobfetch
      - jobsuc
      - gotenberg
      - connector
      - connectorbuiltins
      - connectorsvc
      - printsess
      - jobregistry
      - marketplace
      - security
      - captcha
      - cryptobox
      - sandbox
      - mcpclient
      - mcpplugin
      - storage
      - server
      - capreg
      - plugins
      - pluginjobs
      - pluginownercore
      - capsocket
      - capstore
      - connectorconsumer
      - sandboxws
      - search
      - connectorcontract
      - pluginbooker
    anyVendorDeps: true
