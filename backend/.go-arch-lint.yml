version: 3
workdir: .
allow:
  depOnAnyVendor: true   # third-party libs (chi, pgx, mcp-go, anthropic-sdk-go, etc)
                         # usable by any component; this only constrains internal's dependency graph.
  deepScan: false        # cmd/server/main.go is the composition root,
                         # crossing all layers is expected; deepScan off avoids false positives.

# test files don't participate in arch constraints — the arch graph governs production deps; external
# test packages importing themselves, cross-layer imports, are all normal and shouldn't trip arch rules.
excludeFiles:
  - "^.*_test\\.go$"
  # composition root plugin wiring file: the one place that imports externalized capability modules
  # (own go.mod, import path under the standmeet root prefix, arch-lint treats as internal but can't
  # map it to a group) for in-process loading. Same reason as deepScan being off for cmd — the
  # composition root crossing boundaries is expected and shouldn't trip the internal dep-graph rules.
  - "^.*cmd/server/plugins\\.go$"

# Component naming aligned with Otium auth. infra is sliced by external system (postgres / inference /
# storage / sandbox each independent) rather than a flat infra/.
components:
  obsidian:
    in: internal/corpus/obsidian          # Obsidian vault import/export (corpus sub-module)
  archcheck:
    in: tools/archcheck                   # build-time lint tool: internal/'s import-graph gates
  pgstore:
    in: internal/infra/pgstore                   # #135 shared DB store primitives (Pool/DBTX/uuid/crypto); domain-less infra
  dbfiles:
    in: db                                       # go:embed carrier for schema.sql + migrations/; only pgstore can reach it
  depcheck:
    in: internal/infra/depcheck                  # checks at startup whether a hand-copied dependency table has a missing row; domain-less leaf
  textcut:
    in: internal/infra/textcut                   # safe char/byte-bounded text truncation (single implementation); domain-less leaf
  plaintext:
    in: internal/infra/plaintext                 # inbound HTML → readable text (single implementation); domain-less leaf
  providermodels:
    in: internal/infra/providermodels            # asks an inference endpoint which models it has (single implementation); shared by both faces, domain-less leaf
  session:
    in: internal/infra/session
  config:
    in: cmd/server/config
  apierr:
    in: internal/infra/apierr                   # HTTP error envelope translation helper
  clientaddr:
    in: internal/infra/clientaddr               # decides once whether the source address is the visitor's; readers share the same answer
  middleware:
    in: internal/infra/middleware               # chi middleware: WithOwner, RequireCSRF
  mcphandle:
    in: internal/routes/mcphandle         # owner MCP handles (controller layer): mcp-go server + tool handlers
  dispatcher:
    in: internal/routes/dispatcher        # outbound convergence: each capability declares itself once, each face (MCP/admin) is a projection of it
  inference:
    in: internal/conversation/inference                # LLM provider abstraction
  agentcore:
    in: agentcore                         # public facade over the agentic loop (entry point for eval-harness and other out-of-module drivers)
  pluginjobs:
    in: internal/owner/jobs             # J phase: jobs plugin entry (Plugin impl)
  jobsuc:
    in: internal/owner/jobs/jobsuc      # J.2: jobs plugin usecases (jobs / resume / applications)
  jobsmcp:
    in: internal/owner/jobs/jobsmcp     # J.3: jobs plugin MCP capabilities + views + helpers
  mcputil:
    in: internal/capabilities/mcputil                  # shared owner-MCP result marshaller (mcphandle + owner-cap plugins)
  jobsadmin:
    in: internal/owner/jobs/jobsadmin   # J.4: jobs plugin admin REST routes (drafts / applications list)
  jobcache:
    in: internal/owner/jobs/cache       # J phase: jobs plugin cache sub-pkg (Redis 1d TTL)
  jobfetch:
    in: internal/owner/jobs/fetch       # J phase: jobs plugin fetch sub-pkg (Greenhouse / Lever / Ashby / ...)
  jobdedup:
    in: internal/owner/jobs/dedup       # J.6c: cross-source dedup (canonical URL + composite key)
  gotenberg:
    in: internal/infra/gotenberg                # HTTP client for the Gotenberg PDF render sidecar
  printsess:
    in: internal/owner/jobs/printsess                # Redis 60s stash for gotenberg-bound resume payload
  resumepdf:
    in: internal/owner/jobs/resumepdf                # resume Typst rendering: embedded template + typst subprocess + server-side QR
  marketplace:
    in: internal/marketplace/facade       # #135: marketplace domain facade (outward-facing protocol); outside the domain, only import this
  marketplaceentity:
    in: internal/marketplace/entity       # marketplace guts: value objects/entities + domain errors
  marketplacerepo:
    in: internal/marketplace/repo         # marketplace guts: repository (over db + pgstore)
  marketplaceusecase:
    in: internal/marketplace/usecase      # marketplace guts: usecases + marketplace-fetch client
  marketplaceops:
    in: internal/marketplace/ops          # marketplace guts: declaration of what this domain offers outward
  stats:
    in: internal/stats/facade             # #135: stats domain facade (outward-facing protocol); outside the domain, only import this
  statsentity:
    in: internal/stats/entity             # stats guts: read-model value objects
  statsrepo:
    in: internal/stats/repo               # stats guts: query repository (over db + pgstore)
  statsops:
    in: internal/stats/ops                # stats guts: declaration of what this domain offers outward
  security:
    in: internal/security/facade          # #135: request-level protection domain facade (banned_ip / captcha); outside the domain, only import this
  securityban:
    in: internal/security/ban             # security internals: IP ban entity+repo (sibling sub-package behind the facade)
  securitycaptcha:
    in: internal/security/captcha         # security internals: captcha Verifier+turnstile (sibling sub-package behind the facade)
  securityops:
    in: internal/security/ops             # security internals: declaration of what this domain offers outward
  jobsmodel:
    in: internal/owner/jobs/jobsmodel                # #135: jobs domain value objects (fetched_job/job_source/application/resume*); leaf, depends on domain for AccessCode
  conversation:
    in: internal/conversation/facade # #135: conversation domain facade (outward-facing protocol); outside the domain, only import this
  conversationentity:
    in: internal/conversation/entity # conversation guts: value objects/entities + domain errors
  conversationrepo:
    in: internal/conversation/repo   # conversation guts: repository (over db + pgstore)
  conversationops:
    in: internal/conversation/ops    # conversation guts: declaration of what this domain offers outward
  conversationusecase:
    in: internal/conversation/usecase # conversation guts: usecases/orchestration
  corpus:
    in: internal/corpus/facade       # #135: corpus domain facade (outward-facing protocol); outside the domain, only import this
  corpusentity:
    in: internal/corpus/entity       # corpus guts: per-genre value objects/entities + domain errors
  corpusi18n:
    in: internal/corpus/i18n         # corpus guts: multi-language structure (parse / diagnose / pick a face). Plain text, no deps
  builtincaps:
    in: capabilities                 # **declaration** of the built-in capabilities shipped with the product (manifest.yaml, go:embed); data only
  corpusrepo:
    in: internal/corpus/repo         # corpus guts: repository (over db + pgstore)
  corpususecase:
    in: internal/corpus/usecase      # corpus guts: usecases/orchestration + read port
  corpusops:
    in: internal/corpus/ops          # corpus guts: declaration of what this domain offers outward (id/schema/reach/impl)
  access:
    in: internal/access/facade       # #135: access domain facade (outward-facing protocol); outside the domain, only import this
  accessentity:
    in: internal/access/entity       # access guts: value objects/entities + domain errors (leaf)
  accessrepo:
    in: internal/access/repo         # access guts: repository (over db + pgstore)
  accessusecase:
    in: internal/access/usecase      # access guts: usecases/orchestration + narrow port
  accessops:
    in: internal/access/ops          # access guts: declaration of what this domain offers outward
  owner:
    in: internal/owner/facade        # #135: owner domain facade (outward-facing protocol); outside the domain, only import this
  ownerentity:
    in: internal/owner/entity        # owner guts: value objects/entities + domain errors
  ownerrepo:
    in: internal/owner/repo          # owner guts: repository (over db + pgstore + cryptobox)
  ownerusecase:
    in: internal/owner/usecase       # owner guts: usecases/orchestration
  ownerops:
    in: internal/owner/ops           # owner guts: declaration of what this domain offers outward
  sandbox:
    in: internal/capabilities/sandbox                  # owner-curated skill scripts run inside a docker container
  capabilities:
    in: internal/capabilities              # capability-axis domain doc (root)
  capload:
    in: internal/routes/capload            # capability-axis load/dispatch glue (ext-mcp / mcp-app / skill-runner / openapi-tools / register)
  capreg:
    in: internal/capabilities/capreg              # Phase B Capability registry: the single registration point consumed by all three (visitor + owner MCP)
  mcpclient:
    in: internal/capabilities/mcpclient                # calls an external MCP server (owner-registered)
  mcpplugin:
    in: internal/capabilities/mcpplugin                # C1: installed-plugin manifest parsing + discovery sources (leaf)
  capsocket:
    in: internal/capabilities/capsocket                # narrow unix-socket host service: the socket a network-isolated sandbox plugin binds into to call backend ops (leaf)
  sandboxws:
    in: internal/capabilities/sandboxws                # per-session sandbox workspace lifecycle: lazy-create/TTL/cron sweep (leaf)
  storage:
    in: internal/infra/storage                  # MinIO/S3 object storage (images / attachments)
  connector:
    in: internal/connector                # Phase B: Nango-style connector layer — decrypts credentials + relays to external services (gcal/mailer); credentials never leave the vault into usecases
  connectoropenapi:
    in: internal/connector/openapi        # #155: generic openapi connector execution core (spec+JSONata+HTTP); schemaless-JSON boundary, leaf
  connectorcontract:
    in: internal/connector/contract       # #135 Slice A: typed CATEGORY contract for the connector axis (CalendarProxy + DTO); the kernel holds zero type handles, contracts live here
  connectorconsumer:
    in: internal/connector/consumer       # #135: connector-axis consumer contract leaf (AgentToolConnector/AgentOp/ErrMailNotConfigured); no CalendarProxy, the kernel may depend on it
  connectorbuiltins:
    in: connectors                        # built-in connector data (embedded manifest/spec/binding) + Load — own top-level dir, out of internal/
  capabilitybuiltins:
    in: capabilities                      # built-in capability data (embedded manifest.yaml) + Load — same shape as connectors, both axes share one address form
  cryptobox:
    in: internal/infra/cryptobox                # AES-GCM symmetric encryption helper (owner key storage, etc)
  capconfig:
    in: internal/capabilities/capconfig                # generic read/write for capability-configurable fields (declared in the manifest, values land in capstore); the host knows the meaning of no field
  capquota:
    in: internal/capabilities/capquota                 # per-code usage ceiling: counted per the manifest's QuotaDecl, the host knows no business term
  capstore:
    in: internal/capabilities/capstore                 # #135 constrained-reachback: per-plugin isolated JSONB storage (one schema per connector/mcp); leaf, depends only on pgx
  retry:
    in: internal/infra/retry                    # #132 generic configurable-retry infra (backoff/cap/retryable/ctx cancel); leaf, connector call-relaying builds on it
  httpx:
    in: internal/infra/httpx                    # #132 the single outbound HTTP client (retry+timeout+composable base); leaf, every outbound caller depends on it
  search:
    in: internal/corpus/search                   # corpus sub-package: lexical search Meili wrapper (1b); leaf, depends only on the meili SDK
  facadeparity:
    in: internal/infra/facadeparity             # facade-parity enforcement gate mechanism; pure std leaf, no internal/vendor deps
  paritymanifest:
    in: internal/infra/paritymanifest           # the concrete owner manifest for facade-parity + the real facade to compare against; depends on facadeparity
  sysroutes:
    in: internal/routes/sys
  adminroutes:
    in: internal/routes/admin
  publicroutes:
    in: internal/routes/public            # /api/v1/* — SDK / visitor entry
  pubapi:
    in: internal/routes/pubapi            # /api/pub/v1/* — API-key facade (facade-directions.md)
  connectorroutes:
    in: internal/routes/connector         # inbound socket API controller: connector.invoke (thin shell → connector.Slots)
  capstoreroutes:
    in: internal/routes/capstore          # inbound socket API controller: capstore.* (thin shell → BoundStore)
  capconfigroutes:
    in: internal/routes/capconfig         # inbound socket API controller: capconfig.get (thin shell → BoundConfig)
  hostdesk:
    in: internal/routes/hostdesk          # inbound convergence: domains declare host ops, each capability's socket is a projection of it
  hostop:
    in: internal/infra/hostop             # the inbound vocabulary (Op/Invoke/socket path rules); leaf, knows no domain
  periodic:
    in: internal/infra/periodic           # single scheduling point for periodic tasks: the declarer says "what to do", this handles "how often + bookkeeping"
  buildnotify:
    in: internal/infra/buildnotify        # in-memory broadcast waking microsite preview long-pollers on build completion; domain-less leaf (stdlib sync only)
  selfstat:
    in: internal/infra/selfstat           # reads THIS container's own cgroup (CPU/mem) for the System panel; leaf (stdlib only, no docker socket)
  # cmd — the composition root, now split into five packages + the startup sequence on the root. For
  # **layering** purposes they're one thing: the one place allowed to cross all layers. Direction between
  # them is one-way: deps ← port ← axisconn ← axiscap ← wire ← cmd.
  cmd:
    in: cmd/server
  cmddeps:
    in: cmd/server/deps                   # the running set of things: data only, no wiring (leaf)
  cmdport:
    in: cmd/server/port                   # composition root's implementation of a narrow port a domain declares
  cmdaxisconn:
    in: cmd/server/axisconn               # wiring for the connector axis
  cmdaxiscap:
    in: cmd/server/axiscap                # wiring for the capability axis
  cmdwire:
    in: cmd/server/wire                   # wires up a mechanism (the two convergence points / periodic tasks / search index)

  corpusdb:
    in: internal/corpus/db                # #135: corpus's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  conversationdb:
    in: internal/conversation/db                # #135: conversation's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  accessdb:
    in: internal/access/db                # #135: access's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  ownerdb:
    in: internal/owner/db                # #135: owner's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  connectordb:
    in: internal/connector/db                # #135: connector's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  marketplacedb:
    in: internal/marketplace/db                # #135: marketplace's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  statsdb:
    in: internal/stats/db                # #135: stats's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  securitydb:
    in: internal/security/db                # #135: security's own sqlc DAO (each domain owns its repository); pure leaf, only pgx
  jobsdb:
    in: internal/owner/jobs/jobsuc/db                # #135: jobsuc's own sqlc DAO (each domain owns its repository); pure leaf, only pgx

deps:
  # mailer — the outbound SMTP send leaf package, pure stdlib (net/smtp), no internal deps.
  search:
    mayDependOn: []
    anyVendorDeps: true

  # archcheck —— build-time gate over internal/'s import graph. Reads the tree with go/parser;
  # imports NOTHING from internal/ (it must be able to run on a tree that does not compile).
  archcheck:
    mayDependOn: []
    anyVendorDeps: true

  # facadeparity — the facade-agnostic mechanism behind the facade-parity enforcement gate: std
  # (fmt/sort/strings) + testify for tests; no internal deps. The real source manifest + real facade
  # enumeration are wired in a higher layer (not inside this leaf).
  facadeparity:
    mayDependOn: []
    anyVendorDeps: true

  # paritymanifest — the concrete owner-capability manifest (source of truth) for facade-parity + the
  # real facade to compare against. Depends only on facadeparity (the mechanism); consumed by the
  # composition root's conformance test.
  paritymanifest:
    mayDependOn:
      - facadeparity
    anyVendorDeps: false

  # connector — Phase B Nango-proxy layer: the one place that decrypts owner credentials + relays calls
  # to external services (gcal / mailer). usecases hold only the CalendarProxy / MailProxy interfaces,
  # credentials never reach usecases. Implementing an external capability → depends on gcal + mailer +
  # domain; reusing usecases' DTO types (FreeBusyReq / MailMessage, etc) → depends on usecases.
  connector:
    mayDependOn:
      - connectordb
      - connector
      - connectorcontract
      - connectorconsumer
      - retry
      - httpx
      - connectoropenapi
      - cryptobox
      - pgstore
      # hostop — leaf for the inbound vocabulary. This domain's receipt back to the sandbox must
      # **carry the failure category** (`hostop.Faulted`); otherwise "never configured" and "can't
      # reach it right now" read as the same sentence to the visitor (F-C-42). The classification can
      # only happen here: the sentinels belong to this domain, and the connectorroutes thin shell isn't
      # designed to recognize them by design. This is exactly what the hostop comment means by
      # "only a domain can speak through it, without importing routes".
      - hostop
    anyVendorDeps: true

  # connectorconsumer — connector-axis consumer contract leaf (AgentToolConnector/AgentOp/ErrMailNotConfigured).
  # Pure context/json/errors, no internal deps: connectors implement it, the kernel's assembly face/owner
  # tools/admin consume it.
  connectorconsumer:
    mayDependOn: []
    anyVendorDeps: true

  # connectorroutes — controller layer for the inbound socket API (same layer as HTTP routes): the thin
  # shell for connector.invoke, only parses socket params + forwards into the connector business domain
  # (Invoker, satisfied by connector.Slots). Depends only on the capsocket transport.
  connectorroutes:
    mayDependOn:
      - hostop
    anyVendorDeps: true

  # capstoreroutes — same as connectorroutes, a controller thin shell for the inbound API.
  capstoreroutes:
    mayDependOn:
      - hostop
    anyVendorDeps: true

  # capconfigroutes — the sandbox reads its own config through this (defaults already backstopped by the
  # declaration). Same shape as capstoreroutes: a thin shell, bound at construction time to one cap, a
  # sandbox can't fill in another's.
  capconfigroutes:
    mayDependOn:
      - hostop
    anyVendorDeps: true

  # capconfig — generic read/write for capability config. Knows only capstore (where values are stored) +
  # mcpplugin (what the declaration looks like); recognizes no business field. The mount point is a
  # parameter (owner / code), not two code paths.
  capconfig:
    mayDependOn:
      - capstore
      - mcpplugin
    anyVendorDeps: true

  # capquota — per-code usage ceiling, enforced per the manifest's QuotaDecl: the ceiling reads
  # capconfig's code scope, usage counts one capstore collection. The gate and the remaining balance
  # share the same counter (was split once, only half got merged back).
  capquota:
    mayDependOn:
      - capconfig
      - capstore
      - mcpplugin
    anyVendorDeps: true
  # hostop — the inbound vocabulary. Leaf: it knows no domain, so a domain can speak through it without
  # importing routes.
  hostop:
    mayDependOn: []
    anyVendorDeps: true

  # periodic — a single schedule for periodic tasks. Leaf: it knows no domain, and doesn't know stats
  # either (the bookkeeping face is a narrow interface, the composition root hands in the JobRegistry),
  # so any party can declare its own periodic task without entangling anyone else.
  periodic:
    mayDependOn: []
    anyVendorDeps: true

  # buildnotify — in-memory broadcast for the preview long-poll. Leaf: stdlib sync only, knows no domain.
  buildnotify:
    mayDependOn: []
    anyVendorDeps: true

  # selfstat — THIS container's own cgroup usage for the System panel. Pure stdlib file reads
  # (/sys/fs/cgroup), no docker socket, no internal deps.
  selfstat:
    mayDependOn: []
    anyVendorDeps: true

  # hostdesk — inbound convergence, the mirror of the outbound dispatcher. It imports each domain's
  # **front door** (facade) + the two axes' own controller thin shells, gathers up the host ops each
  # declares, then dispatches by the name each capability's manifest points to.
  #
  # It didn't used to exist: each capability had its own hand-written gateway in the composition root,
  # each stood up its own socket, each hung its own verbs on top, so "what can the sandbox ask the host
  # for" had no answer. Same reasoning as dispatcher — of course the convergence point itself has to
  # know each domain.
  hostdesk:
    mayDependOn:
      - hostop
      - capsocket
      - conversation
      - corpus
      - owner
      - connectorroutes
      - capstoreroutes
      - capconfigroutes
    anyVendorDeps: true

  # connectorcontract — #135 Slice A: typed CATEGORY contract for the connector axis (CalendarProxy + DTO).
  # Pure context/time, no internal deps: connectors implement it, capability plugins consume it, the
  # composition root wires it, the kernel holds zero handles.
  connectorcontract:
    mayDependOn: []
    anyVendorDeps: true



  # connectoropenapi — #155 generic openapi execution core leaf: spec parsing + JSONata binding + HTTP
  # call relay. Pure stdlib + vendor (jsonata-go / yaml), no internal deps (everything about a provider
  # lives in the spec+binding data). schemaless-JSON boundary, golangci exempts this path from forbidigo
  # `any`.
  connectoropenapi:
    mayDependOn: []
    anyVendorDeps: true

  # connectorbuiltins — #155 built-in connector data: embedded manifest/spec/binding files + Load.
  # Assembly goes through connector.AssembleOpenAPI (depends on connector); yaml parsing (vendor).
  connectorbuiltins:
    mayDependOn:
      - connector
    anyVendorDeps: true

  # capabilitybuiltins — the **declaration** of built-in capabilities (embedded manifest.yaml) + Load.
  # Knows only mcpplugin (the shape of a declaration) and hostop (the rule that a socket path derives
  # from an id) — it knows no domain and does no assembly: assembly still happens at the composition
  # root, this just translates the on-disk form into the shape the host uses.
  capabilitybuiltins:
    mayDependOn:
      - mcpplugin
      - hostop
    anyVendorDeps: true

  retry:
    mayDependOn: []
    anyVendorDeps: true

  # httpx — #132 the single outbound HTTP client leaf: pure stdlib (net/http/context/time), no internal
  # deps. The check-no-raw-http lint guarantees every outbound http.Client is constructed only here;
  # every outbound subsystem depends on it.
  httpx:
    mayDependOn: []
    anyVendorDeps: true

  # providermodels — "which models does this inference endpoint have". **Shared by both faces** (F-R-11):
  # the visitor's BYOAI panel asks with its own key (routes/public); the owner face asks with no key, the
  # composition root unlocks the vault's key and asks (cmd). It's stateless, knows no domain.
  providermodels:
    mayDependOn:
      - apierr
      - httpx
    anyVendorDeps: true

  # sandbox calls external docker, depends only on stdlib + domain (SkillScript).
  sandbox:
    mayDependOn: []
    anyVendorDeps: true

  # capreg — Phase B Capability interface + Registry. A leaf-ish package,
  # depends only on inference (ToolSpec / ToolExecutor) + domain (RoleSnapshot type).
  # Concrete Capability implementations live in usecases / mcp etc, higher layers import this package to register.
  capabilities:
    mayDependOn:
      - capreg
      # periodic — the plugin declaration's optional hook for a periodic task uses its type; the scheduling itself isn't here.
      - periodic
    anyVendorDeps: true

  capload:
    mayDependOn:
      - capreg
      - mcpclient
      - mcpplugin
      - sandbox
      - conversation
      - access
      - marketplace
      - connectorconsumer
      - cryptobox
      # hostop — the loader derives this capability's socket path by the same rule (the manifest only says which ops it needs).
      - hostop
    anyVendorDeps: true
  capreg:
    mayDependOn:
      - access
      - inference
    anyVendorDeps: true

  # prompts — Phase D-1: a leaf package, stdlib only (embed); every place that pulls in a system prompt
  # fragment (usecases capability impl / sysroutes endpoint / publicroutes endpoint) loads from here now,
  # no more hardcoded strings.
  mcpclient:
    mayDependOn: []
    anyVendorDeps: true

  # capsocket — narrow host unix-socket service leaf: line-JSON dispatch, no internal deps.
  capsocket:
    mayDependOn: []
    anyVendorDeps: true

  # storage is an S3 / MinIO client, pure vendor + stdlib.
  storage:
    mayDependOn: []
    anyVendorDeps: true

  # pgstore — #135 shared DB store primitives leaf: module repos use it + their own <domain>/db(sqlc) persistence layer.
  pgstore:
    mayDependOn:
      - cryptobox
      # dbfiles — the migration .sql compiled into the binary (upgrades happen at backend startup).
      # Only this can reach it: if anyone could import it, "who owns the schema" would scatter across several places.
      - dbfiles
    anyVendorDeps: true

  # Session manages the setup token, login session, API token.
  # domain is a one-way value object (PathPermission etc) — session carries its own in/out params
  # inline, not coupled to business logic. Other internal packages still inject via a narrow interface.
  session:
    mayDependOn: [access]
    anyVendorDeps: true

  config:
    mayDependOn: []
    anyVendorDeps: true

  # apierr is a dependency-free envelope translation util; any routes package can import it to do
  # error → HTTP envelope mapping.
  apierr:
    mayDependOn: []
    anyVendorDeps: true

  # clientaddr — decides once whether the request's source address is the visitor's own, stashes the
  # verdict in context. A dependency-free leaf. Session billing / access-code locks / login rate-limit
  # all read the same answer instead of each parsing RemoteAddr separately — without a forwarding header,
  # what you'd parse out is the app's own hop, not the visitor (F-F-5).
  clientaddr:
    mayDependOn: []
    anyVendorDeps: true

  # middleware holds the owner auth gate (WithOwner) + CSRF gate + LoginGuard
  # (rate-limit + captcha + equal-time). session provides token lookup; captcha
  # provides the Verifier interface for LoginGuard.
  middleware:
    mayDependOn:
      - session
      - security
      - clientaddr   # login rate-limit's bucket key: the visitor's address; falls back to one named shared bucket when it can't be determined
    anyVendorDeps: true

  # mcphandle is the MCP server (controller layer) the owner's AI client uses; injects owner-profile
  # lookup through the OwnerLookup interface to avoid importing postgres directly; usecases provides
  # token verification.
  mcphandle:
    mayDependOn:
      - capreg
      - mcputil
      - jobsuc
      - jobsmcp
      - httpx
      - owner
      - dispatcher      # the MCP face = a projection of outbound convergence (generated)
      - facadeparity    # declares this face's parity profile (Facade profile)
    anyVendorDeps: true

  # dispatcher — outbound convergence. It imports each domain's **front door** (facade), gathers up the
  # operations each domain declares itself, then re-exports them; beyond that it knows only the
  # protocol-agnostic facadeparity (the Op/Reach/error-category vocabulary).
  #
  # This used to read "must not depend on any domain, a domain's functions get adapted into an Op at the
  # composition root and handed in." That constraint had a cascading cost: a domain couldn't say what it
  # can do → the declaration could only move to the one place that sees both sides (the composition root)
  # → the convergence point had to restate the domain's existing inputs/outputs → every resource carried
  # one extra hop of shuttling. The facade exists precisely to give the convergence point this path.
  dispatcher:
    mayDependOn:
      - facadeparity
      - access
      - conversation
      - corpus
      - marketplace
      - owner
      - security
      - stats
    anyVendorDeps: true

  # inference is the LLM provider abstraction (Anthropic / OpenAI / Mock).
  # Depends on no internal package (pure interface + implementation + sentinel errors).
  # cryptobox: the resolver uses it to decrypt the byoai key (Redis holds the ciphertext); other business
  # logic still goes through the narrow OwnerLookup interface, not coupled to a concrete repo.
  inference:
    mayDependOn:
      - access
      - owner
      - cryptobox
      - httpx
      # textcut — evidence summaries are truncated to a byte budget without splitting a character (single implementation, in infra).
      - textcut
    anyVendorDeps: true

  # agentcore — public facade: re-exports internal/inference's agentic-loop surface
  # (AgentSink / AgentTurnInput / BuildAgentIterator / DriveAgentLoop) to the out-of-module driver
  # (eval-harness). The loop surface has no logic, pure alias + pass-through. As of F.2 there's one more,
  # BuildVisitorAgent: drives the real visitor-capability assembly
  # (usecases.RegisterVisitorSkills + AssembleVisitor + ComposeSystemPrompt) over a fixture data source,
  # so it additionally depends on usecases/capreg/domain/postgres — it runs the exact same production
  # agentic feature set, only the injected repo changes. Nobody inside backend imports it.
  agentcore:
    mayDependOn:
      - capload
      - conversation
      - marketplace
      - corpus
      - inference
      - capreg
      - sandbox
      - mcpplugin
      - capsocket
      - access
      # eval mini-host — hangs the handful of things a **real** plugin needs: the inbound convergence
      # (word list and pick both use its one copy), the capability's own storage/config port, the owner
      # entity (the canned return type for owner.meta), the built-in manifest.
      # This is the composition root's job: agentcore is eval's composition root, the same role as cmd/server.
      - hostdesk
      - capstoreroutes
      - capconfigroutes
      - connectorroutes
      - ownerentity
      - builtincaps
      # conversation's two guts packages: the host port's shape carries their types (ChatWithMessages /
      # UpsertReportInput / ChatReport), so implementing those bridges outside the domain has to import
      # them — same reasoning as ownerentity, not a bypass of the facade.
      - conversationentity
      - conversationrepo
    anyVendorDeps: true

  # jobcache — Redis-backed 1d TTL pool holding the FetchedJob the fetcher grabbed.
  # plugins — J phase: Plugin interface + Registry + optional hooks
  # (CapabilityRegistrar / AdminRouter). As of J.5 the hooks need capreg +
  # chi (vendor); the boundary is still a leaf, not coupled to any business package.

  # pluginjobs — J phase: jobs plugin entry. As of J.5 it holds the Deps closure + implements
  # CapabilityRegistrar (calls jobsmcp) + AdminRouter (calls jobsadmin);
  # it's the assembly layer for the whole jobs-plugin face set (uc / mcp / admin / fetch / cache).
  pluginjobs:
    mayDependOn:
      - capabilities
      - capreg
      - jobcache
      - jobfetch
      - jobsuc
      - jobsmcp
      - jobsadmin
      # periodic — the resume-draft 1d-TTL sweep is declared by this plugin (used to be written in the composition root).
      - periodic
    anyVendorDeps: true

  # pluginownercore is gone. It used to be the **clearinghouse** for owner-MCP capabilities, one package
  # depending on seven or eight domains at once — the mayDependOn above was its medical chart. Once each
  # operation went back to its own domain and got projected through outbound convergence, the package
  # was empty and got deleted whole. A cross-domain grab bag shouldn't have a legitimate address.

  # jobsuc — J.2: jobs plugin usecases. Lived in usecases before the J phase; after the move it shares
  # the same dependency set as core usecases (domain/postgres/cryptobox + jobfetch/jobcache).
  # It depends on core usecases because it reuses the ErrEmptyField sentinel and others like it; once a
  # later J phase pulls the sentinels out into domain, this dependency can be cut.
  jobsuc:
    mayDependOn:
      - jobsdb
      - owner
      - jobsmodel
      - jobcache
      - jobfetch
      - jobdedup
      - access
      - pgstore
      - apierr
    anyVendorDeps: true

  # jobdedup — J.6c: cross-source dedup (canonical URL + composite key).
  # Pure function; depends only on the domain.FetchedJob shape.
  jobdedup:
    mayDependOn:
      - jobsmodel
    anyVendorDeps: true

  # jobsmcp — J.3: jobs plugin MCP capabilities + result wire views.
  # Registers to the core Registry via capreg; depends on jobsuc for *Deps.
  jobsmcp:
    mayDependOn:
      - owner
      - jobsmodel
      - capreg
      - mcputil
      - jobsuc
    anyVendorDeps: true

  # mcputil — shared owner-MCP result marshaller. Leaf: only capreg (for MCPResult).
  mcputil:
    mayDependOn:
      - capreg
    anyVendorDeps: true

  # jobsadmin — J.4: jobs plugin admin REST routes (drafts / applications list).
  # Carries its own response helpers (writeServerErr / nullTime), doesn't copy adminroutes' Handlers.
  jobsadmin:
    mayDependOn:
      - jobsmodel
      - middleware
      - apierr
      - jobsuc
    anyVendorDeps: true

  # Depends on domain because it needs to marshal the real domain structure (not fudged into []byte).
  jobcache:
    mayDependOn:
      - jobsmodel
    anyVendorDeps: true

  # jobfetch — 6+ source adapters (Greenhouse / Lever / Ashby / RemoteOK / WWR / HN / SmartRecruiters /
  # Workable). Pure outbound HTTP; depends on domain only to return a FetchedJob. Each adapter's base URL
  # can be overridden by env (e2e mock).
  jobfetch:
    mayDependOn:
      - jobsmodel
      - httpx
      - textcut
      # plaintext — what the board hands back is HTML (Greenhouse's is even double-escaped). The title
      # gets printed on /admin/listings, body_text gets fed to the owner's model — both spots want text,
      # not markup (F-E-7).
      - plaintext
    anyVendorDeps: true

  # gotenberg — thin HTTP client for the Gotenberg sidecar (headless
  # Chromium PDF rendering). The v1 implementation of the usecases.PDFRenderer interface.
  # Doesn't depend on domain / postgres — calling RenderURL(printURL) is the whole job; the wireup
  # encodes *domain.Application + qrURL into the print URL via an adapter.
  gotenberg:
    mayDependOn:
      - httpx
    anyVendorDeps: true

  # printsess — a Redis 60s one-shot stash holding the resume render payload (application + qrURL) that
  # gotenberg fetches.
  # sys routes read it (/internal/print-session/{token}), the gotenberg adapter in the wireup writes it.
  printsess:
    mayDependOn:
      - jobsmodel
    anyVendorDeps: true

  resumepdf:
    mayDependOn:
      - jobsmodel
    anyVendorDeps: true

  stats:
    mayDependOn:
      - statsentity
      - statsrepo
      - statsops
    anyVendorDeps: true
  # statsops — this domain's outward operation declarations. Knows only this domain's implementation + neutral vocabulary, no face.
  statsops:
    mayDependOn:
      - statsentity
      - statsrepo
      - facadeparity
    anyVendorDeps: true
  statsentity:
    mayDependOn: []
    anyVendorDeps: true
  statsrepo:
    mayDependOn:
      - statsentity
      - statsdb
      - pgstore
      # periodic — cleaning up old inference_usage rows is this domain's own periodic task; scheduling and bookkeeping belong to the host.
      - periodic
    anyVendorDeps: true

  # security — #135 request-level protection domain module (full vertical): BannedIP entity + repo + captcha verifier.
  securityban:
    mayDependOn:
      - pgstore
      - securitydb
    anyVendorDeps: true
  securitycaptcha:
    mayDependOn:
      - httpx
    anyVendorDeps: true
  # securityops — this domain's outward operation declarations (id/schema/reach/impl). Knows only this domain's implementation + neutral vocabulary.
  securityops:
    mayDependOn:
      - securityban
      - facadeparity
    anyVendorDeps: true
  security:
    mayDependOn:
      - securityban
      - securitycaptcha
      - securityops
      - pgstore
    anyVendorDeps: true

  # jobsmodel — #135 jobs domain value-object leaf: depends on access (CommittedApplication embeds AccessCode).
  jobsmodel:
    mayDependOn:
      - access
    anyVendorDeps: true

  # conversation — #135 conversation domain value objects: Citation.Genre = corpus.DocumentGenre.
  conversation:
    mayDependOn:
      - conversationentity
      - conversationrepo
      - conversationusecase
      - conversationops
    anyVendorDeps: true
  # conversationops — this domain's outward operation declarations. A transcript needs to read back the cited entry's body, so it goes through corpus's front door.
  conversationops:
    mayDependOn:
      - conversationentity
      - conversationrepo
      - conversationusecase
      - corpus
      - facadeparity
      # hostop / inference — this domain also has the inbound half open: a sandbox capability reads a
      # transcript through convergence, generates via the owner's model, hands the report back to be
      # stored. The domain can say all this itself so the composition root doesn't have to write it a gateway.
      - hostop
      - inference
    anyVendorDeps: true
  conversationentity:
    mayDependOn:
      - corpus
    anyVendorDeps: true
  conversationrepo:
    mayDependOn:
      - conversationentity
      - conversationdb
      - corpus
      - pgstore
    anyVendorDeps: true
  conversationusecase:
    mayDependOn:
      - conversationentity
      - conversationrepo
      - corpus
      - access
      - owner
      - marketplace
      - inference
      - capreg
      - sandbox
      - connectorconsumer
      - apierr
    anyVendorDeps: true

  # corpus — #135 corpus domain (facade + DDD guts). The facade depends only on its own guts; the guts are layered with no cycles.
  corpus:
    mayDependOn:
      - corpusentity
      - corpusrepo
      - corpususecase
      - corpusops
      - corpusi18n
    anyVendorDeps: true
  # corpusops — this domain's outward operation declarations. It lives inside the domain (not at the
  # convergence point), so the domain can say what it can do itself; it knows only this domain's usecases
  # + neutral vocabulary, no face.
  corpusops:
    mayDependOn:
      - corpusentity
      - corpusrepo
      - corpususecase
      - facadeparity
      - apierr
      - corpusi18n
    anyVendorDeps: true
  corpusentity:
    mayDependOn:
      - connector
    anyVendorDeps: true
  # corpusi18n — a pure text function (one note's multi-language structure); knows no repository, no face, no other domain.
  # All four consumers (MCP writes / check tools / vault sync / reader page) call only this, so it can depend on none of them.
  corpusi18n:
    mayDependOn: []
    anyVendorDeps: true
  # builtincaps — only data (a manifest) + a loader that parses into mcpplugin.Manifest.
  builtincaps:
    mayDependOn:
      - mcpplugin
    anyVendorDeps: true
  corpusrepo:
    mayDependOn:
      - corpusentity
      - corpusdb
      - connector
      - pgstore
      # textcut — raw's derived title is truncated by character; truncating by byte would make postgres reject the whole write.
      - textcut
    anyVendorDeps: true
  corpususecase:
    mayDependOn:
      - corpusentity
      - corpusrepo
      - search
      - access
      - corpusi18n
      # hostop replaces capsocket: this domain declares "I offer these seven corpus-reading things", not "I'm mounted on this socket".
      - hostop
      # periodic — reconciling after Meili recovers is this domain's periodic task; scheduling and bookkeeping belong to the host.
      - periodic
      - apierr
      - pgstore
      - storage
      # httpx — fetches a piece of media from the https address the owner gave. All outbound HTTP goes
      # through httpx (retry + timeout + egress lockdown); this one especially, since the address came from the owner.
      - httpx
      # textcut — truncation of the path segment and the lead line; same reasoning as corpusrepo.
      - textcut
    anyVendorDeps: true

  # access — #135 access domain (facade + DDD guts). The facade depends only on its own guts; the guts are layered with no cycles.
  access:
    mayDependOn:
      - accessentity
      - accessrepo
      - accessusecase
      - accessops
    anyVendorDeps: true
  # accessops — this domain's outward operation declarations (id/schema/reach/impl). Knows only this domain's usecases + neutral vocabulary.
  accessops:
    mayDependOn:
      - accessentity
      - accessrepo
      - accessusecase
      - facadeparity
      - apierr
    anyVendorDeps: true
  accessentity:
    mayDependOn: []
    anyVendorDeps: true
  accessrepo:
    mayDependOn:
      - accessentity
      - accessdb
      - pgstore
      - cryptobox        # per-embed Ed25519 keypair generation (embed-piracy protection)
    anyVendorDeps: true
  accessusecase:
    mayDependOn:
      - accessentity
      - accessrepo
      - apierr
      - cryptobox        # unwraps the public key when verifying an embed JWT (ParseEd25519Public)
    anyVendorDeps: true

  # owner — #135 owner module: entity + repo (the connector's OwnerLookup consumes owner.Owner).
  owner:
    mayDependOn:
      - ownerentity
      - ownerrepo
      - ownerusecase
      - ownerops
      - corpusi18n
    anyVendorDeps: true
  # ownerops — this domain's outward operation declarations. Knows only this domain's usecases + neutral
  # vocabulary, no face. Vocabulary for both directions lives here: facadeparity is outbound, hostop is
  # inbound (a sandbox reads the owner's allowlisted fields).
  ownerops:
    mayDependOn:
      - ownerentity
      - ownerrepo
      - ownerusecase
      - facadeparity
      - hostop
      - apierr
      # a cross-domain resource is declared by whichever domain **can import the other side**, always
      # through the other's front door: access_requests (data lives in access, the approval loop closes
      # in this domain), seo (entries live in corpus, this domain picks the pins).
      - access
      - corpus
      # if the outbound channel isn't configured, it needs to be able to say "go configure it" — that
      # sentinel lives on the connector consumer side.
      - connectorconsumer
    anyVendorDeps: true
  ownerentity:
    mayDependOn: []
    anyVendorDeps: true
  ownerrepo:
    mayDependOn:
      - ownerentity
      - ownerdb
      - pgstore
      - cryptobox
    anyVendorDeps: true
  ownerusecase:
    mayDependOn:
      - ownerentity
      - ownerrepo
      - marketplace
      - corpus
      - access
      - connector
      # booking usecases (list_slots / cancel / cancel-own) reach calendars only through the
      # category contract; the concrete proxy is injected at the composition root. Inherited
      # from the dissolved plugins/booker, which had exactly this one dependency.
      - connectorcontract
      - connectorconsumer
      - apierr
      - session
    anyVendorDeps: true




  marketplace:
    mayDependOn:
      - marketplaceentity
      - marketplacerepo
      - marketplaceusecase
      - marketplaceops
    anyVendorDeps: true
  # marketplaceops — this domain's outward operation declarations. Knows only this domain's implementation + neutral vocabulary, no face.
  marketplaceops:
    mayDependOn:
      - marketplaceentity
      - marketplaceusecase
      - facadeparity
      - apierr
    anyVendorDeps: true
  marketplaceentity:
    mayDependOn: []
    anyVendorDeps: true
  marketplacerepo:
    mayDependOn:
      - marketplaceentity
      - marketplacedb
      - pgstore
    anyVendorDeps: true
  marketplaceusecase:
    mayDependOn:
      - marketplaceentity
      - marketplacerepo
      - access
      - apierr
      - cryptobox
      - httpx
    anyVendorDeps: true


  # cryptobox is a dependency-free AES-GCM helper; any internal package can import it to encrypt at
  # rest. It only reads the INSTANCE_SECRET env itself, doesn't route back through any internal module.
  cryptobox:
    mayDependOn: []
    anyVendorDeps: true

  # capstore — per-plugin isolated document storage (one schema per connector/mcp). Leaf: depends only on
  # pgx, doesn't route back through any internal business module. The schema name derives from the
  # host-trusted (kind,id); the DROP guard lives inside the package.
  capstore:
    mayDependOn: []   # #135: socket.go (the capstore.* host op) moved to internal/routes/capstore; this package is back to a pure leaf
    anyVendorDeps: true


  # sys routes (/internal/healthz, tls-ask, log, builds) need to ping db / redis
  # so it can import postgres. The redis client is vendor. domain is used too:
  # /internal/builds/claim returns ErrMicrositeBuildNotFound when there's nothing pending.
  sysroutes:
    mayDependOn:
      - owner
      - conversation
      - printsess
      - session
      - capreg
      - sandboxws
      - connectorcontract  # #155 connector diag: CalendarProxy/DTO type contract
      - middleware  # #155 connector diag: owner id from context (middleware.OwnerIDFrom)
      - access
      - pgstore
      - buildnotify  # preview long-poll: signal the panel when a build settles (builder callback)
    anyVendorDeps: true

  # sandboxws — per-session sandbox workspace lifecycle leaf: pure stdlib (os/filepath/sync/time).
  sandboxws:
    mayDependOn:
      - periodic # sweeping expired workspaces is this subsystem's own declaration, not the composition root's cron
    anyVendorDeps: true

  # admin routes (/api/admin/*) dispatch to usecases; each handler keeps its own cyclo ≤3.
  # Needs domain (translating sentinel errors) + session (first-run.txt cleanup / cookie name)
  # + usecases + apierr (error envelope) + middleware (ctx key + cookie name).
  adminroutes:
    mayDependOn:
      - dispatcher      # admin-face capabilities can only be wired from outbound convergence (the route shape is still hand-written)
      - conversation
      - connector
      - owner
      - access
      - marketplace
      - corpus
      - obsidian
      - session
      - apierr
      - middleware
      - storage
      - connectorconsumer
      - inference   # /ai-provider/presets exposes the preset table to the admin UI
      - connectorcontract # #135 Slice 5: /connectors/mail credential form + test-send go through the MailProxy contract
      - capreg      # Phase H /capabilities: lists registry origin + the owner-enable toggle
      - stats       # #135 /stats/*: Monitor activity/growth/graph/jobs value objects
      - security    # #135 /ip-bans: BannedIP value object
      - depcheck    # checks at startup whether buildAdminHandlers' hand-copied dependency table has a missing row
      - buildnotify # preview long-poll (/microsites/wait) reads the build-settle broadcast
    anyVendorDeps: true

  # obsidian — Obsidian vault two-way sync sub-usecase: frontmatter codec / image
  # ref rewriter / zip export / multipart import. Rides usecases.SavePost's atomic-asset path,
  # so it depends one-way on usecases; usecases never imports it back.
  obsidian:
    mayDependOn:
      - corpus
      - storage
      - corpusi18n
    anyVendorDeps: true

  # public routes (/api/v1/*) — the landing point for the SDK + visitors; runs on visitor session
  # token bearer auth; SSE streaming chat.
  publicroutes:
    mayDependOn:
      - conversation
      - access
      - owner
      - corpus
      - session
      - inference
      - apierr
      - capreg # D-2: /api/v1/sessions returns capability_state + part_ids, reads the Registry
      - cryptobox   # BYOAI envelope (HKDF + AES-GCM) unwraps the X-BYOAI-Key header
      - httpx   # #132 /api/v1 inference-models listing probe goes through the unified client
      - providermodels   # "which models does this endpoint have" — the visitor asks with their own key (F-R-11)
      - gotenberg   # GET /report/{id}/pdf — ErrNotConfigured sentinel + ReportPDFRenderer
      - stats   # #106/#7 records one usage event: UsageRow ("which tank of gas, does it count against the budget") is stats' vocabulary
      - clientaddr   # conversations.client_ip only takes the visitor's own address; leaves it blank if it can't get one
    anyVendorDeps: true

  # pubapi —— API-key facade. Reuses the visitor assembly (capreg) + usecases; whitelists non-Agentic
  # outward tools via paritymanifest. Own auth (api-key), no CSRF/owner-session.
  pubapi:
    mayDependOn:
      - capload
      - access
      - conversation
      - owner
      - capreg
      - paritymanifest
    anyVendorDeps: true

  # cmd/ is the composition root — the one place allowed to cross all layers.
  cmd:
    mayDependOn:
      # providermodels — the owner's "load models" button: the root side unlocks the vault's own key and asks the endpoint.
      # The visitor face uses the same code (the key travels with the request), so it lives in infra rather than any one domain (F-R-11).
      - providermodels
      - cmddeps
      - cmdport
      - cmdaxisconn
      - cmdaxiscap
      - cmdwire
      # clientaddr — the composition root mounts it right after chi.RealIP: "is the source address the visitor's own" is decided exactly once there.
      - clientaddr
      - capconfig       # the composition root binds "the config a capability declares" to its own isolated storage
      - capconfigroutes # and mounts capconfig.get on that capability's reach-back socket
      - capquota        # and, per the manifest's Quota declaration, hangs the gate + remaining-balance on it (one counter, two exits)
      - dispatcher      # the composition root builds the **single** outbound convergence point, each face projects from it
      - facadeparity    # each face's parity profile (Facade profile) is declared at the composition root
      # paritymanifest — "which capabilities can be exposed to the API face" is knowledge that belongs to the capability axis, injected into access from this side.
      - paritymanifest
      # apierr — when the composition root adapts a domain into the convergence point's narrow port, it
      # has to translate the domain's error vocabulary (sentinels like apierr.ErrEmptyField) into the
      # category the convergence point understands (dispatcher.BadInput). That translation has to live at
      # the composition root: the convergence point imports neither the domain nor apierr, and a domain
      # doesn't know HTTP status codes.
      - apierr
      - middleware
      - capload
      - jobsmodel
      - config
      - session
      - sysroutes
      - adminroutes
      - publicroutes
      - pubapi
      - connectorroutes
      - capstoreroutes
      # hostdesk — the composition root builds the **single** inbound convergence point, each capability's
      # socket projects from it (symmetric with dispatcher). This used to list ownerroutes /
      # reportroutes / conversationroutes / inferenceroutes: the composition root hung verbs on each
      # controller thin shell itself, which is exactly how the four hand-written gateways came to be.
      - hostdesk
      - hostop
      # periodic — the composition root gathers periodic tasks declared everywhere into a **single** schedule (same reasoning as the two convergence points).
      - periodic
      - mcphandle
      - inference
      - jobcache
      - jobfetch
      - jobsuc
      - gotenberg
      - connector
      # both axes' built-in **declarations** are read from their own top-level directory; the composition root only assembles.
      - connectorbuiltins
      - capabilitybuiltins
      - printsess
      - resumepdf
      - stats
      - marketplace
      - security
      - access
      - cryptobox
      - sandbox
      - mcpclient
      - mcpplugin
      - storage
      - capreg
      - capabilities
      - pluginjobs
      - capsocket
      - capstore
      - connectorconsumer
      - sandboxws
      - search
      - connectorcontract
      - conversation
      - owner
      - corpus
      - pgstore
      - buildnotify     # the composition root constructs the preview-long-poll broadcast (one per process)
      - selfstat        # …and the own-cgroup stats reader for the System panel
    anyVendorDeps: true

  # The five packages inside the composition root. In layering terms they're on par with cmd (both may
  # cross layers), and **one-way** among themselves.
  # cmddeps — it needs each domain's facade because its field types are those domains' objects. It's a
  # leaf **inside the composition root**: none of the four packages below import it, so the direction holds.
  cmddeps:
    mayDependOn:
      - capconfig       # the composition root binds "the config a capability declares" to its own isolated storage
      - capconfigroutes # and mounts capconfig.get on that capability's reach-back socket
      - capquota        # and, per the manifest's Quota declaration, hangs the gate + remaining-balance on it (one counter, two exits)
      - dispatcher      # the composition root builds the **single** outbound convergence point, each face projects from it
      - facadeparity    # each face's parity profile (Facade profile) is declared at the composition root
      # paritymanifest — "which capabilities can be exposed to the API face" is knowledge that belongs to the capability axis, injected into access from this side.
      - paritymanifest
      # apierr — when the composition root adapts a domain into the convergence point's narrow port, it
      # has to translate the domain's error vocabulary (sentinels like apierr.ErrEmptyField) into the
      # category the convergence point understands (dispatcher.BadInput). That translation has to live at
      # the composition root: the convergence point imports neither the domain nor apierr, and a domain
      # doesn't know HTTP status codes.
      - apierr
      - middleware
      - capload
      - jobsmodel
      - config
      - session
      - sysroutes
      - adminroutes
      - publicroutes
      - pubapi
      - connectorroutes
      - capstoreroutes
      # hostdesk — the composition root builds the **single** inbound convergence point, each capability's
      # socket projects from it (symmetric with dispatcher). This used to list ownerroutes /
      # reportroutes / conversationroutes / inferenceroutes: the composition root hung verbs on each
      # controller thin shell itself, which is exactly how the four hand-written gateways came to be.
      - hostdesk
      - hostop
      # periodic — the composition root gathers periodic tasks declared everywhere into a **single** schedule (same reasoning as the two convergence points).
      - periodic
      - mcphandle
      - inference
      - jobcache
      - jobfetch
