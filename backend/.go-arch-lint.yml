version: 3
workdir: .
allow:
  depOnAnyVendor: true   # 第三方库（chi、pgx、mcp-go、anthropic-sdk-go 等）
                         # 任何 component 可用；这里只约束 internal 的依赖图。
  deepScan: false        # cmd/server/main.go 是 composition root，
                         # 跨所有 layer 是预期；关闭 deepScan 避免误报。

# Components 命名对齐 Otium auth。M1 时只声明实际存在的；后续 milestone 引入
# 新 component 时再 append（M2 加 session, M5 加 domain/usecases/storage, M6
# 加 routes/admin & routes/public, M10 加 sandbox/inference/mcp/middleware）。
components:
  config:
    in: internal/config/**
  postgres:
    in: internal/postgres/**
  sysroutes:
    in: internal/routes/sys/**
  server:
    in: internal/server/**
  cmd:
    in: cmd/**

deps:
  config:
    mayDependOn: []
    anyVendorDeps: true

  postgres:
    mayDependOn: []
    anyVendorDeps: true

  # sys routes (/internal/healthz, tls-ask, log) 需要 ping db / redis
  # 所以可以 import postgres。redis 客户端是 vendor，已被 anyVendorDeps 允许。
  sysroutes:
    mayDependOn:
      - postgres
    anyVendorDeps: true

  # server 装配，把各 routes sub-router 挂到 chi。
  server:
    mayDependOn:
      - sysroutes
    anyVendorDeps: true

  # cmd/ 是 composition root —— 唯一允许跨所有 layer 的地方。
  cmd:
    mayDependOn:
      - config
      - postgres
      - server
    anyVendorDeps: true
