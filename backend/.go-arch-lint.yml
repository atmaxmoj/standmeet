version: 3
workdir: .
allow:
  depOnAnyVendor: true   # 第三方库（chi、pgx、mcp-go、anthropic-sdk-go 等）
                         # 任何 component 可用；这里只约束 internal 的依赖图。
  deepScan: false        # cmd/server/main.go 是 composition root，
                         # 跨所有 layer 是预期；关闭 deepScan 避免误报。

# Components 命名对齐 Otium auth。按外部系统切 infra（postgres / inference /
# storage / sandbox 各自独立）而不是扁平 infra/。
components:
  domain:
    in: internal/domain
  usecases:
    in: internal/usecases
  obsidian:
    in: internal/usecases/obsidian        # Obsidian vault import/export
  postgres:
    in: internal/postgres                 # 含 sqlc 生成的 dbq 子包
  dbq:
    in: internal/postgres/dbq
  session:
    in: internal/session
  config:
    in: internal/config
  apierr:
    in: internal/apierr                   # HTTP error envelope 翻译 helper
  middleware:
    in: internal/middleware               # chi middleware: WithOwner, RequireCSRF
  mcp:
    in: internal/mcp                      # mcp-go server + tool handlers
  inference:
    in: internal/inference                # LLM provider abstraction
  jobcache:
    in: internal/jobcache                 # Redis-backed 1d TTL pool for fetched jobs
  jobfetch:
    in: internal/jobfetch                 # job source fetcher adapters (Greenhouse / Lever / Ashby / ...)
  gcal:
    in: internal/gcal                     # Google OAuth + Calendar HTTP client (events.insert / freeBusy / token refresh)
  gotenberg:
    in: internal/gotenberg                # HTTP client for the Gotenberg PDF render sidecar
  printsess:
    in: internal/printsess                # Redis 60s stash for gotenberg-bound resume payload
  marketplace:
    in: internal/marketplace              # skill marketplace aggregation client (GitHub + SkillsMP)
  captcha:
    in: internal/captcha                  # Cloudflare Turnstile / noop captcha verifier abstraction
  sandbox:
    in: internal/sandbox                  # owner-curated skill script 在 docker container 里跑
  agentskills:
    in: internal/agentskills              # Phase B Capability registry: visitor + owner MCP 三处消费的统一注册口
  mcpclient:
    in: internal/mcpclient                # 调外部 MCP server (owner-registered)
  storage:
    in: internal/storage                  # MinIO/S3 对象存储 (图片 / 附件)
  cryptobox:
    in: internal/cryptobox                # AES-GCM 对称加密 helper（owner key 存储等）
  sysroutes:
    in: internal/routes/sys
  adminroutes:
    in: internal/routes/admin
  publicroutes:
    in: internal/routes/public            # /api/v1/* — SDK / visitor entry
  server:
    in: internal/server
  cmd:
    in: cmd/server
  mockcmd:
    in: cmd/job-board-mock                # test-only fixture server
  mcpmockcmd:
    in: cmd/mcp-server-mock               # e2e fixture: minimal external MCP HTTP server
  lintcmd:
    in: cmd/check-no-nil-container        # AST lint: container types must not return nil

deps:
  # Domain 纯内核，无 internal 依赖。
  domain:
    mayDependOn: []
    anyVendorDeps: true

  # Usecases 编排 domain + infra（postgres / session / inference / jobcache / jobfetch）。
  # PDF 渲染走 usecases.PDFRenderer 接口；实现（gotenberg）由 wireup 注入，
  # usecases 自己不引 gotenberg 包。
  usecases:
    mayDependOn:
      - domain
      - postgres
      - session
      - inference
      - jobcache
      - jobfetch
      - cryptobox
      - sandbox
      - mcpclient
      - storage
      - gcal
      - agentskills
    anyVendorDeps: true

  # sandbox 调外部 docker，仅依赖 stdlib + domain (SkillScript)。
  sandbox:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # agentskills —— Phase B Capability interface + Registry。leaf-ish 包，
  # 只依赖 inference (ToolSpec / ToolExecutor) + domain (RoleSnapshot 类型)。
  # 具体 Capability 实现放在 usecases / mcp 等更高层，反向 import 本包注册。
  agentskills:
    mayDependOn:
      - inference
      - domain
    anyVendorDeps: true

  # mcpclient 调 owner-registered 外部 MCP HTTP server。
  mcpclient:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # storage 是 S3 / MinIO 客户端，纯 vendor + stdlib。
  storage:
    mayDependOn: []
    anyVendorDeps: true

  # Postgres Repository 把 sqlc 生成的 dbq 映射到 domain types。
  # cryptobox 给 owner-supplied key 落盘前加密（AI provider key 等）。
  postgres:
    mayDependOn:
      - domain
      - dbq
      - cryptobox
    anyVendorDeps: true

  # sqlc 生成的查询代码；其他业务不该直接 import，必须经 postgres Repository。
  dbq:
    mayDependOn: []
    anyVendorDeps: true

  # Session 管理 setup token、login session、API token。
  # domain 是单向值对象（PathPermission 等）—— session 内置入参/出参字段，
  # 不耦合业务逻辑。其他 internal 包仍走 narrow interface 注入。
  session:
    mayDependOn: [domain]
    anyVendorDeps: true

  config:
    mayDependOn: []
    anyVendorDeps: true

  # apierr 是无依赖的 envelope 翻译 util；任何 routes 包可 import 来做
  # error → HTTP envelope 映射。
  apierr:
    mayDependOn: []
    anyVendorDeps: true

  # middleware 包含 owner auth gate（WithOwner）+ CSRF gate + LoginGuard
  # (rate-limit + captcha + equal-time)。session 给 token lookup；captcha
  # 给 LoginGuard 的 Verifier 接口。
  middleware:
    mayDependOn:
      - session
      - captcha
    anyVendorDeps: true

  # mcp 是 owner AI 客户端用的 MCP server；通过 OwnerLookup 接口注入 owner
  # profile 查询，避免直接 import postgres；usecases 提供 token verify。
  mcp:
    mayDependOn:
      - domain
      - usecases
    anyVendorDeps: true

  # inference 是 LLM provider 抽象（Anthropic / OpenAI / Mock）。
  # 不依赖任何 internal（纯接口 + 实现 + sentinel errors）。
  # cryptobox: resolver 用来解密 byoai key (Redis 拿到的是密文)；其他业务
  # 仍走 narrow OwnerLookup 接口，不耦合具体 repo。
  inference:
    mayDependOn:
      - cryptobox
      - domain   # AICredential value object，统一 byoai 跟 owner key 的 shape
    anyVendorDeps: true

  # jobcache —— Redis-backed 1d TTL 池子，存 fetcher 抓的 FetchedJob。
  # 依赖 domain 是因为它要 marshal 真实 domain 结构（不糊弄成 []byte）。
  jobcache:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # jobfetch —— 6+ 个 source adapter（Greenhouse / Lever / Ashby / RemoteOK
  # / WWR / HN / SmartRecruiters / Workable）。纯外部 HTTP，依赖 domain 是
  # 为了返回 FetchedJob。各 adapter 的 base URL 可被 env 覆写（e2e mock）。
  jobfetch:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # gcal —— Google OAuth (token exchange + refresh) + Calendar API
  # (events.insert + freeBusy) HTTP client。usecases.CalendarBooker 接口的
  # 实现；wireup 注入。endpoints 走 env (GOOGLE_OAUTH_BASE_URL /
  # GOOGLE_CALENDAR_BASE_URL) 默认 prod，e2e 指向 job-board-mock。
  gcal:
    mayDependOn: []
    anyVendorDeps: true

  # gotenberg —— thin HTTP client for the Gotenberg sidecar (headless
  # Chromium PDF rendering). usecases.PDFRenderer 接口的 v1 实现。
  # 不依赖 domain / postgres —— 调 RenderURL(printURL) 就完事；wireup 里
  # 通过 adapter 把 *domain.Application + qrURL 编码进 print URL。
  gotenberg:
    mayDependOn: []
    anyVendorDeps: true

  # printsess —— Redis 60s 一次性 stash，存放 gotenberg 取走的 resume
  # 渲染 payload (application + qrURL)。
  # sys routes 读它（/internal/print-session/{token}），wireup 里 gotenberg
  # adapter 写它。
  printsess:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # marketplace —— skill marketplace 聚合客户端（GitHub anthropics/skills +
  # SkillsMP HTTP API + in-memory cache）。usecases 通过接口注入，admin
  # routes 不直接 import。
  marketplace:
    mayDependOn:
      - domain
    anyVendorDeps: true

  # captcha —— Cloudflare Turnstile + noop verifier。Verifier 接口注入到
  # middleware (LoginGuard) 做请求级校验。无 internal 依赖（接收 secret /
  # token / IP 全是 string，输出 sentinel error）。
  captcha:
    mayDependOn: []
    anyVendorDeps: true

  # cryptobox 是无依赖的 AES-GCM helper；任何 internal 包可以 import 来落盘
  # 加密。本身只读 INSTANCE_SECRET env，不绕回任何 internal 模块。
  cryptobox:
    mayDependOn: []
    anyVendorDeps: true

  # sys routes (/internal/healthz, tls-ask, log, builds) 需要 ping db / redis
  # 所以可以 import postgres。redis 客户端是 vendor。domain 也用得到：
  # /internal/builds/claim 在 no-pending 时返 ErrCustomPageBuildNotFound。
  sysroutes:
    mayDependOn:
      - domain
      - postgres
      - printsess
      - session
      - usecases
      - agentskills
    anyVendorDeps: true

  # admin routes (/api/admin/*) 派发到 usecases；handler 自己 cyclo ≤3。
  # 需要 domain（sentinel errors 翻译）+ session（first-run.txt 清理 / cookie 名）
  # + usecases + apierr（error envelope）+ middleware（ctx key + cookie 名）。
  adminroutes:
    mayDependOn:
      - domain
      - usecases
      - obsidian
      - session
      - postgres
      - apierr
      - middleware
      - storage
      - inference   # /ai-provider/presets 暴露 preset 表给 admin UI
      - gcal        # /connectors/google-calendar/* OAuth init/callback wires gcal.Client
    anyVendorDeps: true

  # obsidian —— Obsidian vault 双向 sync 子用例：frontmatter codec / image
  # ref rewriter / zip export / multipart import。靠 usecases.SavePost 走
  # 那条 atomic asset 路径，所以单向依赖 usecases；不被 usecases 反向 import。
  obsidian:
    mayDependOn:
      - domain
      - usecases
      - postgres
      - storage
    anyVendorDeps: true

  # public routes (/api/v1/*) —— SDK + visitor 落地点；走 visitor session
  # token bearer auth；SSE 流式 chat。
  publicroutes:
    mayDependOn:
      - domain
      - usecases
      - session
      - inference
      - apierr
      - cryptobox   # BYOAI envelope (HKDF + AES-GCM) 解封 X-BYOAI-Key header
    anyVendorDeps: true

  # server 装配 chi 路由 + middleware；挂 admin / sysroutes / mcp / public sub-router。
  server:
    mayDependOn:
      - sysroutes
      - adminroutes
      - publicroutes
      - usecases
      - session
      - middleware
      - mcp
      - postgres
      - captcha
    anyVendorDeps: true

  # mockcmd —— test-only fixture HTTP server。纯 stdlib + 读 fixture
  # 文件，无 internal 依赖。e2e 通过 docker compose 起。
  mockcmd:
    mayDependOn: []
    anyVendorDeps: true

  # mcpmockcmd —— e2e fixture: minimal external MCP HTTP server。
  # 纯 mcp-go vendor + stdlib，无 internal 依赖。
  mcpmockcmd:
    mayDependOn: []
    anyVendorDeps: true

  # lintcmd —— AST 静态检查工具 (check-no-nil-container)，独立可执行，纯
  # go/parser + go/ast，无 internal 依赖。make lint 跑。
  lintcmd:
    mayDependOn: []
    anyVendorDeps: true

  # cmd/ 是 composition root —— 唯一允许跨所有 layer 的地方。
  cmd:
    mayDependOn:
      - config
      - domain
      - postgres
      - session
      - usecases
      - sysroutes
      - adminroutes
      - publicroutes
      - mcp
      - inference
      - jobcache
      - jobfetch
      - gotenberg
      - gcal
      - printsess
      - marketplace
      - captcha
      - cryptobox
      - sandbox
      - mcpclient
      - storage
      - server
      - agentskills
    anyVendorDeps: true
