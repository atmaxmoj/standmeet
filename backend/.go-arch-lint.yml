  # pubapi —— API-key facade. Reuses the visitor assembly (registry) + usecases; whitelists non-Agentic
  # outward tools via paritymanifest. Own auth (api-key), no CSRF/owner-session.
  pubapi:
    mayDependOn:
      - blockload
      - access
      - conversation
      - owner
      - registry
      - paritymanifest
    anyVendorDeps: true

  # cmd/ is the composition root — the one place allowed to cross all layers.
  cmd:
    mayDependOn:
      # providermodels — the owner's "load models" button: the root side unlocks the vault's own key and asks the endpoint.
      # The visitor face uses the same code (the key travels with the request), so it lives in infra rather than any one domain (F-R-11).
      - providermodels
      - cmddeps
      - cmdport
      - cmdblockwire
      - cmdwire
      # clientaddr — the composition root mounts it right after chi.RealIP: "is the source address the visitor's own" is decided exactly once there.
      - clientaddr
      # geoip — the composition root opens the bundled geoip DB and adapts it to monitor's LocationResolver port (the domain never names an infra file).
      - geoip
      - blockconfig       # the composition root binds "the config a block declares" to its own isolated storage
      - blockdesk # and mounts blockconfig.get on that block's reach-back socket
      - blockquota        # and, per the manifest's Quota declaration, hangs the gate + remaining-balance on it (one counter, two exits)
      - mount             # it turns each discovered manifest into a mounted fiber
      - assembly          # and keeps what a code carries (bundles) + what failed to bind
      - credentials       # the vault the supplier layer reads through; the root is where the repo is built
      - blockadmin        # the supplier admin service the admin routes hand their write paths to
      - egress            # the outbound allow-list is read from the environment here, once
      - dispatcher      # the composition root builds the **single** outbound convergence point, each face projects from it
      - facadeparity    # each face's parity profile (Facade profile) is declared at the composition root
      # paritymanifest — "which blocks can be exposed to the API face" is knowledge that belongs to the block layer, injected into access from this side.
      - paritymanifest
      # apierr — when the composition root adapts a domain into the convergence point's narrow port, it
      # has to translate the domain's error vocabulary (sentinels like apierr.ErrEmptyField) into the
      # category the convergence point understands (dispatcher.BadInput). That translation has to live at
      # the composition root: the convergence point imports neither the domain nor apierr, and a domain
      # doesn't know HTTP status codes.
      - apierr
      - middleware
      - blockload
      - jobsmodel
      - config
      - session
      - sysroutes
      - adminroutes
      - publicroutes
      - pubapi
      - supplierroutes
      # hostdesk — the composition root builds the **single** inbound convergence point, each block's
      # socket projects from it (symmetric with dispatcher). This used to list ownerroutes /
      # reportroutes / conversationroutes / inferenceroutes: the composition root hung verbs on each
      # controller thin shell itself, which is exactly how the four hand-written gateways came to be.
      - hostdesk
      - hostop
      # periodic — the composition root gathers periodic tasks declared everywhere into a **single** schedule (same reasoning as the two convergence points).
      - periodic
      - mcphandle
      - inference
      - jobcache
      - jobfetch
      - jobsuc
      - gotenberg
      # the built-in **declarations** are read from their own top-level directory; the composition
      # root only assembles.
      - builtinblocks
      - printsess
      - stats
      - marketplace
      - security
      - access
      - cryptobox
      - sandbox
      - mcpclient
      - plugin
      - storage
      - registry
      - pluginjobs
      - hostsocket
      - blockstore
      - adapters
      - sandboxws
      - search
      - conversation
      - owner
      - corpus
      - pgstore
      - buildnotify     # the composition root constructs the preview-long-poll broadcast (one per process)
      - selfstat        # …and the own-cgroup stats reader for the System panel
      # monitor + monitormw — the composition root builds the traffic recorder and mounts its
      # ONE middleware on the public router. Recording converges nowhere else: monitor observes
      # the router from outside and is never called from inside a domain (monitor.md §0).
      - monitor
      - monitormw
    anyVendorDeps: true

