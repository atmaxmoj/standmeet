version: "2"

run:
  go: "1.26"
  timeout: 5m

linters:
  # `all` enables every linter golangci-lint ships with.  Anything the
  # community thinks is worth checking, we check.  Disables below are
  # the *minimum* needed to avoid double-coverage / style-only noise —
  # each one has a one-line justification (no "this fires too often"
  # without a real reason).
  default: all

  disable:
    # ── style preferences that conflict with our chosen idiom ──
    - wsl             # Whitespace style is opinionated; gofmt already normalises blanks.
    - wsl_v5          # Newer revision of wsl, same reason.
    - nlreturn        # "blank line before return" is a wsl-family rule, same reason.
    - varnamelen      # Short names (i, r, w, ctx) are idiomatic Go; lll already caps abuse.
    - lll             # Line length isn't a useful budget when gofmt picks the breaks.
    # NOTE: funlen is intentionally kept on — mirrors MainApp / Auth's
    # `max-lines-per-function: 70` ESLint rule.  Configured in
    # `linters.settings.funlen` below.
    - godox           # Bans TODO/FIXME — we want to be able to land them.
    - tagliatelle     # JSON tag casing is determined by the wire contract, not by style.

    # ── coverage already done by another enabled linter ──
    - gocyclo         # cyclop replaces it (same metric, configurable).
    - goconst         # Flags repeated string literals as "should be a const".
                      # Fires for JSON wire-shape keys like "error" / "status"
                      # which are by-convention inlined next to their value —
                      # a named const adds noise without adding meaning.  Real
                      # business constants get named regardless.

    # ── conflict with stdlib / community Go idioms ──
    - exhaustruct     # Forces every struct literal to set every field; Go's
                      # zero-value-as-default is the whole point of literals.
                      # Project-locally we lean on the zero value (e.g. http.Server
                      # with only ReadHeaderTimeout set) and the linter would
                      # demand we name 13 nil fields for every server we boot.
    - err113          # Bans `fmt.Errorf(...)` in favour of sentinel errors;
                      # contradicts Go's "errors are values, build context with %w"
                      # idiom.  We use sentinel errors only when callers really
                      # need to match on them.
    - mnd             # Treats every numeric literal as a magic number.  Things
                      # like `10 * time.Second` (read header timeout) are
                      # locally obvious and don't deserve a named const.
    - noinlineerr     # Forbids `if err := f(); err != nil` — the idiomatic
                      # Go error-check form.  We use it everywhere.
    - gomodguard      # Deprecated in golangci v2.12 in favour of gomodguard_v2;
                      # we don't use either (depguard is enough for import
                      # policy if we ever want to add one).
    - depguard        # We don't maintain an import allow-list yet (the deps
                      # are tiny: chi, pgx, goose, slog).  Re-enable with a
                      # populated allow-list once we want to enforce one.
    - gochecknoglobals # Flags ALL package-level `var` declarations.  Go's
                       # error-sentinel idiom (var ErrFoo = errors.New(...))
                       # and immutable lookup-table maps
                       # (var fooSQL = map[Enum]string{...}) both rely on
                       # package-level vars — the rule has no flag to
                       # distinguish "actually mutable global" from these.
                       # We catch real mutable-global bugs via review.

  # ── per-linter configuration ───────────────────────────────────
  # NB: golangci-lint v2 nests linter settings under `linters.settings`.
  # A top-level `linters-settings:` block is silently ignored by the
  # config loader (and rejected by `golangci-lint config verify`), so
  # any custom thresholds you put there would be no-ops while the
  # surrounding `default: all` quietly ran every linter with its
  # built-in default values.  We were bitten by exactly that — see
  # commit history for the v1 → v2 fix.
  settings:
    gomoddirectives:
      # The externalized inward-block modules live in-repo (mcp-servers/*)
      # and are linked in-process via a local replace — a standard monorepo
      # pattern here (go.work didn't resolve cleanly in the backend subdir).
      # Allow local (filesystem) replaces for that.
      replace-local: true
    cyclop:
      # Project policy splits the cyclo budget by layer:
      #   routes (presentation)   → ≤ 3
      #   everything else (biz)   → ≤ 5
      #
      # The ≤3 cap on routes is enforced by scripts/check-routes-
      # cyclo.sh (narrow gocyclo run over internal/routes/ only).
      # cyclop here covers the rest of the tree — application,
      # domain, infrastructure — at the looser business budget.
      # The routes layer is excluded below so the two checks don't
      # double-report.
      max-complexity: 5
      package-average: 0.0   # don't gate on average, only on the max
    gocognit:
      # Slightly looser than cyclop (linear flows + early returns that
      # cyclop counts as branches don't really hurt cognition).  Still
      # well below the 20 default.
      min-complexity: 10
    nestif:
      min-complexity: 3
    funlen:
      # Mirrors MainApp / Auth's `max-lines-per-function: 70`.
      # `statements` is golangci-lint's analogue of ESLint's
      # `max-statements`; 40 keeps the average density honest.
      lines: 70
      statements: 40
      ignore-comments: true
    gocritic:
      enabled-tags: [diagnostic, performance, style, opinionated]
      # unnamedResult wants to name multi-value returns, which directly conflicts with
      # this repo's enabled nonamedreturns (no named returns) policy — the two can't both
      # be satisfied. nonamedreturns wins; turn this gocritic check off.
      disabled-checks: [unnamedResult]
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    # ireturn by default blocks "returning an abstract interface". A driver-selection
    # factory (picking a concrete impl by env) inherently needs to return an interface;
    # other interfaces are caught as usual.
    #
    # Document / Integration are Go's proxy for a missing sum type — Corpus.Get / List
    # return a heterogeneous collection element (any of Wiki|Output|Writing|Raw),
    # dispatched by URI at runtime; Integrations.Find returns a concrete (Obsidian, etc.)
    # by Kind, the same shape. These interfaces "returning an interface" is by design,
    # not laziness — the same factory pattern as Provider/Runner.
    #
    # CalendarProxy / MailProxy are the supplier layer's "seam contract" — consumers
    # (booker/mailer) program against it provider-agnostically, and the dispatcher
    # returns the impl for the owner's currently active supplier. A multi-method
    # consumer contract returning an interface is the essence of normalization (any
    # provider fills the same contract), not laziness.
    #
    # Every path below moved with the block-vocabulary rename. They are the same types
    # under new addresses, not a widened allow-list.
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        # generic — a type parameter IS the caller's concrete type, chosen at the call site.
        # `seamAs[CalendarProxy]` returns a CalendarProxy; there is no widening and nothing
        # hidden. Writing the two seams out longhand instead is how the third one ends up
        # subtly different from the first two, which is the drift this helper exists to stop.
        - generic
        - github.com/atmaxmoj/standmeet/internal/conversation/inference.Provider
        - github.com/atmaxmoj/standmeet/internal/infra/sandbox.Runner
        - github.com/atmaxmoj/standmeet/internal/plugin/adapters.CalendarProxy
        - github.com/atmaxmoj/standmeet/internal/plugin/adapters.MailProxy
        - github.com/atmaxmoj/standmeet/internal/corpus/entity.Document
        - github.com/atmaxmoj/standmeet/internal/corpus/integration.Integration
        - github.com/atmaxmoj/standmeet/internal/corpus/integration.Source
        # J.3: the jobs plugin's Fiber factory has the same shape as the main mcp
        # package (NewXxx → registry.Fiber); external code registers via the
        # Fiber interface without coupling to the impl type.
        - github.com/atmaxmoj/standmeet/internal/plugin/registry.Fiber
        # the named-dependency / supplier registries resolve by name back to an "element
        # interface" — the same shape as Document/Integration's registry-lookup
        # (DepRegistry.Lookup / Suppliers.Lookup return a by-design interface, and the
        # consumer type-asserts to the seam interface).
        - github.com/atmaxmoj/standmeet/internal/plugin/registry.DepProvider
        - github.com/atmaxmoj/standmeet/internal/plugin/adapters.Supplier
        # the security facade's captcha factory: returns a turnstile / noop concrete impl
        # by cfg, exposing only the Verifier interface — the same driver-selection factory
        # pattern as inference.Provider.
        - github.com/atmaxmoj/standmeet/internal/security/facade.Verifier
    revive:
      enable-all-rules: true
      rules:
        # Keep revive's default ≤5 — 5 public types in one file is a healthy "one
        # aggregate per file" signal. Domains split files by aggregate (owner /
        # access_code / conversation / wiki / raw / microsite /
        # page_content / instance / api_token / access_request) and meet it naturally.
        # Cap function inputs at 5.  Anything richer should
        # consolidate into a struct so the call sites stop counting
        # commas — same rationale as ESLint `max-params: 5` in the
        # TS services.
        - name: argument-limit
          arguments: [5]
        # Cap function outputs at 2 — anything beyond `(value, error)`
        # belongs in a result struct (named fields self-document) or
        # uses a sentinel error to encode the "not found" case in the
        # error channel (stdlib convention: sql.ErrNoRows, io.EOF).
        # The few legitimate exceptions — wire's `(value, cleanup,
        # error)` cleanup-func contract — carry a per-line `//nolint`
        # naming the reason.
        - name: function-result-limit
          arguments: [2]
        # line-length-limit at the default 80 fires for any
        # post-gofmt line one comma past the column.  Go's stdlib
        # itself runs to ~100, and our wrapped error messages /
        # SQL fragments routinely sit in the 80-95 range.  100 is
        # the smallest cap that doesn't punish gofmt's natural
        # break choices.
        - name: line-length-limit
          arguments: [100]
        # add-constant flags repeated literals as candidates for
        # named constants.  Defaults treat *every* 0/1/2 as a magic
        # number — too noisy for Go where `len(x) == 0` and
        # `[]T{...}` are written naked.  Whitelist the bookkeeping
        # ints; bump the string repetition threshold from 3 to 5 so
        # genuinely repeated wire-shape keys still get caught.
        - name: add-constant
          arguments:
            - max-lit-count: "5"
              allow-strs: '""'
              allow-ints: "0,1,2,3,24,100"
              allow-floats: "0.0,1.0"
    gosec:
      excludes:
        # G115 fires on every numeric type conversion; pgx already
        # returns int64s we knowingly cast to int.  Re-enable per-file
        # if we ever accept untrusted numeric input from the wire.
        - G115
        # G117 fires on sensitive naming patterns in marshaled structs ("token" /
        # "key" / "secret"). Returning a visitor session token / API token plaintext
        # to the client via JSON response is by design (issuing a credential, not a
        # leak). Renaming the field to dodge it would hurt API readability.
        - G117
        # G124 fires on an http.Cookie literal missing Secure/HttpOnly/SameSite. Our
        # CSRF cookie uses the double-submit pattern, so HttpOnly must be false (the
        # frontend JS reads the cookie value to put it in the X-Csrftoken header). lint
        # doesn't know this semantics and always false-positives. Secure + SameSite=Lax
        # still guard the attack surface.
        - G124
        # G304 fires on os.Open(varPath) — on the microsite asset serve path the
        # filename comes from a URL segment and must be a variable. joinSafeAssetPath
        # already does a prefix-containment check, so the path passed to os.Open can't
        # escape BuildsRoot. gosec doesn't know about that check.
        - G304
        # G705 fires when "taint analysis thinks untrusted input is written to an HTTP
        # response". In the microsite handler, owner-controlled HTML is by design meant
        # to be sent out (the owner writes their own page). The baseHref that injectBase
        # injects already goes through html.EscapeString for quote/<> escaping; taint
        # analysis doesn't know that.
        - G705
    forbidigo:
      # analyze-types: true makes forbidigo match TYPE references too,
      # not just call expressions.  Required for the `any` ban below.
      analyze-types: true
      # Mirror of the TS services' `no-console` ESLint rule (project
      # memory `feedback_no_console_log`): server logging must funnel
      # through `log/slog`.  `fmt.Print*` writes straight to stdout
      # without a level, without structure, and without the request-
      # scope fields slog carries — banned in src.  Tests and main.go
      # are exempt (test tables print failures; main's *boot* log is
      # fine via slog and the `panic` path can stay).
      #
      # `any` is banned in business code (domain / application /
      # presentation / middleware).  The pgx driver contract forces
      # variadic `args ...any` and `Scan(dest ...any)` at the
      # postgres-repo layer — that layer is exempt via the path
      # exclusion below.  Anywhere else, `any` is an unpacking
      # anti-pattern that hides what's flowing through the seam.
      forbid:
        - pattern: ^fmt\.Print(|f|ln)$
          msg: "use log/slog (server) instead of fmt.Print* — see feedback_no_console_log"
        - pattern: ^any$
          msg: "type `any` is banned in business code; use a typed parameter (pgx-boundary repos in internal/infrastructure/postgres/ are exempt)"

  exclusions:
    # Echo's handler contract is `func(c echo.Context) error` — the
    # idiomatic return is `return c.JSON(status, body)`.  wrapcheck
    # demands we wrap the error from any interface call, but echo
    # owns that error (response write + its error handler), so
    # wrapping would break the framework's contract.
    rules:
      # Domain facade packages (internal/<domain>/facade/) are named after the domain,
      # not the directory — the directory is uniformly called facade (by convention: it's
      # obvious at a glance this is the outward shell), while the package keeps the domain
      # name so call sites write `security.Verifier` rather than `facade.Verifier` (which
      # would collide across domains / force aliases). Exempt only this one revive rule.
      - path: internal/[a-z0-9]+/facade/
        text: "package-directory-mismatch"
      # A facade is a pure re-export thin shell: the real codedoc lives on the impl
      # subpackage's symbols, and the protocol overview lives in the package doc. Copying
      # doc onto every `type X = pkg.X` alias is noise, so exempt the facade directory's
      # doc/structure-counting rules:
      #   - exported / godoclint: aliases don't need per-item doc (the section comments +
      #     package doc already give the protocol).
      #   - max-public-structs: a facade lifts a whole domain's API, so it's naturally >5;
      #     the ≤5 "one aggregate per file" heuristic doesn't apply.
      - path: internal/[a-z0-9]+/facade/
        text: "exported"
      - path: internal/[a-z0-9]+/facade/
        linters: [godoclint]
      - path: internal/[a-z0-9]+/facade/
        text: "max-public-structs"
      # A re-exported generic type alias in a facade `type T[X any] = pkg.T[X]` uses `any`
      # as a type constraint, not a business `any` payload — forbidigo's any-ban doesn't
      # apply to a facade's generic forwarding.
      - path: internal/[a-z0-9]+/facade/
        linters: [forbidigo]
      # An EXTERNAL test package (`package foo_test`) reaches the package under test across a
      # package boundary by construction, so wrapcheck sees every call into it as "external" and
      # asks the test to wrap the error. A test does not wrap: it asserts on the error, or it fails.
      # Scoped to _test.go so production callers keep their wrapcheck budget.
      - path: _test\.go$
        linters: [wrapcheck]
      # internal/plugin/effect is the port of arXiv:2608.25512 (docs/design/plugin/effects.md).
      # It is currently a CONTRACT: every method panics, and 119 properties behind the
      # Two rules do not apply to it, each for a reason that is a design decision rather than an
      # omission.
      #
      # 1. unused-parameter / unused-receiver. Every body is `panic(notImplemented)`, so of course
      #    nothing reads the parameters. Renaming them to `_` would delete the signature's
      #    documentation, which is the package's entire present value — `Target(n Name)` says what
      #    it takes; `Target(_ Name)` says nothing. REMOVE THIS ROW when the package is implemented;
      #    at that point an unused parameter is a real finding again.
      - path: internal/plugin/effect/
        text: "unused-(parameter|receiver)"
      # 2. fieldalignment. The structs are laid out in the PAPER's field order — Definition 49's
      #    fiber is ⟨d, p, e, π, σ, τ, θ⟩ and Definition 81's entry likewise — so that each reads
      #    against the definition it ports. A few bytes of padding on types that exist in the tens,
      #    not the millions, is the right side of that trade.
      - path: internal/plugin/effect/
        text: "fieldalignment"
      # 2. forbidigo's `any` ban. Definition 29 gives each key its own value type V_k, so the
      #    coeffect table is heterogeneous BY CONSTRUCTION and an observer runs operations over a
      #    value whose type it does not know. This is the same shape the pgx boundary is exempt for:
      #    a generic container at the edge of the type system, not `any` standing in for a type
      #    somebody could not be bothered to write.
      - path: internal/plugin/effect/
        linters: [forbidigo]
      # A domain's guts (entity/repo/usecase) have package names that happen to be the
      # common local-variable names from before the split (repo/entity). Domain-internal
      # code naming "this repo" as repo is clear; the shadow here is a pre-existing product
      # of the split. Exempt the two sibling rules revive(import-shadowing) and
      # gocritic(importShadow).
      - path: internal/[a-z0-9]+/(entity|repo|usecase)/
        text: "[iI]mport.?[sS]hadow"
      # repo_seo's UpdateWikiSEO/UpdateOutputSEO/… are a "parallel-by-genre" set of SEO
      # update methods, isomorphic in shape and differing only by a genre constant + return
      # type — pre-existing before the split, and deduping is a separate refactor, so exempt
      # dupl here.
      - path: internal/corpus/repo/seo.go
        linters: [dupl]
      # HTTP route handlers (echo `func(c) error`) only — mcphandle lives
      # under internal/routes/ too but returns capreg.MCPResult, not error,
      # so it is NOT exempt from wrapcheck (keeps its pre-move budget).
      - path: internal/routes/(admin|public|sys)/
        linters: [wrapcheck]
      # A domain's ops package classifies its own errors into the protocol-neutral
      # vocabulary (facadeparity.BadInput / NotFound / Coded / …). Those constructors
      # MAKE an error; there is nothing upstream to wrap, and wrapping one would hide
      # the class from the faces that switch on it.
      - path: internal/[a-z0-9]+/ops/
        linters: [wrapcheck]
      # Blocks and the seams they use declare their own resources in the composition root
      # (cmd/server/blockwire) — same job as a domain's ops package, same reason. This was
      # cmd/server/axis(cap|conn)/ before the two axes became one.
      - path: cmd/server/blockwire/
        linters: [wrapcheck]
      # pagestore_adapter.go backs the page-store interface with blockstore in the composition
      # root — same job as blockwire: it hands the domain a bound store, and wrapping the
      # store's errors here would only add a composition-root frame the domain never reads.
      - path: cmd/server/micrositestore_adapter\.go
        linters: [wrapcheck]
      # boot_wireup_pages.go's mapMicrositeStoreErr classifies the store's sentinels into display
      # errors (apierr.DisplayWrap) at the composition root — same job/reason as provider_models:
      # the constructor MAKES the classified error the face's apierr.Classify then renders.
      - path: cmd/server/boot_wireup_microsites\.go
        linters: [wrapcheck]
      # provider_models.go does that same classification for the port it implements:
      # providermodels speaks HTTP (DisplayError), the faces speak facadeparity, and the
      # composition root is where that translation belongs. fp.Coded/BadInput MAKE the
      # classified error — wrapping one buries the sentence the owner is supposed to read
      # (it read "internal error" until this translation existed).
      - path: cmd/server/provider_models\.go
        linters: [wrapcheck]
      # providermodels classifies a provider failure into the display vocabulary
      # (apierr.Display / DisplayWrap) for whoever asks — same job as an ops package,
      # same reason: those constructors MAKE the error, and wrapping one would hide the
      # DisplayError from apierr.Classify at the face. It used to live in routes/public,
      # which is exempt above; the move (F-R-11) did not change what it does.
      - path: internal/infra/providermodels/
        linters: [wrapcheck]
      # Same echo-handler reasoning for middleware as for routes:
      # `func(c echo.Context) error` requires `return c.JSON(...)`.
      - path: internal/infra/middleware/
        linters: [wrapcheck]
      # cyclop runs at the looser business budget (≤5) — the HTTP route
      # layer's stricter ≤3 cap is enforced by scripts/check-routes-
      # cyclo.sh, which uses gocyclo against admin/public/sys only.
      # Excluding those here avoids double-reporting (one error per
      # violation rather than two with subtly different framings).
      # mcphandle is an MCP controller (inline schemaless-arg parsing),
      # not an HTTP handler — it stays on the cyclop ≤5 business budget,
      # exactly as it was under the old internal/mcp path.
      - path: internal/routes/(admin|public|sys)/
        linters: [cyclop]
      # inference's retry transport / timeout finalization are unexported helpers worth
      # white-box unit-testing directly (retryTransport / drainResp / agentTurnTimeout,
      # etc.). testpackage always demands an external test pkg, but an external pkg can't
      # reach the unexported symbols, while an internal test pkg gets blocked by
      # go-arch-lint as a self-import. Exempt testpackage here.
      - path: internal/conversation/inference/
        linters: [testpackage]
      # mailer's buildMessage (RFC822 rendering + header-injection stripping) is
      # unexported and worth white-box unit-testing; exempt testpackage as with inference.
      - path: internal/infra/mailer/
        linters: [testpackage]
      # marketplace's parseSkillMD (SKILL.md frontmatter parsing) is unexported and
      # white-box unit-tested; exempt testpackage as above.
      - path: internal/marketplace/
        linters: [testpackage]
      # corpus/obsidian's extFromContentType (attachment extension inference) is
      # unexported pure logic worth white-box unit-testing; exempt testpackage as above.
      - path: internal/corpus/obsidian/
        linters: [testpackage]
      # stats/ops's jobHealth (background-job freshness → overdue) is unexported pure
      # time logic worth white-box unit-testing; exempt testpackage as above.
      - path: internal/stats/ops/
        linters: [testpackage]
      # (The dockerstat unsecure-url-scheme exemption is gone with its subject: that reader
      # talked to the Docker Engine API over a unix socket, and selfstat replaced it with a
      # cgroup read that makes no HTTP request at all. An exemption whose code no longer
      # exists is one more rule nobody re-checks.)
      # tools/ are build-time lint tools (archcheck: the internal/ import-graph gate), not
      # server business code: their output medium is stdout/exit code (not slog), and graph
      # algorithms (DFS cycle-finding / layering / directory walks) are naturally branchy.
      # These are inherent to the CLI shape, not fixable smells; the real issues (bare any /
      # line length / os.Exit placement / unwrapped errors) are all fixed per the rules.
      # gosec G703 is a "walking your own repo's directories" false-positive.
      - path: tools/
        linters: [cyclop, gocognit, gosec]
      # blockload's block-loading glue (toolCallBudget / the ext-mcp bundle, etc.) is
      # unexported and worth white-box unit-testing; exempt testpackage as with usecases.
      - path: internal/routes/blockload/
        linters: [testpackage]
      # mount is the other half of that glue — turning a manifest into a fiber (dial, tool
      # wrap, state, gates) — and its internals are unexported for the same reason. These
      # tests were under internal/routes/capload before the block-vocabulary rename split
      # loading from mounting; the exemption follows them.
      - path: internal/plugin/mount/
        linters: [testpackage]
      # infra/openapi is #155's generic execution core: a schemaless-JSON boundary (any
      # SaaS's request/response is arbitrary JSON), so `any` is legitimate here — exempt
      # forbidigo as at the MCP/postgres boundaries; its pure logic (ParseSpec/ParseBinding/
      # bidirectional JSONata shape normalization) is worth backend-internal white-box UT, so
      # exempt testpackage.
      - path: internal/infra/openapi/
        linters: [testpackage, forbidigo, nilnil, paralleltest]
      # egress's safeDialAddr (SSRF TOCTOU: dial the pin-verified IP) is
      # unexported, and its white-box UT injects a fake resolver (swapping the package-global
      # lookupIPAddr) to verify pin/rebind → which naturally conflicts with paralleltest
      # (parallel runs would race that global). Exempt testpackage + paralleltest.
      - path: internal/infra/egress/
        linters: [testpackage, paralleltest]
      # The supplier layer: the openapi/protocol assemblers and the seam dispatcher. It sits on
      # the same schemaless-JSON boundary as infra/openapi (a supplier's args and response are
      # arbitrary JSON), and its unexported internals (auth injection, the oauth refresher, the
      # seam lookup) are worth white-box UT. These were the supplier packages before the
      # block-vocabulary rename; the exemption follows the code rather than the old address.
      - path: internal/plugin/adapters/
        linters: [testpackage, paralleltest, forbidigo, nilnil]
      # httpx's safeInternalDialAddr (the same SSRF pin/rebind guard as supplier egress, for
      # allow-list-free inline-fetch) is an unexported white-box UT that injects a fake
      # lookupIPAddr → exempt testpackage + paralleltest.
      - path: internal/infra/httpx/
        linters: [testpackage, paralleltest]
      # routes/public's setVisitorSessionCookie (the Secure flag) is an unexported helper, and
      # a white-box UT reaching it must be in-package → exempt testpackage (the test itself
      # already uses t.Parallel, so paralleltest is not involved).
      - path: internal/routes/public/
        linters: [testpackage]
      # (internal/domain is dissolved; its compileGlob-cache exemption lives on as the
      # access/entity row directly below, which is where that test went.)
      # path_acl's compileGlobCached cache is an unexported white-box UT (moved into access
      # along with the role cluster).
      - path: internal/access/entity/path_acl_cache_test.go
        linters: [testpackage, paralleltest]
      - path: internal/conversation/usecase/ghost_policy_test.go
        linters: [testpackage]
      # waypoint ledger white-box UT: repro of the visited-set logic in unexported
      # markAll/stringSet.
      - path: internal/conversation/usecase/waypoint_ledger_test.go
        linters: [testpackage]
      - path: internal/conversation/usecase/resolve_code_prompt_test.go
        linters: [testpackage]
      - path: internal/conversation/usecase/visitor_chat_prompt_test.go
        linters: [testpackage]
      # corpus map/stub/crosslink white-box UT: pure-logic repro of the internal
      # tree/heading/crosslink logic (findNode/extractHeadings/resolveNoteDstIDs) → must be
      # in-package.
      - path: internal/corpus/usecase/corpus_map_test.go
        linters: [testpackage]
      - path: internal/corpus/usecase/corpus_stub_test.go
        linters: [testpackage]
      - path: internal/corpus/usecase/wiki_crosslink_test.go
        linters: [testpackage]
      # corpus_grep's never-miss property test: the judge step (GrepBody / CompileGrep) is
      # in-package pure logic, so must be in-package as above. add-constant is meaningless for
      # the generated-corpus sizes (they are random upper bounds, not business constants); the
      # parts that warrant naming are named.
      - path: internal/corpus/usecase/corpus_grep_test.go
        linters: [testpackage]
      # corpus/i18n's tolerance-table tests: the objects under test (Parse / Validate /
      # Render) are all in-package (the parser's internal shape is the thing being tested), so
      # must be in-package.
      - path: internal/corpus/i18n/
        linters: [testpackage]
      - path: cmd/server/
        linters: [testpackage, paralleltest]
      # hnFirstLine / readOK are unexported job-fetch helpers with pure-logic white-box repros.
      - path: internal/owner/jobs/fetch/
        linters: [testpackage]
      # sweep TOCTOU test uses unexported Manager fields + stillStale → in-package white-box.
      - path: internal/infra/sandboxws/
        linters: [testpackage]
      # monitor/mw's statusRecorder is the unexported ResponseWriter wrapper Record puts on every
      # public route; the test asserts it still forwards Flush + the write deadline (losing them
      # silently un-streamed the visitor's SSE), so it must be in-package white-box.
      - path: internal/monitor/mw/
        linters: [testpackage]
      # dbq repro asserts the generated UpdateNoteSEO query string (unexported const) carries the
      # owner_id tenant filter → must be in-package white-box (now in corpus's db subpackage).
      - path: internal/corpus/db/
        linters: [testpackage]
      # Each domain's self-owned <domain>/db (sqlc-generated) and pgstore's DBTX primitives
      # deal with the pgx interface, where `any` is unavoidable in the driver contract
      # (DBTX.Exec(... ...any), Scan(dest ...any), etc.). The business layer bans `any` to keep
      # data flow readable; the DAO layer + DB primitives are exempt in turn.
      - path: internal/.*/db/
        linters: [forbidigo]
      - path: internal/infra/pgstore/
        linters: [forbidigo]
      # #135: after domain modules absorbed the pgx-boundary repo, repo/ is still the
      # pgx/sqlc driver-contract layer (Scan(dest ...any), json.Marshal(v any), etc.), so
      # exempt bare any as at the postgres boundary.
      #
      # Match by **directory**, not by filename prefix. It used to be `repo_.*\.go$` — once
      # the prefix was dropped, that rule silently mismatched, and the whole batch of files
      # suddenly got caught by this linter. The exemption criterion was always "it lives in
      # the repo layer", not "its filename starts with repo_".
      - path: internal/.*/repo/
        linters: [forbidigo]
      # The MCP layer takes schemaless JSON args (mcp-go parses tool args into
      # map[string]any, and array types into []any). This is a protocol contract, not
      # business state, so exempt as with postgres. The owner MCP handles now live in
      # routes/mcphandle (the controller layer), but their shape is still the MCP protocol
      # contract, not an HTTP route handler.
      - path: internal/routes/mcphandle/
        linters: [forbidigo]
      # The meili SDK boundary: UpdateFilterableAttributes's parameter is []interface{} →
      # []any; the search wrapper is a driver-contract layer (as with postgres), so exempt
      # `any` here.
      - path: internal/corpus/search/
        linters: [forbidigo]
      # mcpclient is the MCP vendor boundary layer. A tool's `_meta` is arbitrary schemaless
      # JSON per the MCP spec (mcp-go's AdditionalFields is map[string]any), so exempt as a
      # protocol contract; mcpclient only passes it through, never interprets it.
      - path: internal/infra/mcpclient/
        linters: [forbidigo]
      # hostsocket is the built-in host↔sandbox unix-socket transport boundary layer. The
      # wire is schemaless line-JSON (dynamic per op), the same nature as mcpclient, so
      # exempt bare any likewise.
      - path: internal/infra/hostsocket/
        linters: [forbidigo]
      # J.3: the jobs plugin’s MCP ops have the same shape as internal/mcp, the
      # same schemaless protocol contract (map[string]any payload).
      - path: internal/owner/jobs/jobsmcp/
        linters: [forbidigo]

      # facade-parity manifest is a declaration DATA table — line-length / func-length rules
      # (meant for logic) only hurt its readability; the data is the point.
      - path: internal/infra/paritymanifest/manifest_table
        linters: [revive, funlen]
      # mcputil: the shared owner-MCP result marshaller. Generic JSON wrapping naturally
      # takes an `any` payload (json.Marshal is just any), the same schemaless protocol
      # boundary as mcphandle/mcpclient/hostsocket, so exempt likewise — keeping the
      # registry's own any-ban strict.
      - path: internal/infra/mcputil/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
