id: corpus.retrieval
title: Search the corpus
version: "1"
shape: visitor_only
# always —— the tools are always exposed; an empty scope yields empty results, matching the old in-process behavior.
acl: always
# Tools keep their canonical names: corpus_search stays corpus_search, no <id>_ prefix.
raw_tool_names: true

# config —— owner-level settings. public_search opens the corpus_search BlockWidget to a
# codeless (anonymous) visitor on a public microsite, over the PUBLISHED-only corpus, rate
# limited per IP. Off (default) keeps today's "open this page with a code" refusal. The host
# reads this generically (blockconfig); the plugin never sees it — the server gates on it.
config:
  - key: public_search
    label: Let anyone search your published corpus
    type: bool
    default: "false"
    description: >-
      When on, a visitor with no access code can run corpus_search from a public microsite,
      over your PUBLISHED corpus only (rate-limited per IP). When off, the search widget asks
      the visitor to open the page with a code.

# visitor_tools —— see the note in calendar.book: before dispatching a call, we must be able to say which tool belongs to which block.
visitor_tools:
  - corpus_search
  - corpus_read
  - corpus_list
  - corpus_links
  - corpus_map
  - corpus_resolve
  - corpus_peek
  - corpus_grep

transport:
  kind: sandbox_stdio
  command: node
  args: ["/plugin/retrieval-mcp.js"]
  sandbox:
    plugin_dir: /srv/plugins/retrieval
    # To reach backend corpus data, name one of these eight ops. The socket path is derived from the id; the manifest does not write it.
    # The per-session corpus-ACL scope arrives via tool-call _meta; the host side rebuilds AllowsCorpus from it.
    host_ops:
      - corpus_search
      - corpus_read
      - corpus_list
      - corpus_links
      - corpus_map
      - corpus_resolve
      - corpus_peek
      - corpus_grep
