id: discord
title: Discord
provides: im
help: >-
  Paste your bot's token: discord.com/developers/applications → your app (New Application if you
  have none) → Bot → Reset Token → copy. Then invite the bot (OAuth2 → URL Generator → bot) or DM it.

# kind: credential — like telegram: the owner stores a Discord bot token and this block does nothing
# itself. The im-bridge reads the token from GET /internal/im/config and runs the bot through the
# Chat SDK's Discord adapter, over the Gateway (an outbound connection — a self-hosted instance
# needs no public callback URL). The bridge turns the bot's Message Content intent on by itself.
#
# url + headers — where the token is accepted: Connect asks Discord first, so a token Discord
# refuses is refused on the owner's card, not discovered in the bridge's log.
transport:
  kind: credential
  url: https://discord.com/api/v10/users/@me
  headers:
    Authorization: "Bot {token}"

# No owner_ops and no seam contract: a credential only, as for telegram.
