id: google-calendar
# title —— what the owner is told to connect. Declared here because the host must not hold
# a table of display names for blocks whose identities it is not supposed to know.
title: Google Calendar

# provides —— the seam this block supplies. `calendar.book` says `requires: [calendar]`
# and never names Google; swapping in a CalDAV block that also provides `calendar`
# leaves every consumer untouched. This used to be spelled `category`, one word for
# the supply side and another for the demand side of the same name.
provides: calendar

# google-calendar is an app on the Google Calendar HTTP API — so it is a BLOCK: the generic
# JS openapi engine (infra/plugins/google-calendar) wrapped as a stdio-MCP server, carrying no
# Go. The substrate dials it and routes the calendar seam's verbs (free_busy / insert_event /
# delete_event / verify) to its tools. The HOST keeps the spec + oauth (spec/binding/auth_scheme
# below): connect runs the host OAuth dance, per-op scope shortfall is checked host-side, and the
# token is refreshed host-side and merged into each call — only the HTTP to Google runs in the
# block. allow_net because it reaches the Google Calendar API (the dev mock in tests, via the
# host-supplied base_url).
# google-calendar is an app on the Google Calendar HTTP API — so it is a BLOCK: the generic
# JS openapi engine (infra/plugins/google-calendar) wrapped as a stdio-MCP server, carrying no
# Go. The substrate dials it and routes the calendar seam's verbs (free_busy / insert_event /
# delete_event / verify) to its tools. The HOST keeps the spec + oauth (spec/binding/auth_scheme
# below): connect runs the host OAuth dance, per-op scope shortfall is checked host-side, and the
# token is refreshed host-side and merged into each call — only the HTTP to Google runs in the
# block. allow_net because it reaches the Google Calendar API (the dev mock in tests, via the
# host-supplied base_url).
transport:
  kind: sandbox_stdio
  command: node
  # plugin_dir (/srv/plugins/google-calendar) is bound read-only at /plugin in the sandbox.
  args: ["/plugin/openapi-mcp.js"]
  auth_scheme: oauth2
  spec: spec.yaml
  binding: binding.yaml
  sandbox:
    plugin_dir: /srv/plugins/google-calendar
    allow_net: true

# owner_ops —— the owner-side operations this supplier exposes on its own.
#
# "Is it still working" matters more for calendar than elsewhere: OAuth authorization can be
# revoked on the provider side, refresh tokens can be rotated out, and the "connected" badge
# on the card checks nothing —— so a break stays invisible until a visitor tries to book a
# meeting and it blows up (F-C-16).
#
# Uses free/busy instead of creating an event: read-only, leaves nothing on the owner's
# calendar, and one successful call proves the whole chain at once —— the credential is real,
# the token is valid or **was transparently refreshed**, the granted scope is enough, and the
# account is reachable.
owner_tools:
  - name: suppliers.calendar_check
    tool: calendar.check
    description: >-
      Ask the connected calendar what it is busy with over the next few days.
      Read-only — it books nothing. Proves the credential still works and the
      token still refreshes.
    input_schema: |
      {
        "type":"object",
        "properties":{
          "days":{"type":"integer","description":"How many days ahead to look (default 7)."}
        }
      }
  # calendar.list_calendars rides on this manifest too but acts on whichever calendar is ACTIVE
  # (like calendar.check): it lists the connected account's calendars by name + collection URL, so
  # the owner switches calendars by picking one instead of hand-typing a GUID URL. CalDAV lists via
  # discovery; a provider that can't enumerate answers with a reason, not a crash.
  - name: suppliers.calendar_list
    tool: calendar.list_calendars
    description: >-
      List the calendars in the connected account (name + collection URL). Use it
      to find a calendar's URL when switching which calendar bookings land on,
      instead of pasting the URL by hand. Read-only.
    input_schema: |
      {
        "type":"object",
        "properties":{}
      }
