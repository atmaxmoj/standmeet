id: summarize_conversation
title: Summarize the conversation
version: "1"
shape: visitor_only
acl: always
raw_tool_names: true

# visitor_tools —— see the note in calendar.book.
visitor_tools:
  - summarize_conversation

transport:
  kind: sandbox_stdio
  command: /plugin/summarize
  sandbox:
    plugin_dir: /srv/plugins/summarize
    # Summarizing one conversation needs: read the transcript, ask what the owner is called,
    # borrow the owner's model to run one generation, hand the report back to store.
    # Credentials never leave the host — the sandbox gets the result, not the key.
    #
    # owner.meta was added later: the report is written about **a person**, and this plugin
    # previously had no idea who that person was, so it wrote the owner as "the assistant"
    # (F-A-33). The name goes through an allowlisted verb, the same path booker uses to get the
    # timezone.
    host_ops:
      - conversation.read
      - owner.meta
      - inference.generate
      - report.store
