id: corpus.retrieval
title: Search the corpus
version: "1"
shape: visitor_only
# always —— the tools are always exposed; an empty scope yields empty results, matching the old in-process behavior.
acl: always
# Tools keep their canonical names: corpus_search stays corpus_search, no <id>_ prefix.
raw_tool_names: true

# visitor_tools —— see the note in calendar.book: before dispatching a call, we must be able to say which tool belongs to which capability.
visitor_tools:
  - corpus_search
  - corpus_read
  - corpus_list
  - corpus_links
  - corpus_map
  - corpus_resolve
  - corpus_peek
  - corpus_grep

transport:
  kind: sandbox_stdio
  command: /plugin/retrieval
  sandbox:
    plugin_dir: /srv/plugins/retrieval
    # To reach backend corpus data, name one of these eight ops. The socket path is derived from the id; the manifest does not write it.
    # The per-session corpus-ACL scope arrives via tool-call _meta; the host side rebuilds AllowsCorpus from it.
    host_ops:
      - corpus_search
      - corpus_read
      - corpus_list
      - corpus_links
      - corpus_map
      - corpus_resolve
      - corpus_peek
      - corpus_grep
