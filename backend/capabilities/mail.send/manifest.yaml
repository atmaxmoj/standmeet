id: mail.send
title: Email the owner
version: "1"
shape: visitor_only
acl: role_granted
raw_tool_names: true
# Hard-depends on the mail category slot: not connected → hidden entirely via the global single gate.
requires:
  - smtp

# visitor_tools — see the note in calendar.book.
visitor_tools:
  - send_email

transport:
  kind: sandbox_stdio
  command: /plugin/mail-sender
  sandbox:
    plugin_dir: /srv/plugins/mail-sender
    # Sending itself goes through the connector (category contract — the plugin
    # doesn't know whether the other side is SMTP or some SaaS);
    # reading the owner's name/email goes through owner.meta.
    host_ops:
      - connector.invoke
      - owner.meta
