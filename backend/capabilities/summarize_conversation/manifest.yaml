id: summarize_conversation
title: Summarize the conversation
version: "1"
shape: visitor_only
acl: always
raw_tool_names: true

transport:
  kind: sandbox_stdio
  command: /plugin/summarize
  sandbox:
    plugin_dir: /srv/plugins/summarize
    # 总结一次对话要：读逐字稿、问 owner 叫什么、借 owner 的模型跑一次生成、把报告交回来存。
    # 凭据永远不出宿主 —— 沙箱拿到的是结果，不是 key。
    #
    # owner.meta 是后加的：报告写的是**一个人**，而这个插件以前不知道那个人是谁，
    # 于是把 owner 写成了 "the assistant"（F-A-33）。名字走白名单动词，跟 booker 取时区同一条路。
    host_ops:
      - conversation.read
      - owner.meta
      - inference.generate
      - report.store
