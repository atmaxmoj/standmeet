category: calendar
kind: openapi
operations:
  list_busy:
    op: freebusy.query
    request: '{ "timeMin": timeMin, "timeMax": timeMax, "items": [{"id": "primary"}] }'
    response: '{ "busy": calendars.primary.busy }'
  create_event:
    op: events.insert
    request: >-
      {
        "id": idempotencyKey,
        "summary": summary,
        "description": description,
        "start": { "dateTime": start, "timeZone": timeZone },
        "end": { "dateTime": end, "timeZone": timeZone },
        "attendees": [visitorEmail ? { "email": visitorEmail }]
      }
    # 把人放进宾客名单**不等于**通知他 —— Google 只在带 sendUpdates=all 时发邀请邮件，
    # 默认什么都不发。没有邮箱就没人可通知，所以这里是条件式（F-B-7）。
    query: '{ "sendUpdates": visitorEmail ? "all" }'
    response: '{ "id": id, "htmlLink": htmlLink }'
  cancel_event:
    op: events.delete
    # eventId 走路径替换（/events/{eventId}），DELETE 无 body。
    # 会上坐着人就得告诉他会没了；没有与会者时不带这个参数。
    query: '{ "sendUpdates": attendeeEmail ? "all" }'
