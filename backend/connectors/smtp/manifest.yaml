id: smtp
kind: protocol
category: mail
protocol: smtp

# owner_ops —— 这个连接器自己出的 owner 侧操作。发一封测试信是**邮件连接器**的事,
# 所以声明在这儿,而不是长在通用的连接器注册表上(那层不该认识 mail)。
# op 指的是品类契约上的那个操作,宿主按它接实现。
owner_ops:
  - name: connectors.mail_test_send
    op: mail.test_send
    description: >-
      Send a test email through the active mail connector. Reports the mail kind
      that served it (proves the mailer is kind-agnostic).
    input_schema: |
      {
        "type":"object",
        "properties":{
          "to":{"type":"string","description":"Recipient address."},
          "subject":{"type":"string","description":"Message subject."},
          "text":{"type":"string","description":"Message body (plain text)."}
        },
        "required":["to"]
      }
