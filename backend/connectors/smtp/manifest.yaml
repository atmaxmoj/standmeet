id: smtp
kind: protocol
category: mail
protocol: smtp

# owner_ops —— the owner-side operations this connector exposes itself. Sending a
# test email is the **mail connector's** business, so it's declared here rather
# than living in the generic connector registry (that layer shouldn't know about mail).
# op refers to the operation on the category contract; the host wires the implementation to it.
owner_ops:
  - name: connectors.mail_test_send
    op: mail.test_send
    description: >-
      Send a test email through the active mail connector. Reports the mail kind
      that served it (proves the mailer is kind-agnostic).
    input_schema: |
      {
        "type":"object",
        "properties":{
          "to":{"type":"string","description":"Recipient address."},
          "subject":{"type":"string","description":"Message subject."},
          "text":{"type":"string","description":"Message body (plain text)."}
        },
        "required":["to"]
      }
