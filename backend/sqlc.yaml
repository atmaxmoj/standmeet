version: "2"
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/queries/corpus
    gen:
      go:
        package: db
        out: internal/corpus/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_db_tags: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "citext"
            go_type: "string"
          - db_type: "citext"
            go_type:
              type: "string"
              pointer: true
            nullable: true
