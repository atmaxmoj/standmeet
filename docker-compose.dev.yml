# docker-compose.dev.yml —— 本地开发用，docker compose up 一条命令。
#
# 共 5 服务：
#   app      - Next.js host build → docker COPY .next/standalone
#   backend  - Go binary，从 backend/Dockerfile build
#   builder  - 长轮询 /internal/builds/claim 跑 vite build 输出到共享 volume
#   db       - PostgreSQL + pgvector
#   redis    - 用于 session / 队列 / rate limit
#
# custom_pages_data —— builder + backend 共享 /srv/custom-pages：builder 写
# dist；backend 读 → 走 GET /api/v1/custom-pages/<handle>/<slug>/* 服务。

name: standmeet-dev

services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 用偏门端口避开和 macOS 上其它项目（lucerna / youteacher）冲突；
      # 普通访问走 nginx/Caddy 时再映回 80/443，dev 直连 38127 即可。
      - "38127:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/instance"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: production           # build stage 已经跑了 lint；M1 dev 走完整链
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgres://standmeet:standmeet_dev@db:5432/standmeet?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SESSION_KEY=dev-not-secret-rotate-in-prod
      - SECURE_COOKIE=false
      - INFERENCE_PROVIDER=mock
      - INFERENCE_MOCK_REPLY=Hello visitor, sijie says hi from the mock provider.
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - custom_pages_data:/srv/custom-pages
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/internal/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  builder:
    build:
      context: ./builder
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - custom_pages_data:/srv/custom-pages

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=standmeet
      - POSTGRES_USER=standmeet
      - POSTGRES_PASSWORD=standmeet_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "standmeet", "-d", "standmeet"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
  redisdata: {}
  custom_pages_data: {}
