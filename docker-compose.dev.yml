# docker-compose.dev.yml —— 本地开发用，docker compose up 一条命令。
#
# 共 5 服务：
#   app      - Next.js host build → docker COPY .next/standalone
#   backend  - Go binary，从 backend/Dockerfile build
#   builder  - 长轮询 /internal/builds/claim 跑 vite build 输出到共享 volume
#   db       - PostgreSQL + pgvector
#   redis    - 用于 session / 队列 / rate limit
#
# custom_pages_data —— builder + backend 共享 /srv/custom-pages：builder 写
# dist；backend 读 → 走 GET /api/v1/custom-pages/<handle>/<slug>/* 服务。

name: standmeet-dev

services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    # Dotted alias: single-token "app" hostname triggers Chromium's
    # HTTPS-upgrade heuristic when gotenberg fetches the print URL
    # (ERR_SSL_PROTOCOL_ERROR). Reaching it via app.standmeet.local skips
    # that heuristic.
    networks:
      default:
        aliases:
          - app.standmeet.local
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 用偏门端口避开和 macOS 上其它项目（lucerna / youteacher）冲突；
      # 普通访问走 nginx/Caddy 时再映回 80/443，dev 直连 38127 即可。
      - "38127:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/instance"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .                   # repo root: backend links mcp-servers/* in-process
      dockerfile: backend/Dockerfile
      target: production           # build stage 已经跑了 lint；dev 走完整链
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgres://standmeet:standmeet_dev@db:5432/standmeet?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      # meilisearch —— corpus 词法检索 index(1b)。写路径同步 upsert,读走 Search。
      - MEILI_URL=http://meilisearch:7700
      - MEILI_KEY=standmeet_dev_meili_key
      - SESSION_KEY=dev-not-secret-rotate-in-prod
      - INSTANCE_SECRET=dev-not-secret-rotate-in-prod-32-chars-min!
      - SECURE_COOKIE=false
      # 不再有 PUBLIC_URL env —— "对外是啥地址" 全部由 owner 在 claim 表单
      # 里填，写进 owners.public_url。SEO / QR / 任何对外链接都从 DB 读。
      # Backend always uses real anthropic-compat provider. In dev/e2e the
      # owner row's ai_endpoint is populated (post-claim seed in
      # e2e/fixtures/admin.ts or hand-set via admin UI) to point at the
      # llm-gateway service below; prod points at real api.anthropic.com.
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
      - SANDBOX_DRIVER=docker
      # MinIO / S3 storage for owner-uploaded images + attachments.
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=standmeet
      - STORAGE_SECRET_KEY=standmeet_dev_minio_password
      - STORAGE_BUCKET=standmeet
      - STORAGE_USE_SSL=false
      # PublicURL frontend hits to fetch presigned object URLs (host's mapped port).
      - STORAGE_PUBLIC_URL=http://localhost:9200
      # job-board fetcher base URLs point at the test mock so e2e doesn't
      # hit real Greenhouse / Lever / Ashby / RemoteOK / WWR / HN. Prod
      # leaves these unset → adapters use baked-in real URLs.
      - GREENHOUSE_BASE_URL=http://external-mock:9000/greenhouse
      - LEVER_BASE_URL=http://external-mock:9000/lever
      - ASHBY_BASE_URL=http://external-mock:9000/ashby
      - REMOTEOK_BASE_URL=http://external-mock:9000/remoteok
      - WWR_BASE_URL=http://external-mock:9000/wwr
      - HN_BASE_URL=http://external-mock:9000/hn
      - SMARTRECRUITERS_BASE_URL=http://external-mock:9000/smartrecruiters
      - WORKABLE_BASE_URL=http://external-mock:9000/workable
      - JBA_BASE_URL=http://external-mock:9000/jba
      - WORKDAY_BASE_URL=http://external-mock:9000/workday
      - BAMBOOHR_BASE_URL=http://external-mock:9000/bamboohr
      # Skill-marketplace search proxy upstreams. Both point at the
      # external-mock service in dev/e2e so the search never touches
      # public internet (rate limits / determinism). Production leaves
      # these unset → real api.github.com / api.skillsmp.com.
      - MARKETPLACE_GITHUB_BASE_URL=http://external-mock:9000/marketplace/github
      - MARKETPLACE_SKILLSMP_BASE_URL=http://external-mock:9000/marketplace/skillsmp
      # Gotenberg sidecar (headless Chromium) for resume PDF rendering.
      # applications.commit POSTs the admin /print/application URL here and
      # streams the rendered bytes back to Claude. Unset → NoopRenderer →
      # commit fails with ErrNotConfigured (e2e fallback during dev).
      - GOTENBERG_URL=http://gotenberg:3000
      # The app URL gotenberg loads to render the print view. The dotted
      # alias avoids Chromium's single-word-hostname HTTPS-upgrade heuristic
      # (which gives ERR_SSL_PROTOCOL_ERROR on plain `http://app:3000`).
      - PRINT_BASE_URL=http://app.standmeet.local:3000
      # Google OAuth + Calendar overrides → point at the in-stack mock.
      # GOOGLE_AUTH_URL is the consent-page base; backend embeds it
      # verbatim into the auth URL it returns to the BROWSER, so it must
      # be host-reachable (localhost). The other two are POSTed by the
      # backend itself, so they use the service-name address.
      # Unset in prod → backend talks to real Google.
      - GOOGLE_AUTH_URL=http://localhost:9000/google-oauth/auth
      - GOOGLE_TOKEN_URL=http://external-mock:9000/google-oauth/token
      - GOOGLE_CALENDAR_BASE=http://external-mock:9000/google-calendar
      # Connector SSRF egress allow-list (hostname). The mock resolves to a private
      # docker IP, so it must be explicitly allowed; prod leaves this unset → all
      # loopback/link-local/private targets are blocked.
      - CONNECTOR_EGRESS_ALLOW=external-mock
      # httpx SSRF guard allow-list (BYOAI endpoint / writings inline-fetch): the in-cluster mock
      # gateway is an internal IP, so allow it here; prod leaves this unset → all internal blocked.
      - EGRESS_ALLOW_HOSTS=llm-gateway,external-mock
      # Plugin discovery (Phase A): declares the in-stack mcp-server-mock as a
      # third-party MCP-app plugin 'echoer'. Prod leaves this unset → no
      # third-party plugins. (Bundled builtins like ask_visitor are NOT here —
      # they load in-process from their own modules, wired in the composition
      # root; nothing to mount or deploy separately.)
      - STANDMEET_PLUGINS=/etc/standmeet/plugins.json
      # per-session sandbox workspace root (#148): host dir the backend lazily
      # provisions per-conversation workdirs under, bwrap-binds at /workspace, and
      # cron-sweeps by TTL. Inside the backend container's writable fs.
      - SANDBOX_WORKSPACE_ROOT=/srv/sandbox-workspaces
      # 素材那条路只认 https,所以 external-mock 也有一个 https 面。它现签的证书
      # 合进这份 bundle(系统根 + 它),后端指过来就既信真根也信这个 mock。
      # 只在 dev/e2e:prod 用镜像自带的系统根。
      - SSL_CERT_FILE=/mock-tls/bundle.crt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-mock:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      mcp-server-mock:
        condition: service_healthy
      mail-mock:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    # sandbox 需要 root + docker socket：dev/e2e 用 owner-curated skill
    # 脚本（python/bash/node 跑在隔离 docker container 里）。生产同样需要
    # 这两个，docs 里说明权衡。
    user: "0:0"
    # bubblewrap (MCP 沙箱) 要在容器内建 user/mount namespace —— 默认 seccomp/
    # apparmor profile 挡 unshare(CLONE_NEW*)。放开让 bwrap 能起隔离环境。dev 后端
    # 本就 root + docker.sock，这一致；prod 同样需要，docs 里说明权衡。
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    volumes:
      - custom_pages_data:/srv/custom-pages
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/dev-plugins.json:/etc/standmeet/plugins.json:ro
      # 沙箱第三方 MCP 插件代码（dev：host 上 npm 装好的目录；bwrap 只读挂进沙箱）。
      - ./infra/plugins:/srv/plugins:ro
      # external-mock 现签的证书 + 合并根包(SSL_CERT_FILE 指到 bundle.crt)。
      - mocktls:/mock-tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/internal/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # mcp-server-mock —— e2e fixture: an external MCP HTTP server (just one
  # tool `ping_external`) so visitor-chat → MCP-client → external-server
  # 全链能在 e2e 里被验。owner 注册它当成"自家挂的 calendar/notion MCP"。
  mcp-server-mock:
    build:
      context: ./mock-stack
      target: mcp
    restart: unless-stopped
    environment:
      - PORT=9100
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  # payload-origin —— e2e 网络沙箱测试(T4)的**本地** HTTP 源:只在 compose 内网，
  # 不出公网。真 fetch MCP server(netfetch)从这里真下载一个带 marker 的文件 →
  # 证明 AllowNet 放行;cagedfetch(--network=none)拉同一 URL 失败 → 证明默认断网。
  payload-origin:
    image: python:3.12-slim
    restart: unless-stopped
    command: sh -c "printf 'REAL-LOCAL-DOWNLOAD-c41d8e\n' > /srv/payload.txt && cd /srv && exec python -m http.server 7070"
    expose:
      - "7070"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if 'REAL-LOCAL-DOWNLOAD' in urllib.request.urlopen('http://127.0.0.1:7070/payload.txt').read().decode() else 1)"]
      interval: 3s
      timeout: 3s
      retries: 10

  # external-mock —— test-only HTTP server serving captured fixtures from
  # e2e/fixtures/job-boards/. Backend points its 8 *_BASE_URL env vars at
  # this service so the fetcher chain never reaches the real internet.
  # See mock-stack/job-board/main.go for routes + day2 derivation.
  external-mock:
    build:
      context: ./mock-stack
      target: job-board
    restart: unless-stopped
    environment:
      - PORT=9000
      - FIXTURES_DIR=/fixtures
      # https 面(见 mock-stack/job-board/tls.go)。素材按地址取那一步只认 https。
      - TLS_PORT=9443
      - TLS_DIR=/mock-tls
    ports:
      # Exposed to host so e2e specs can hit /__mock/{set_day,reset} directly
      # via curl. Backend talks via the internal docker network.
      - "9000:9000"
      - "9443:9443"
    volumes:
      # Whole fixtures dir; mock reads job-boards/{kind}/ + marketplace/
      # as siblings under /fixtures.
      - ./e2e/fixtures:/fixtures:ro
      # 现签的证书 + "系统根 + 它" 的合并包写在这儿,后端只读挂同一个卷。
      - mocktls:/mock-tls
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/__mock/state"]
      interval: 3s
      timeout: 3s
      retries: 10

  # llm-gateway —— test-only Anthropic-compatible /v1/messages SSE server.
  # Backend's anthropic provider POSTs here in dev/e2e (owner's ai_endpoint
  # column points at it). Gateway has scripted-tool + scripted-reply admin
  # endpoints (/__mock/inference/next_tool, next_reply) so e2e fixtures
  # can drive each chat turn deterministically; default behavior is a
  # canned corpus_search→corpus_read→reply flow.
  llm-gateway:
    build:
      context: ./mock-stack
      target: llm-gateway
    restart: unless-stopped
    environment:
      - PORT=9300
      - INFERENCE_MOCK_REPLY=Hello visitor, alice says hi from the mock provider.
    ports:
      - "9300:9300"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9300/__mock/inference/state"]
      interval: 3s
      timeout: 3s
      retries: 10

  # mailpit —— test-only SMTP catcher. The mail-connector e2e points the
  # owner's SMTP config at mailpit:1025 (no auth, in-network), then asserts the
  # approve→issue→email access-code mail landed via Mailpit's HTTP API on :8025.
  # SMTP port is internal-only (backend reaches it by service name); only the
  # HTTP API is exposed so host-side Playwright can read captured messages.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    ports:
      # 18025 on the host (8025 commonly taken); e2e MAILPIT_URL points here.
      - "18025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10

  # mail-mock —— controllable SMTP fault layer in front of mailpit. The mail
  # connector e2e points the owner's SMTP host here (mail-mock:1025); a normal
  # send is forwarded to mailpit (so Mailpit still captures it + its inspection
  # API on :18025 is untouched), and POST :19400/__mock/smtp/fail arms send
  # failures for the error-stream / retry specs (E8/E10/E11 + owner-notify R6).
  mail-mock:
    build:
      context: ./mock-stack
      target: mail
    restart: unless-stopped
    environment:
      - PORT=9400
      - MAILPIT_SMTP=mailpit:1025
    ports:
      # 19400 on the host → host-side Playwright arms faults via /__mock/smtp/*.
      - "19400:9400"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9400/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  builder:
    build:
      context: ./builder
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - custom_pages_data:/srv/custom-pages

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=standmeet
      - POSTGRES_USER=standmeet
      - POSTGRES_PASSWORD=standmeet_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql 是唯一权威：fresh volume 首次启动时 postgres 自动应用。
      # schema 变化的姿势是 `make clean && make dev` 重建 volume —— 这是
      # 全新软件，没有任何 production 数据需要 migrate 的负担。
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    # -h 127.0.0.1 是必须的,不是啰嗦:不带它 pg_isready 走 unix socket,而 postgres
    # 官方 entrypoint 在 initdb 阶段会先起一个**只监听 socket** 的临时服务器来跑
    # /docker-entrypoint-initdb.d(也就是我们的 schema.sql),那时候 TCP 还没开。
    # 于是健康检查在库还不接受 TCP 连接的时候就报 healthy —— compose 据此放行
    # backend,backend 拨 TCP 被拒、当场 fatal 退出,`up --wait` 把这次退出记成
    # "依赖启动失败",整个 dev-up 废掉。
    #
    # 热卷时没有 initdb 这一段,所以这个洞**只在 make test-fresh 才现形**,
    # 平时永远看不见。加 -h 之后这条检查说的才是它声称的那件事:库接受 TCP 连接了。
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "standmeet", "-d", "standmeet", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # meilisearch —— corpus 词法检索(1b crawl face)。Postgres 是 source-of-truth,
  # meili 是派生投影;写路径同步 upsert/delete(读写一致)。相关性靠 owner 的 [[链接]]
  # (BFS,后置),不用 vector —— 故意不开 meili 的语义/vector 特性。
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=standmeet_dev_meili_key
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=development
    volumes:
      - meilidata:/meili_data
    # 不映射 host 端口:backend 经 compose 网络(meilisearch:7700)连,healthcheck 在容器内跑。
    # 避免跟宿主上别的 meili(如别项目的 7700)撞端口。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  # gotenberg —— headless Chromium PDF rendering sidecar. backend POSTs the
  # admin /print/application/<id> URL here at applications.commit time;
  # gotenberg loads it (Chromium = same engine as owner's preview), waits
  # for fonts + JS + network idle, prints to PDF, returns the bytes.
  #
  # We don't expose it to the host — it's an internal service the backend
  # alone consumes. v8 is the LTS line at 2026-05; chromium bundled.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Gotenberg 8 ships with a default deny-list that blocks private /
    # docker-compose IPs (172.x, 10.x, etc), which would 403 us on every
    # render. Empty deny + allow-anything matches the dev posture
    # (gotenberg is internal-only, no host-side ingress).
    command:
      - gotenberg
      - --chromium-disable-javascript=false
      - --chromium-deny-list=
      - --chromium-allow-list=.*
      - --api-timeout=60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # minio —— S3-compatible object storage for owner-uploaded images +
  # attachments (post covers, raw entry attachments, custom page assets).
  # Self-hostable single-node. Console on :9201; S3 API on :9200.
  # Bucket "standmeet" auto-created on first backend boot via internal/storage.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9201"
    environment:
      - MINIO_ROOT_USER=standmeet
      - MINIO_ROOT_PASSWORD=standmeet_dev_minio_password
    volumes:
      - miniodata:/data
    ports:
      - "9200:9000"
      - "9201:9201"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  # mocktls —— external-mock 现签的证书 + 合并根包;后端只读挂载来信任它。
  mocktls: {}
  meilidata: {}
  custom_pages_data: {}
