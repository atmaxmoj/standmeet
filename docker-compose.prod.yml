# docker-compose.prod.yml —— self-host owner runs this. It is docker-compose.dev.yml
# with exactly two kinds of change, nothing else:
#   1. the mock services + their *_BASE_URL / GOOGLE_* env overrides are removed,
#      so every connector talks to the real service (the backend's baked-in
#      defaults: real Google, real Greenhouse/Lever/…, real api.github.com, …);
#   2. dev placeholder secrets become env vars read from .env (cp .env.example).
# Everything else (services, volumes, sandbox docker socket, gotenberg flags,
# schema init mount, app alias) is identical to dev — keep them in sync. The one
# extra difference: host ports are offset from dev's (38227/8100/5532/6479/9210/
# 9211) so a local prod instance coexists with the dev/test stack.
#
# TLS / domain is handled OUTSIDE this stack (the owner's platform / Cloudflare /
# their own reverse proxy fronts the app's published port). No bundled proxy.

name: standmeet

services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    # Dotted alias: single-token "app" hostname triggers Chromium's
    # HTTPS-upgrade heuristic when gotenberg fetches the print URL
    # (ERR_SSL_PROTOCOL_ERROR). Reaching it via app.standmeet.local skips
    # that heuristic.
    networks:
      default:
        aliases:
          - app.standmeet.local
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The public entry point. Front it with your TLS proxy (domain:443 →
      # host:38227). Host ports are offset from dev's so both stacks coexist.
      #
      # Binds 127.0.0.1 by default: the product model is "TLS proxy in front",
      # and the proxy shares the host with the stack, so it reaches localhost directly.
      # Binding 0.0.0.0 directly = app reachable across the whole network over plain HTTP (pentest 2026-09-01).
      # When the proxy is on another machine, open it explicitly by setting APP_BIND_HOST=0.0.0.0 in .env.
      - "${APP_BIND_HOST:-127.0.0.1}:38227:3000"
    healthcheck:
      # Hits app's **own** route (see app/src/app/api/app-health/route.ts). It used to hit
      # `/api/v1/instance` — that one gets proxied to backend, so this check was measuring two hops. When the backend slows down,
      # a healthy app gets judged unhealthy and restarted by the orchestrator: bad news propagates, good news doesn't propagate back.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/app-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      # context = repo root (NOT ./backend): backend/Dockerfile does
      # `COPY backend/... / infra/scripts` + links mcp-servers/* in-process, so it
      # needs the whole repo — same as docker-compose.dev.yml. ./backend fails the COPYs.
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgres://standmeet:${POSTGRES_PASSWORD}@db:5432/standmeet?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SESSION_KEY=${SESSION_KEY}
      # at-rest encryption key for connector secrets/tokens (≥32 chars; cryptobox
      # refuses to boot otherwise). Rotate per instance.
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      # STANDMEET_PLUGINS —— unset means no discovered plugins at all. Pointing it
      # at the manifest above is what makes the sandbox dimensions (granted egress,
      # per-session workspace) exist on this deployment.
      - STANDMEET_PLUGINS=/etc/standmeet/plugins.json
      # true behind https; set false only for a plain-http localhost bring-up.
      - SECURE_COOKIE=${SECURE_COOKIE:-true}
      # "What's the outward-facing address" is filled by the owner in the claim form, written into owners.public_url; the LLM
      # provider is also configured by the owner in admin/MCP (ai_endpoint). Neither goes through env.
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
      # PUBLIC_IP —— the instance's public IP, shown on the admin System panel. The owner
      # sets it in .env (their server's public address); empty → the panel shows "—".
      - PUBLIC_IP=${PUBLIC_IP:-}
      - SANDBOX_DRIVER=docker
      # Turnstile captcha —— OFF unless the owner sets both in .env. The backend reads these
      # two; before F-G-2 neither compose file passed them, so "captcha is opt-in" was true of
      # the code and false of the product: there was no way for an owner to opt in.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      # Meilisearch —— the lexical index corpus search runs on. It ships IN this stack now.
      #
      # It used to be absent, with these two empty, and the fallback (Postgres FTS) was called
      # "the default this stack ships with". Measured on the live instance, that fallback cannot
      # do CJK: `to_tsvector('english', …)` never segments Chinese, so a query matches only when
      # it is byte-for-byte a contiguous Chinese run as it appears in the text. `无限衍义` found
      # its note; `限衍` and `三个序列` found nothing, and `三张资格证` missed a note whose own
      # heading contains it (the run there is `与三张资格证`). English was unaffected — which is
      # why a bilingual corpus made the hole invisible from one side.
      #
      # An empty index would be worse than the fallback, so this is safe only because the backend
      # backfills at boot (wire.SearchIndex → ReindexOwner) and a periodic reconcile keeps it
      # whole. Attaching the service and restarting is the whole migration.
      #
      # Point these at your own Meili to run one outside the stack; the service below is then
      # dead weight you can drop.
      - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
      - MEILI_KEY=${MEILI_KEY:-${MEILI_MASTER_KEY:-standmeet_meili_key}}
      # MinIO / S3 storage for owner-uploaded images + attachments.
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-standmeet}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-standmeet}
      - STORAGE_USE_SSL=false
      # Browser-facing base for presigned object URLs (your public storage origin).
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}
      - GOTENBERG_URL=http://gotenberg:3000
      # Dotted alias avoids Chromium's single-word-host HTTPS-upgrade heuristic.
      - PRINT_BASE_URL=http://app.standmeet.local:3000
      # EGRESS_ALLOW_HOSTS —— internal hosts the SSRF guard may dial (httpx/ssrf.go).
      # **Empty is the prod posture and stays the default**: block everything internal.
      # It is passed through so a verification run can name one host for the length of a
      # drive (the fault proxy in docker-compose.verify.yml) without editing this file —
      # resilience check 3 needs a provider endpoint that fails on demand, and the product's
      # own provider form is the only legal way to point at one.
      - EGRESS_ALLOW_HOSTS=${EGRESS_ALLOW_HOSTS:-}
      # CONNECTOR_EGRESS_ALLOW —— the same posture for the CONNECTOR guard
      # (internal/connector/egress.go), which is a separate policy from the one above: that one
      # covers everything the backend dials, this one covers what an assembled connector may reach.
      # Empty stays the default here too.
      #
      # It was read by the backend and passed by the DEV compose only, so on a shipped stack an
      # owner could never point a connector at a self-hosted service — a CalDAV server or a mailer
      # on their own LAN is exactly what the protocol connectors are for (F-C-49). The connect just
      # failed, and the card blamed their credentials.
      - CONNECTOR_EGRESS_ALLOW=${CONNECTOR_EGRESS_ALLOW:-}
      # CONNECTOR_SPEC_MAX_BYTES —— how large an OpenAPI spec this instance accepts
      # (default 2 MiB). It is a knob because real vendor documents outgrow any number we
      # would pick: GitHub publishes its REST description as one 12 MB file, so an owner
      # who wants that connector has nothing to turn (F-C-53). The ceiling still exists —
      # a runaway document must not take the instance down — but how high it sits is a
      # deployment decision, not a compile-time one.
      - CONNECTOR_SPEC_MAX_BYTES=${CONNECTOR_SPEC_MAX_BYTES:-}
      # MARKETPLACE_GITHUB_BASE_URL —— which skill catalogue this instance reads.
      # Empty = the public anthropics/skills repo (the backend default).
      #
      # It is here because an owner can legitimately run their own catalogue — their team's
      # skills, or a fork with the ones they actually use — and the backend has always read
      # this variable; only prod had no way to set it. Same shape as CONNECTOR_EGRESS_ALLOW
      # above (F-C-49): a knob that exists in code and is unreachable from a deployment is
      # not a knob. `check-knobs-reachable` cannot see this one — its `*_BASE_URL` exemption
      # was written for dev-only mock pointers and swallows this too.
      - MARKETPLACE_GITHUB_BASE_URL=${MARKETPLACE_GITHUB_BASE_URL:-}
      # No in-app upgrade knob here: this is the SOURCE-BUILD stack (git pull + rebuild is how
      # it upgrades), so it ships no updater sidecar and sets no STANDMEET_UPGRADE_SIGNAL. The
      # /admin/system button honestly reports it can't act and tells the owner to rebuild. The
      # image-based deploy (infra/deploy/docker-compose.yml) is where the updater + signal live.
      # STANDMEET_RELEASE_REGISTRY / _REPO —— where "is there a newer version" is asked.
      # Empty = the official images. A fork that publishes its own points these at itself.
      - STANDMEET_RELEASE_REGISTRY=${STANDMEET_RELEASE_REGISTRY:-}
      - STANDMEET_RELEASE_REPO=${STANDMEET_RELEASE_REPO:-}
      # NOTE: no other *_BASE_URL / GOOGLE_* overrides here — prod talks to the real
      # Greenhouse / Lever / Ashby / Google endpoints (backend defaults). dev adds the
      # mock overrides; that's the only env difference.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      # meilisearch —— NOT a hard dependency on purpose: the backend starts fine without it
      # (search degrades to Postgres FTS and says so on /admin/system). Waiting on it would
      # turn an optional index into a reason the instance cannot boot.
      meilisearch:
        condition: service_started
    ports:
      # Binds 127.0.0.1 only: app reaches backend over the docker internal network, this published port is only for host-side debugging.
      # Binding 0.0.0.0 would open the API to the whole network without going through the app's proxy (pentest 2026-09-01).
      - "127.0.0.1:8100:8000"
    # sandbox needs root + the docker socket: owner-curated skill scripts run inside an isolated
    # docker container. The docs explain the trade-off.
    user: "0:0"
    # bubblewrap (MCP capability sandbox: retrieval/booker/…) needs to create a
    # user/mount namespace inside the container; the default seccomp/apparmor profile blocks unshare(CLONE_NEW*)
    # + the default cap set has no SYS_ADMIN. Only opening these three lets bwrap stand up the isolated environment — without them
    # every sandboxed plugin fails to spawn and visitor grounding dies (F-A-1). Matches
    # docker-compose.dev.yml; bwrap itself remains the plugin's isolation boundary.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      # SYS_ADMIN: create user/mount/pid namespaces. NET_ADMIN: bwrap --unshare-net
      # brings up the sandbox's loopback (else "loopback: Failed RTM_NEWADDR"). Both
      # are needed for the capability sandbox; matches docker-compose.dev.yml.
      - SYS_ADMIN
      - NET_ADMIN
    volumes:
      - custom_pages_data:/srv/custom-pages
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandboxed MCP plugins, declared at deploy time (origin=managed) — the
      # product's real path for a self-hoster. Same class of knob as
      # INSTANCE_SECRET: deployment config, not an owner-facing install. The
      # marketplace installs skills; sandbox_stdio plugins come from here.
      # Read-only: the sandbox binds the plugin dir into the guest, and nothing
      # inside it should ever be writable from a visitor's session.
      - ./infra/prod-plugins.json:/etc/standmeet/plugins.json:ro
      - ./infra/plugins:/srv/plugins:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/internal/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  builder:
    build:
      context: ./builder
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - custom_pages_data:/srv/custom-pages

  # im-bridge —— lets someone holding an access code DM the owner's AI from a chat app.
  #
  # **This is wiring only, no settings here**: the backend address and the visitor entry point are deployment topology, the bot token is not —
  # that's a connector credential the owner configures in admin (same as mail / calendar),
  # which the bridge fetches from the internal endpoint after it starts. Credentials never go into env or compose.
  #
  # Runs long-polling: no listening port, no public callback needed — in a self-hosted setting the webhook path is out of reach for most people.
  # With no IM connector configured, the bridge just idles and waits, without spamming errors.
  im-bridge:
    build:
      context: .
      dockerfile: im-bridge/Dockerfile
    restart: unless-stopped
    environment:
      # The bridge is an **external visitor client**: Q&A goes over the visitor's public path (app),
      # only "which token should I use" goes over the internal endpoint (backend) — same shape as builder.
      - STANDMEET_BASE_URL=http://app:3000
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      app:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=standmeet
      - POSTGRES_USER=standmeet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is the sole authority: postgres applies it automatically on a fresh volume's first boot.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Binds 127.0.0.1 only: the whole database. Never exposed to the network — app reaches it by the internal service name,
      # `make prod-psql` goes through `docker compose exec` (pentest 2026-09-01).
      - "127.0.0.1:5532:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "standmeet", "-d", "standmeet"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Capped + evict the oldest once at the cap (F-R-10).
    #
    # This holds **visitor sessions, rate-limit buckets, the job pool (1-day TTL)**. Uncapped, it keeps growing,
    # until the host can't take it — and at that point it isn't "the oldest session is gone", it's **the whole container getting OOM-killed,
    # every session gone at once**, while the owner only hears "visitors can't get in".
    #
    # `allkeys-lru` rather than `noeviction`: at the cap, something has to be dropped. `noeviction` would make **writes fail**,
    # so the visitor gets an error while the owner sees nothing on their end. Sessions and rate-limit buckets are both regenerable
    # (a session just reopens, a rate-limit bucket just recounts), so dropping the oldest beats rejecting the new.
    #
    # Values go through env vars: a 1 GB small box and a 64 GB box shouldn't need to edit this file.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      # Binds 127.0.0.1 only: redis has no password set, and the key name IS the plaintext session token. Binding 0.0.0.0
      # lets an unauthenticated network connection SCAN its way to the owner's admin token → full instance takeover
      # (pentest 2026-09-01, the most severe finding of the whole run).
      - "127.0.0.1:6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # gotenberg —— headless Chromium PDF rendering sidecar for resume drafts.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Gotenberg 8's default deny-list blocks private / docker IPs (172.x, 10.x)
    # → 403 on every internal render. Empty deny + allow-anything (internal-only).
    command:
      - gotenberg
      - --chromium-disable-javascript=false
      - --chromium-deny-list=
      - --chromium-allow-list=.*
      - --api-timeout=60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # meilisearch —— the lexical index for corpus search. In the stack because the alternative
  # (Postgres FTS) cannot segment Chinese; see the MEILI_URL comment on the backend.
  #
  # No host port: the backend reaches it over the compose network, and the healthcheck runs
  # inside the container — so it cannot collide with another Meili already on the host.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-standmeet_meili_key}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # minio —— bundled S3-compatible object storage (self-contained stack).
  # Bucket "standmeet" auto-created on first backend boot via internal/storage.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9201"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-standmeet}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      # Binds 127.0.0.1 only: object storage (writing images/attachments). app reaches it internally, the published port is only for host-side debugging
      # (pentest 2026-09-01).
      - "127.0.0.1:9210:9000"
      - "127.0.0.1:9211:9201"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  meilidata: {}
  custom_pages_data: {}
