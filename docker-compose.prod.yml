# docker-compose.prod.yml —— self-host owner 一键起服务用。跟 dev compose
# 的区别：
#   1) 暴露 Caddy 在 80/443；其他服务只在内网；
#   2) backend / app / builder 镜像走 release tag（registry）而不是 host build；
#   3) sessions / pgdata / redisdata / custom_pages_data / caddy_data 都用
#      named volume，方便 backup.sh 一键备份。
#
# install.sh 把这文件拷到 owner 服务器，docker compose -f standmeet.yml up -d
# 就完事。当前先内置 dev 用的 host build；出 release 镜像后再切。

name: standmeet

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      backend:
        condition: service_healthy

  app:
    build:
      context: ./app
    restart: unless-stopped
    # Dotted alias: a single-token "app" hostname trips Chromium's HTTPS-upgrade
    # heuristic when gotenberg fetches the print URL (ERR_SSL_PROTOCOL_ERROR);
    # app.standmeet.local skips it. Mirrors dev.
    networks:
      default:
        aliases:
          - app.standmeet.local
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/instance"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgres://standmeet:${POSTGRES_PASSWORD}@db:5432/standmeet?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SESSION_KEY=${SESSION_KEY}
      # at-rest encryption key for connector secrets/tokens (≥32 chars; cryptobox
      # refuses to boot otherwise). Rotate per instance.
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      # https in real deploys; set false for a plain-http localhost bring-up.
      - SECURE_COOKIE=${SECURE_COOKIE:-true}
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-anthropic}
      - INFERENCE_ANTHROPIC_KEY=${INFERENCE_ANTHROPIC_KEY:-}
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
      - SANDBOX_DRIVER=docker
      - PUBLIC_URL=${PUBLIC_URL}
      # Object storage —— self-contained: the bundled minio service below. The
      # backend requires these at boot. STORAGE_PUBLIC_URL is the browser-facing
      # base for presigned object URLs.
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-standmeet}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-standmeet}
      - STORAGE_USE_SSL=false
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}
      - GOTENBERG_URL=http://gotenberg:3000
      - PRINT_BASE_URL=http://app.standmeet.local:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      minio:
        condition: service_healthy
    # root + docker socket: SANDBOX_DRIVER=docker runs owner skill scripts in
    # isolated containers. Mirrors dev — prod was missing these, so any skill
    # script would fail. (Security tradeoff documented; same posture as dev.)
    user: "0:0"
    volumes:
      - custom_pages_data:/srv/custom-pages
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/internal/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  builder:
    build:
      context: ./builder
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - custom_pages_data:/srv/custom-pages

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=standmeet
      - POSTGRES_USER=standmeet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is the single source of truth: postgres applies it on a
      # fresh volume's first boot (same as dev). Mirrors dev — prod was missing
      # this, so a fresh prod db had no tables and the backend couldn't boot.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "standmeet", "-d", "standmeet"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # gotenberg —— headless Chromium PDF rendering sidecar. See dev compose
  # comment for the why; same role here.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=false
      - --api-timeout=60s
      # gotenberg 8's default deny-list blocks private/docker IPs (172.x/10.x)
      # → 403 on every internal render. Allow anything (internal-only sidecar).
      # Mirrors dev — prod was missing this.
      - --chromium-deny-list=
      - --chromium-allow-list=.*
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Bundled object storage —— this is a self-contained stack, so storage ships
  # with it (no external S3 to set up). Only reachable in-network; presigned
  # object URLs are served to the browser via STORAGE_PUBLIC_URL.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9201"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-standmeet}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata: {}
  redisdata: {}
  custom_pages_data: {}
  caddy_data: {}
  caddy_config: {}
  miniodata: {}
