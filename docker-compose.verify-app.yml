# docker-compose.verify-app.yml —— 把 prod app 的后端地址指到故障代理上。
#
# 只在真实环境审计的「窄故障」那一步用（corpus-acl-editing check 6：让**某一个** admin 接口
# 加载失败，看页面说什么）。app→backend 的地址是基础设施，产品界面里没有这个旋钮，所以这一步
# 只能改 compose —— 但改的是一个**叠加文件**，prod 那份不动。
#
#   make verify-api-fault-up     起 api-fault + 用这份 override 重建 app
#   make verify-api-fault-down   撤回 prod 原样（BACKEND_URL 回到 http://backend:8000）
#
# ⚠️ 这期间 app 的**每一个**后端请求都经过代理。没装故障时它原样转发，日志里每条都有一行
# `forwarded path=… status=…` —— 那一行是用来确认「产品确实走了这条路」的：不留的话，
# 「没有流量」和「转发正常」长得一模一样。

services:
  app:
    environment:
      - BACKEND_URL=http://api-fault:9600
