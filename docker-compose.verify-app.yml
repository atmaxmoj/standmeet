# docker-compose.verify-app.yml —— points the prod app's backend address at the fault proxy.
#
# Used only for the "narrow fault" step of a real-environment audit (corpus-acl-editing
# check 6: make **one specific** admin endpoint fail to load, see what the page says).
# The app→backend address is infrastructure — the product UI has no knob for it — so this
# step can only change compose. But it changes an **overlay file**; the prod one is untouched.
#
#   make verify-api-fault-up     bring up api-fault + rebuild app with this override
#   make verify-api-fault-down   revert to prod as-is (BACKEND_URL back to http://backend:8000)
#
# Warning: during this window **every** backend request from the app goes through the proxy.
# With no fault installed it forwards unchanged, and every request logs a line
# `forwarded path=… status=…` — that line confirms "the product really took this path": without
# it, "no traffic" and "forwarding normally" look identical.

services:
  app:
    environment:
      - BACKEND_URL=http://api-fault:9600
