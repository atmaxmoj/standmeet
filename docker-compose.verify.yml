# docker-compose.verify.yml —— the **fault-injection sidecar** for the real-env audit, kept separate from prod compose.
#
# Why a separate file: docker-compose.prod.yml is the production one, and it shouldn't carry a
# service that can make calls fail. The audit needs it, production doesn't — so keep them apart
# rather than relying on "remember not to start it."
#
# It joins prod's network (external), so prod's containers can reach it by service name.
#
# ── two instances, same image, only the upstream differs ────────────────────────────────────
#
# **llm-fault** —— sits in front of the real LLM provider (agent-loop-robustness).
#   make verify-proxy-up UPSTREAM=https://api.deepseek.com
#   the owner changes the endpoint in admin's AI provider form to http://llm-fault:9500
#   —— wired through the product's own UI, no environment variable change.
#
# **api-fault** —— sits in front of this instance's own backend (the class of check like
#   corpus-acl-editing check 6: "one admin endpoint fails to load, what does the UI say").
#   This one **can't be wired through the product UI** — the app→backend address is
#   infrastructure, so it needs a prod override:
#   make verify-api-fault-up   (starts the proxy + points prod app's BACKEND_URL at it)
#   make verify-api-fault-down (reverts it)
#
# Arming a fault (on the host; both ports are mapped out):
#   curl -XPOST localhost:39500/__mock/fault/arm -d '{"mode":"ratelimit","retry_after_seconds":5}'
#   curl -XPOST localhost:39500/__mock/fault/arm -d '{"mode":"clamp_tokens","max_tokens":64}'
#   curl -XPOST localhost:39600/__mock/fault/arm -d '{"mode":"http_error","path_prefix":"/api/admin/roles"}'
#   curl -XPOST localhost:39600/__mock/fault/arm -d '{"mode":"slow","delay_ms":8000,"path_prefix":"/api/admin/stats/growth"}'
#   curl -XPOST localhost:39600/__mock/fault/reset
#
# **slow** is for the "still loading" frame. A whole family of defects lives only in that
# frame — the number hasn't arrived yet, and a sentence built from that number is already
# asserting zero (F-L-52/53). On this machine that frame is a few dozen milliseconds, too fast
# for the eye to catch; holding one GET back for a few seconds turns it into a state you can
# actually look at and screenshot.
#
# path_prefix is the line between a "narrow fault" and a "whole-stack outage": omit it and
# everything is blocked (which tests a different path, see F-N-2); give it and only that one
# thing is blocked, while the rest of the page keeps loading normally.

services:
  llm-fault:
    build:
      context: ./mock-stack
      target: fault-proxy
    environment:
      # UPSTREAM_BASE_URL —— the real provider. Without it, the proxy refuses to start (a proxy
      # with no upstream is meaningless — better to die loudly right away than fall back to a
      # silent 404).
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?set UPSTREAM_BASE_URL to the real provider base URL}
    ports:
      - "39500:9500"
    networks:
      - default
    restart: "no"

  api-fault:
    build:
      context: ./mock-stack
      target: fault-proxy
    environment:
      # The upstream is this instance's own backend. It uses the same image as llm-fault — this
      # line is the only difference.
      UPSTREAM_BASE_URL: http://backend:8000
      PORT: "9600"
    ports:
      - "39600:9600"
    networks:
      - default
    restart: "no"

  # radicale —— **a real CalDAV server** (connector-assembly check 5).
  #
  # Why not a mock: that check's Mock gap names four specific missing things — our stand-in has
  # no auth, doesn't understand the REPORT filter, doesn't expand recurrence rules, and answers
  # every property request the same way. Radicale is someone else's server, a real RFC 4791
  # implementation, and does all four. The item's Real dep says exactly this:
  # "For the CalDAV leg, **a self-run CalDAV server with auth**".
  #
  #   make verify-caldav-up      # start it; account/password below
  #   make verify-caldav-down
  #
  # Auth is htpasswd (plain): this is a one-shot server on a **test bench**, so the password is
  # right here so the next person driving this doesn't have to hunt for it elsewhere. It's not
  # mapped anywhere beyond the host.
  radicale:
    image: tomsquest/docker-radicale:3.5.7.0
    environment:
      # One user: verify / verify-caldav-pw. Plain storage is fine — this box never goes to production.
      RADICALE_CONFIG: /config/config
    volumes:
      - ./infra/verify/radicale:/config:ro
      - radicale-data:/data
    ports:
      - "35232:5232"
    networks:
      - default
    restart: "no"

volumes:
  radicale-data:

networks:
  default:
    name: standmeet-prod_default
    external: true
