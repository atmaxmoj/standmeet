# docker-compose.verify.yml —— 真实环境审计用的**故障注入侧车**，独立于 prod compose。
#
# 为什么单独一个文件：docker-compose.prod.yml 是生产用的，里面不该躺着一个能让 LLM 调用限流的
# 服务。审计要它、生产不要它，那就分开，别靠"记得不要启动"。
#
# 它加进 prod 那张网（external），所以 prod backend 用 `http://llm-fault-proxy:9500` 就能打到，
# 而 owner 在 admin 的 AI provider 表单里把 endpoint 指过来 —— 走产品自己的界面，不改环境变量。
#
#   make verify-proxy-up UPSTREAM=https://api.deepseek.com
#   make verify-proxy-down
#
# 装故障（在宿主上；9500 也映射出来了）：
#   curl -XPOST localhost:39500/__mock/llm/fail -d '{"mode":"ratelimit","retry_after_seconds":5}'
#   curl -XPOST localhost:39500/__mock/llm/fail -d '{"mode":"clamp_tokens","max_tokens":64}'
#   curl -XPOST localhost:39500/__mock/llm/reset

services:
  llm-fault-proxy:
    build:
      context: ./mock-stack
      target: llm-fault-proxy
    environment:
      # UPSTREAM_BASE_URL —— 真 provider。没给就起不来（代理没有上游就没有意义，
      # 与其静默转成 404 不如立刻死掉说清楚）。
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?set UPSTREAM_BASE_URL to the real provider base URL}
    ports:
      - "39500:9500"
    networks:
      - default
    restart: "no"

networks:
  default:
    name: standmeet-prod_default
    external: true
