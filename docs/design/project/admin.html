<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>standmeet · admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper:   'var(--paper)',
          surface: 'var(--surface)',
          ink:     'var(--ink)',
          muted:   'var(--muted)',
          faint:   'var(--faint)',
          rule:    'var(--rule)',
          accent:  'var(--accent)',
        },
        fontFamily: {
          serif: ['Newsreader', 'Georgia', 'serif'],
          mono:  ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      }
    }
  };
</script>

<style>
  :root {
    --paper:   #F3EFE6;
    --surface: #ECE6D8;
    --ink:     #1B1814;
    --muted:   #7A7167;
    --faint:   #B0A89A;
    --rule:    #DCD3BF;
    --accent:  #B5391C;
  }
  .dark {
    --paper:   #14110D;
    --surface: #1C1812;
    --ink:     #E8E2D5;
    --muted:   #837C6F;
    --faint:   #4D473D;
    --rule:    #2A251D;
    --accent:  #D14E2E;
  }

  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Newsreader', Georgia, serif;
    font-feature-settings: 'kern', 'liga', 'onum';
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .reading { font-family: 'Newsreader', Georgia, serif; line-height: 1.55; letter-spacing: -0.003em; font-weight: 380; text-wrap: pretty; }
  ::selection { background: color-mix(in oklab, var(--accent) 28%, transparent); }

  input[type="text"]:focus, input[type="email"]:focus, textarea:focus { outline: none; }

  /* tag chip */
  .chip {
    display: inline-flex; align-items: baseline; gap: 4px;
    padding: 2px 7px; border: 1px solid var(--rule);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.04em; text-transform: lowercase;
    color: var(--muted); border-radius: 2px; background: transparent;
    line-height: 1.4;
  }
  .chip.is-private { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, var(--rule)); }
  .chip.is-active { color: var(--ink); border-color: var(--ink); background: var(--ink); color: var(--paper); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border: 1px solid var(--rule);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); border-radius: 999px;
  }

  /* live indicator pulse */
  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 0%, transparent); }
  }
  .live-dot { animation: live-pulse 1.6s ease-out infinite; }

  /* terminal-style scan tick — a single horizontal line slowly travels down a panel */
  @keyframes scanline {
    0%   { transform: translateY(-100%); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(100%); opacity: 0; }
  }
  .scanline { position: relative; overflow: hidden; }
  .scanline::after {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 60%, transparent), transparent);
    animation: scanline 6s linear infinite;
    pointer-events: none;
    opacity: 0.6;
  }

  /* corner crosshairs — wraps any element with 4 small ticks at corners (tech detail) */
  .crosshair { position: relative; }
  .crosshair::before, .crosshair::after,
  .crosshair > .ch-tl, .crosshair > .ch-br {
    content: ''; position: absolute; width: 8px; height: 8px;
    border-color: var(--accent);
  }
  .crosshair::before { top: -1px; left: -1px;  border-top: 1px solid; border-left: 1px solid; }
  .crosshair::after  { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }
  .crosshair > .ch-tl{ bottom: -1px; left: -1px;  border-bottom: 1px solid; border-left: 1px solid; }
  .crosshair > .ch-br{ bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

  /* sparkline column */
  .spark-col {
    width: 5px;
    background: var(--ink);
    opacity: 0.72;
    transition: opacity .15s ease, background .15s ease;
  }
  .spark-col:hover { opacity: 1; background: var(--accent); }

  /* waveform bars (audio) */
  .wave-bar {
    width: 3px;
    background: var(--muted);
    border-radius: 1px;
    transition: background .15s ease;
  }
  .wave-bar.is-played { background: var(--accent); }

  /* dropzone — uses dashed border + cycles when dragging */
  .dropzone {
    border: 1px dashed var(--rule);
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone.is-drag {
    border-color: var(--accent);
    background: color-mix(in oklab, var(--accent) 8%, transparent);
  }
  .dropzone .corners > span {
    position: absolute; width: 10px; height: 10px;
    border-color: var(--accent); opacity: 0.7;
  }
  .dropzone .corners .c0 { top: -1px;    left: -1px;  border-top: 1px solid; border-left: 1px solid; }
  .dropzone .corners .c1 { top: -1px;    right: -1px; border-top: 1px solid; border-right: 1px solid; }
  .dropzone .corners .c2 { bottom: -1px; left: -1px;  border-bottom: 1px solid; border-left: 1px solid; }
  .dropzone .corners .c3 { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

  /* media thumb — image placeholder with crosshair corners */
  .thumb {
    width: 92px; height: 92px; flex-shrink: 0;
    background: var(--surface);
    background-image:
      linear-gradient(135deg, color-mix(in oklab, var(--accent) 14%, transparent) 0%, transparent 50%, color-mix(in oklab, var(--ink) 10%, transparent) 100%),
      repeating-linear-gradient(45deg, transparent 0 6px, color-mix(in oklab, var(--ink) 4%, transparent) 6px 7px);
    position: relative;
    border: 1px solid var(--rule);
  }
  .thumb-tag {
    position: absolute; bottom: 4px; left: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.06em;
    color: var(--paper); background: color-mix(in oklab, var(--ink) 80%, transparent);
    padding: 1px 4px; border-radius: 1px;
  }

  /* topbar ticker — slow horizontal scroll */
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker-track { display: inline-flex; gap: 28px; animation: ticker 60s linear infinite; will-change: transform; }
  .ticker-host { mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent); }
  .ticker-host:hover .ticker-track { animation-play-state: paused; }

  /* sidebar scroll */
  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }

  .link {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  }
  .link:hover { border-bottom-color: var(--accent); }

  /* modal backdrop */
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .fadein { animation: fadein .2s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .rise { animation: rise .25s cubic-bezier(.2,.7,.2,1) both; }

  /* segmented toggle */
  .seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--rule); border-radius: 4px; }
  .seg button { padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-radius: 2px; }
  .seg button.is-on { background: var(--ink); color: var(--paper); }

  textarea { resize: vertical; }
</style>

</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="page-content.js"></script>
  <script type="text/babel" data-presets="react" src="admin-data.js"></script>
  <script type="text/babel" data-presets="react" src="admin.js"></script>
</body>
</html>
