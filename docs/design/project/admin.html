<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>standmeet · admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        paper:'var(--paper)', surface:'var(--surface)', raised:'var(--raised)',
        ink:'var(--ink)', muted:'var(--muted)', faint:'var(--faint)',
        rule:'var(--rule)', accent:'var(--accent)',
        amber:'var(--amber)', violet:'var(--violet)', acid:'var(--acid)',
      },
      fontFamily: {
        serif: ['Newsreader','Georgia','serif'],
        mono:  ['"JetBrains Mono"','ui-monospace','monospace'],
      },
    }}
  };
</script>

<link rel="stylesheet" href="sm-tokens.css" />
<link rel="stylesheet" href="sm-mobile.css" />

<style>
  @keyframes sm-ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* sidebar nav */
  .nav-group { padding: 6px 0; }
  .nav-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 8px 16px 4px;
  }
  .nav-link {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 5px 16px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
  }
  .nav-link:hover { color: var(--ink); background: color-mix(in oklab, var(--surface) 50%, transparent); }
  .nav-link.active { color: var(--ink); border-left-color: var(--accent); background: var(--surface); }
  .nav-link .badge {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .nav-link.active .badge { color: var(--accent); }
  .nav-link .name { flex: 1; }

  /* card */
  .ad-card {
    border: 1px solid var(--rule);
    background: color-mix(in oklab, var(--surface) 50%, transparent);
    border-radius: 3px;
    padding: 16px 18px;
  }
  .ad-card.tight  { padding: 12px 14px; }
  .ad-card.scan { position: relative; overflow: hidden; }

  /* metric kpi */
  .kpi-num {
    font-family: 'Newsreader', serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .kpi-trend {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 6px;
  }
  .kpi-trend.up   { color: var(--accent); }
  .kpi-trend.down { color: var(--muted); }

  /* table */
  .ad-table { width: 100%; border-collapse: collapse; }
  .ad-table th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--rule);
    font-weight: 400;
  }
  .ad-table td {
    padding: 10px 6px;
    border-bottom: 1px solid color-mix(in oklab, var(--rule) 60%, transparent);
    vertical-align: top;
  }
  .ad-table tr:hover td { background: color-mix(in oklab, var(--surface) 30%, transparent); }
  .ad-table .num { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* status dot */
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-dot.live   { background: var(--accent); }
  .status-dot.draft  { background: var(--faint); }
  .status-dot.warn   { background: var(--amber); }
  .status-dot.error  { background: var(--accent); }
  .status-dot.gated  { background: var(--violet); }

  /* match meter (jobs) */
  .match-bar { height: 4px; width: 60px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .match-fill { height: 100%; background: var(--accent); }

  /* tier pill */
  .tier-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid var(--rule);
  }
  .tier-pill.public   { border-color: var(--rule); color: var(--muted); }
  .tier-pill.unlisted { border-color: color-mix(in oklab, var(--amber) 40%, var(--rule)); color: var(--amber); }
  .tier-pill.private  { border-color: color-mix(in oklab, var(--violet) 40%, var(--rule)); color: var(--violet); background: color-mix(in oklab, var(--violet) 6%, transparent); }

  /* heat bar */
  .heat-bar {
    position: relative; height: 6px; width: 100%;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 1px; overflow: hidden;
  }
  .heat-fill {
    height: 100%;
    background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 80%, transparent), var(--accent));
  }

  /* terminal-y block (for system / setup confirmations) */
  .term {
    background: color-mix(in oklab, var(--ink) 6%, var(--paper));
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--muted);
  }
  .term .ok { color: var(--accent); }
  .term .em { color: var(--ink); }
  .term .fa { color: var(--faint); }

  /* sticky save bar */
  .save-bar {
    position: sticky; top: 56px; z-index: 30;
    background: color-mix(in oklab, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
    margin: -32px -48px 28px;
    padding: 10px 48px;
    display: flex; align-items: center; justify-content: space-between;
  }

  /* demo-mode banner */
  .demo-banner {
    background: color-mix(in oklab, var(--accent) 6%, var(--surface));
    border-bottom: 1px solid color-mix(in oklab, var(--accent) 30%, var(--rule));
    padding: 6px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }

  /* preview surface — used for /now, /output, /press preview embeds */
  .preview-frame {
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 3px;
    padding: 24px;
    min-height: 240px;
  }

  /* link list */
  .ll-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid color-mix(in oklab, var(--rule) 60%, transparent); }
  .ll-row:last-child { border-bottom: 0; }

  /* slash menu (used in writing editor) */
  .slash-menu {
    position: absolute; z-index: 40;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    padding: 6px 0;
    min-width: 240px;
  }
  .slash-item {
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: baseline; gap: 10px;
  }
  .slash-item:hover, .slash-item.active { background: var(--surface); color: var(--ink); }
  .slash-item .kbd { color: var(--faint); margin-left: auto; }

  /* sentiment dot (conversations) */
  .sent { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; }
  .sent.engaged  { color: var(--accent); }
  .sent.warm     { color: var(--amber); }
  .sent.curious  { color: var(--muted); }
  .sent.short    { color: var(--faint); }
  .sent.probing  { color: var(--violet); }
  .sent.skeptical{ color: var(--muted); }
  .sent.shopping { color: var(--muted); }

  /* resume composer — collapse to single column on narrow screens */
  /* responsive */
  @media (max-width: 1024px) {
    .composer-grid { grid-template-columns: 1fr !important; }
    .composer-grid > div:last-child { display: none; } /* hide preview pane on mobile */
  }
    .save-bar { margin: -16px -16px 16px; padding: 8px 16px; }
  }
</style>

</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <script src="page-content.js"></script>
  <script type="text/babel" data-presets="react" src="sm-components.js"></script>
  <script type="text/babel" data-presets="react" src="admin-data.js"></script>
  <script type="text/babel" data-presets="react" src="admin.js"></script>
</body>
</html>
