<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>standmeet · design system</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        paper:'var(--paper)', surface:'var(--surface)', raised:'var(--raised)',
        ink:'var(--ink)', muted:'var(--muted)', faint:'var(--faint)',
        rule:'var(--rule)', accent:'var(--accent)',
        amber:'var(--amber)', violet:'var(--violet)', acid:'var(--acid)',
      },
      fontFamily: {
        serif: ['Newsreader','Georgia','serif'],
        mono:  ['"JetBrains Mono"','ui-monospace','monospace'],
      },
    }}
  };
</script>

<link rel="stylesheet" href="sm-tokens.css" />

<style>
  /* design-system-page specific layout */
  .ds-grid { display: grid; gap: 24px; }
  @keyframes sm-ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .swatch {
    height: 96px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: flex-end;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .swatch .v { color: var(--muted); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; }
  .type-row { display: grid; grid-template-columns: 200px 1fr 100px; gap: 18px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--rule); }
  .type-row .lab { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .type-row .num { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: var(--faint); text-align: right; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  .ds-panel {
    border: 1px solid var(--rule);
    padding: 20px 22px;
    background: color-mix(in oklab, var(--surface) 60%, transparent);
    border-radius: 3px;
  }
  .ds-spec {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--faint);
    letter-spacing: 0.06em;
    margin-top: 8px;
  }
  /* sidebar nav */
  .ds-nav-link {
    display: block; padding: 6px 0; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.04em;
    cursor: pointer; transition: color .15s;
  }
  .ds-nav-link:hover, .ds-nav-link.active { color: var(--ink); }
  .ds-nav-link .n { color: var(--faint); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .ds-nav-link.active .n { color: var(--accent); }
</style>

</head>
<body class="min-h-screen">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</html>
