<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sijie · standmeet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper:   'var(--paper)',
          surface: 'var(--surface)',
          ink:     'var(--ink)',
          muted:   'var(--muted)',
          faint:   'var(--faint)',
          rule:    'var(--rule)',
          accent:  'var(--accent)',
        },
        fontFamily: {
          serif: ['Newsreader', 'Georgia', 'serif'],
          mono:  ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      }
    }
  };
</script>

<style>
  :root {
    --paper:   #F3EFE6;
    --surface: #ECE6D8;
    --ink:     #1B1814;
    --muted:   #7A7167;
    --faint:   #B0A89A;
    --rule:    #DCD3BF;
    --accent:  #B5391C;
  }
  .dark {
    --paper:   #14110D;
    --surface: #1C1812;
    --ink:     #E8E2D5;
    --muted:   #837C6F;
    --faint:   #4D473D;
    --rule:    #2A251D;
    --accent:  #D14E2E;
  }

  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Newsreader', Georgia, serif;
    font-feature-settings: 'kern', 'liga', 'onum';
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* serif fine-tuning */
  .reading {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 20px;
    line-height: 1.55;
    letter-spacing: -0.003em;
    font-weight: 380;
    text-wrap: pretty;
  }
  .reading-tight { line-height: 1.45; }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-feature-settings: 'ss02';
  }

  /* selection */
  ::selection { background: color-mix(in oklab, var(--accent) 28%, transparent); }

  /* caret blink for the ask input */
  @keyframes caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .caret::after {
    content: '▍';
    margin-left: 1px;
    color: var(--accent);
    animation: caret 1.1s steps(1) infinite;
    font-size: .85em;
    position: relative;
    top: -1px;
  }

  /* thinking dots */
  @keyframes dot { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-2px)} }
  .dot { display:inline-block; animation: dot 1.2s ease-in-out infinite; }
  .dot:nth-child(2){ animation-delay:.15s }
  .dot:nth-child(3){ animation-delay:.3s }

  /* paragraph reveal */
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .rise { animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards; }

  /* live indicator pulse */
  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 0%, transparent); }
  }
  .live-dot { animation: live-pulse 1.6s ease-out infinite; }

  /* sticky input dock: paper bg + soft fade so conversation reads through */
  .input-dock {
    background: linear-gradient(to bottom,
      color-mix(in oklab, var(--paper) 0%, transparent) 0,
      color-mix(in oklab, var(--paper) 70%, transparent) 18%,
      var(--paper) 38%,
      var(--paper) 100%
    );
  }

  /* sidebar scroll */
  .sidebar-scroll { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .sidebar-scroll::-webkit-scrollbar { width: 6px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }

  /* clickable inline question fragments inside bio */
  .askable {
    color: var(--ink);
    background-image: linear-gradient(to right, var(--accent) 0%, var(--accent) 100%);
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 100% 1px;
    transition: background-size .2s ease, color .2s ease;
    cursor: pointer;
    padding: 0 1px;
  }
  .askable:hover {
    background-size: 100% 100%;
    color: var(--paper);
  }

  /* link styling */
  .link {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
    transition: border-color .15s ease;
  }
  .link:hover { border-bottom-color: var(--accent); }

  /* horizontal rule */
  .rule { border: 0; height: 1px; background: var(--rule); }
  .rule-soft { background: color-mix(in oklab, var(--rule) 60%, transparent); }

  /* small caps label */
  .smallcaps {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* hide native input chrome */
  input[type="text"]:focus { outline: none; }

  /* tweaks panel forced contrast tweaks */
  .twk-panel { color-scheme: light; }
</style>

<script type="application/json" id="standmeet-config">
  { "owner": "sijie" }
</script>

</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="page-content.js"></script>
  <script type="text/babel" data-presets="react" src="tweaks-panel.js"></script>
  <script type="text/babel" data-presets="react" src="corpus.js"></script>
  <script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
