<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>standmeet · sign in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        paper: 'var(--paper)', surface: 'var(--surface)',
        ink: 'var(--ink)', muted: 'var(--muted)',
        faint: 'var(--faint)', rule: 'var(--rule)',
        accent: 'var(--accent)',
      },
      fontFamily: {
        serif: ['Newsreader', 'Georgia', 'serif'],
        mono:  ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
      },
    }}
  };
</script>

<style>
  :root {
    --paper:   #F3EFE6;
    --surface: #ECE6D8;
    --ink:     #1B1814;
    --muted:   #7A7167;
    --faint:   #B0A89A;
    --rule:    #DCD3BF;
    --accent:  #B5391C;
  }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Newsreader', Georgia, serif;
    font-feature-settings: 'kern','liga','onum';
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .reading { font-family: 'Newsreader', Georgia, serif; line-height: 1.55; font-weight: 380; }
  ::selection { background: color-mix(in oklab, var(--accent) 28%, transparent); }
  input:focus, textarea:focus { outline: none; }

  /* terminal-vibe deploy panel */
  @keyframes blink { 50% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes scanline {
    0%   { transform: translateY(-100%); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(100%); opacity: 0; }
  }
  .scanline { position: relative; overflow: hidden; }
  .scanline::after {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 60%, transparent), transparent);
    animation: scanline 7s linear infinite; pointer-events: none; opacity: 0.5;
  }
  .crosshair { position: relative; }
  .crosshair::before, .crosshair::after,
  .crosshair > .ch-tl, .crosshair > .ch-br {
    content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--accent);
  }
  .crosshair::before { top: -1px; left: -1px;  border-top: 1px solid; border-left: 1px solid; }
  .crosshair::after  { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }
  .crosshair > .ch-tl{ bottom: -1px; left: -1px;  border-bottom: 1px solid; border-left: 1px solid; }
  .crosshair > .ch-br{ bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .fadein { animation: fadein .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .rise { animation: rise .4s cubic-bezier(.2,.7,.2,1) both; }

  /* live indicator */
  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 0%, transparent); }
  }
  .live-dot { animation: live-pulse 1.6s ease-out infinite; }

  /* segmented mode toggle */
  .seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--rule); border-radius: 4px; }
  .seg button { padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-radius: 2px; }
  .seg button.is-on { background: var(--ink); color: var(--paper); }

  .link {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  }
  .link:hover { border-bottom-color: var(--accent); }
</style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react" src="auth.js"></script>
</body>
</html>
