<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>output · standmeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode:'class', theme: { extend: {
    colors: { paper:'var(--paper)', surface:'var(--surface)', raised:'var(--raised)', ink:'var(--ink)', muted:'var(--muted)', faint:'var(--faint)', rule:'var(--rule)', accent:'var(--accent)', amber:'var(--amber)', violet:'var(--violet)', acid:'var(--acid)' },
    fontFamily: { serif: ['Newsreader','Georgia','serif'], mono: ['"JetBrains Mono"','ui-monospace','monospace'] },
  }}};
</script>
<link rel="stylesheet" href="sm-tokens.css" />
<link rel="stylesheet" href="sm-mobile.css" />

<style>
  .o-hero {
    aspect-ratio: 21 / 9;
    border: 1px solid var(--rule);
    position: relative; overflow: hidden;
    container-type: inline-size;
  }
  .o-hero .h { position: absolute; top: 14%; left: 6%; font-family:'Newsreader',serif; font-weight: 400; font-size: clamp(36px, 9cqi, 100px); line-height: 0.94; letter-spacing: -0.025em; max-width: 80%; }
  .o-hero .s { position: absolute; bottom: 14%; right: 6%; font-family:'Newsreader',serif; font-style: italic; font-weight: 380; font-size: clamp(20px, 5cqi, 44px); color: var(--muted); max-width: 60%; text-align: right; }
  .o-hero .tag { position: absolute; top: 14px; left: 14px; font-family:'JetBrains Mono',monospace; font-size: clamp(8px, 1.4cqi, 12px); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .o-hero .meta { position: absolute; top: 14px; right: 14px; font-family:'JetBrains Mono',monospace; font-size: clamp(8px, 1.4cqi, 12px); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .o-hero .no { position: absolute; bottom: 14px; left: 14px; font-family:'JetBrains Mono',monospace; font-size: clamp(8px, 1.2cqi, 11px); letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .o-hero.hue-amber  { background: radial-gradient(ellipse 60% 80% at 80% 20%, color-mix(in oklab, var(--amber) 36%, transparent), transparent 70%), radial-gradient(ellipse 50% 70% at 10% 100%, color-mix(in oklab, var(--amber) 18%, transparent), transparent 70%), var(--surface); }
  .o-hero.hue-violet { background: radial-gradient(ellipse 60% 80% at 80% 20%, color-mix(in oklab, var(--violet) 26%, transparent), transparent 70%), radial-gradient(ellipse 50% 70% at 10% 100%, color-mix(in oklab, var(--violet) 14%, transparent), transparent 70%), var(--surface); }
  .o-hero.hue-acid   { background: radial-gradient(ellipse 60% 80% at 80% 20%, color-mix(in oklab, var(--acid) 30%, transparent), transparent 70%), radial-gradient(ellipse 50% 70% at 10% 100%, color-mix(in oklab, var(--acid) 14%, transparent), transparent 70%), var(--surface); }

  .o-body p { font-size: 21px; line-height: 1.65; margin-bottom: 1.4em; }
  .o-body h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.012em; margin: 2.2em 0 0.5em; }
  .o-body blockquote {
    font-style: italic; font-size: 26px; line-height: 1.4;
    letter-spacing: -0.008em; color: var(--ink);
    margin: 2.2em -24px; padding: 4px 24px; border-left: 3px solid var(--accent);
  }

  /* PDF preview card · 8.5×11-ish */
  .pdf-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 24px 60px rgba(0,0,0,0.10), 0 1px 0 var(--rule);
    aspect-ratio: 8.5 / 11;
    width: 100%; max-width: 320px;
    margin: 0 auto;
    padding: 24px 20px 16px;
    position: relative;
    font-size: 8px; line-height: 1.4;
    color: var(--ink);
    font-family: 'Newsreader', serif;
  }
  .pdf-card .ph { font-size: 14px; font-weight: 500; letter-spacing: -0.012em; }
  .pdf-card .pk { font-family:'JetBrains Mono',monospace; font-size: 7.5px; letter-spacing: 0.08em; color: var(--muted); }
  .pdf-card .pn { position: absolute; bottom: 8px; right: 14px; font-family:'JetBrains Mono',monospace; font-size: 7px; color: var(--faint); }
  .pdf-card hr { border: 0; height: 1px; background: var(--rule); margin: 10px 0 12px; }

  /* tier pill (mirrors admin's) */
  .tier-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 2px; border: 1px solid var(--rule);
  }
  .tier-pill.public   { color: var(--muted); }
  .tier-pill.unlisted { border-color: color-mix(in oklab, var(--amber) 40%, var(--rule)); color: var(--amber); }
  .tier-pill.private  { border-color: color-mix(in oklab, var(--violet) 40%, var(--rule)); color: var(--violet); background: color-mix(in oklab, var(--violet) 6%, transparent); }

  /* gated overlay */
  .lock-overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(45deg, transparent 0 6px, color-mix(in oklab, var(--ink) 8%, transparent) 6px 7px),
      color-mix(in oklab, var(--paper) 80%, transparent);
  }
</style>
</head>
<body class="min-h-screen">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="visitor-data.js"></script>
<script src="sm-session.js"></script>
<script type="text/babel" data-presets="react" src="sm-components.js"></script>
<script type="text/babel" data-presets="react" src="output.js"></script>
</body>
</html>
