# docker-compose.coolify.yml —— runs one StandMeet instance on Coolify.
#
# **Just paste this straight into Coolify's "Docker Compose Empty"** (New Resource → Docker
# Based → Docker Compose Empty). No git source needed: there is not a single host mount ——
# the schema is baked into the db image, and all five images are pulled from ghcr.
#
# Which two domains to configure, whether to turn the sandbox on, and how to verify it's up
# once running —— see "Deploying on Coolify" in the README. This file only explains "why this
# line is shaped the way it is."
#
# Warning: this template has not been run on a real Coolify instance. Everything else in this
# repo has been measured, driven, and has a receipt; this one doesn't. Once it's up, check it
# against the README's four checks one by one, especially the first (were the tables created)
# —— it fails silently.
#
# Three differences from docker-compose.prod.yml: no build, only pulls images (the app image
# COPYs a .next that was already built on the host — it can't be built from git); no host
# ports published (Coolify's reverse proxy takes over by domain); domains and passwords go
# through Coolify's magic variables.

name: standmeet

services:
  app:
    # All four tags are already published on ghcr (v0.0.2 + latest). Re-publish yourself with
    # `make release-push` —— it runs two secret gates first (history + image filesystem), and
    # only pushes once both pass; the tag is derived from `git describe`.
    #
    # **Don't use v0.0.1**: that tag only has the backend image (pushed while testing
    # credentials); the other three images don't exist.
    image: ghcr.io/atmaxmoj/standmeet-app:v0.1.3
    restart: unless-stopped
    environment:
      # Coolify sees this name and assigns a domain to app's port 3000, wiring up the reverse
      # proxy. The generated value (https://…) gets referenced elsewhere besides
      # STORAGE_PUBLIC_URL.
      - SERVICE_FQDN_APP_3000
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    # Warning: **do not declare `networks` here again.** That is the cause of a 504 that kept
    # recurring.
    #
    # Coolify injects a project network into every service (`<serviceUuid>`, external). This
    # file originally also had a `default:` block (only to give app a dotted alias,
    # `app.standmeet.local`), which made **app the only container in the whole stack attached
    # to two networks**. When a container is on multiple networks, traefik has to pick one to
    # resolve its IP from, and this compose file has no `traefik.docker.network` label ——
    # it picked `default` (traefik isn't even on that network), the SYN goes out unanswered,
    # and after hanging for 30 seconds it becomes a **504** (a refused connection would come
    # back as a 502 within seconds instead).
    #
    # Every deploy rebuilds the container and reassigns its IP = rolling the dice again. So it
    # showed up as "sometimes broken after a deploy, redeploying fixes it" — but **redeploying
    # isn't a fix, it's just another roll**. Every observation lines up: only this one project
    # was broken (only it had the second network), 6/6 checks failed with no flicker, and the
    # app container itself reported `running:healthy` (127.0.0.1:3000 inside the container
    # stayed reachable the whole time).
    #
    # That alias **was never actually working** to begin with: it was registered on `default`,
    # while gotenberg is only on the project network, so it could never be resolved anyway ——
    # meaning PDF printing in prod had been broken all along, and the alias only contributed
    # the extra network that made traefik pick wrong. (In `docker-compose.prod.yml` it's
    # correct: every service there shares the same implicit default network.)
    #
    # The trade-off, spelled out: the single-label hostname `app` triggers Chromium's HTTPS
    # upgrade heuristic, and gotenberg fetching the print page may get ERR_SSL_PROTOCOL_ERROR.
    # If you actually hit that, the fix is to add an alias on the **project network** and set
    # `traefik.docker.network=<project-network-name>` —— both need the generated name that's
    # different per instance, so the template can't supply it; fill it in on your own instance.
    # Reachability of the whole site takes priority over the PDF path.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Hits app's **own** route, not the one proxied through to backend's
      # `/api/v1/instance` —— that would measure two hops, and a slow backend would then get
      # an otherwise-healthy app marked unhealthy, and the orchestrator would restart it. Bad
      # news propagates; good news doesn't propagate back.
      #
      # Warning: this route (app/src/app/api/app-health/route.ts) was **written but not yet
      # verified** in this round: it needs the app image rebuilt to take effect, and the
      # machine's load was at 50 and couldn't run it at the time. Confirm it's in the image
      # before relying on it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/app-health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    image: ghcr.io/atmaxmoj/standmeet-backend:v0.1.3
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgres://standmeet:${SERVICE_PASSWORD_POSTGRES}@db:5432/standmeet?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SESSION_KEY=${SERVICE_PASSWORD_64_SESSION}
      # INSTANCE_SECRET —— the static encryption key for connector credentials/tokens (≥32
      # characters, or cryptobox refuses to start).
      #
      # Warning: **changing it makes every existing credential undecryptable**. This was
      # actually rotated once in prod: the backend started up fine, but /admin/connectors
      # rendered every card as "not connected" with a row of empty boxes —— the ciphertext and
      # connected_at were both still in the DB, but nothing showed on screen (F-C-41). Use the
      # one Coolify generates, and **don't touch it once generated**.
      - INSTANCE_SECRET=${SERVICE_PASSWORD_64_INSTANCE}
      # Coolify terminates TLS, so the cookie must carry Secure.
      - SECURE_COOKIE=true
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
      - GOTENBERG_URL=http://gotenberg:3000
      # The address gotenberg uses to fetch the print page. **Single-label hostname**: a
      # dotted alias needs the second network, and that's exactly the cause of the 504 (see
      # the note on the app service).
      - PRINT_BASE_URL=http://app:3000
      # ── Storage ──────────────────────────────────────────────────────────────────
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=standmeet
      - STORAGE_SECRET_KEY=${SERVICE_PASSWORD_64_MINIO}
      - STORAGE_BUCKET=standmeet
      - STORAGE_USE_SSL=false
      # STORAGE_PUBLIC_URL —— the address the **browser** uses to fetch images, not the
      # address inside the container network. Signed URLs are sent to the visitor's browser,
      # and a URL pointing at minio:9000 wouldn't resolve there. So minio needs its own domain
      # (see the block below).
      #
      # Warning: use `SERVICE_URL_*`, not `SERVICE_FQDN_*`: Coolify's convention is
      # **FQDN has no scheme, URL does**. Written as FQDN, this would resolve to `host:9000`,
      # and the backend runs `url.Parse(...).Host` on it —— with no scheme, Go returns an
      # empty hostname **and no error**, so the whole instance crashes on a line that points
      # at `STORAGE_ENDPOINT`, even though that variable is actually correct (F-S-1). The
      # backend now rejects this outright and names the actual line, but better not to let it
      # get there.
      - STORAGE_PUBLIC_URL=${SERVICE_URL_MINIO_9000}
      # ── everything below is left empty as the default posture; fill in as needed ──────
      # CAPTCHA: only turns on once both are filled in.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      # Meilisearch: the lexical index for corpus search, now **shipped with the stack**
      # (service is below).
      #
      # It wasn't there before, and the fallback was Postgres full-text search. Measured in
      # prod: that fallback **can't handle Chinese** —— `to_tsvector('english', …)` never
      # tokenizes Chinese, so a query only hits when it's byte-for-byte equal to a contiguous
      # run of Chinese in the body. "无限衍义" (unlimited derivation) could be found, "限衍"
      # and "三个序列" (three sequences) both got 0 hits, and "三张资格证" (three
      # certificates) couldn't even find the post that had those exact five characters in the
      # title (the body had "与三张资格证" — "and three certificates" — instead). English
      # was unaffected —— so from one side the bilingual corpus looked completely normal, and
      # that's exactly how this hole stayed hidden.
      #
      # An empty index is worse than the fallback, so this only holds because the backend
      # **auto-backfills on boot** (wire.SearchIndex → ReindexOwner), with a periodic
      # reconcile to fill in the rest. Just mount it and restart — that's the whole migration.
      # To use a Meili outside the stack, fill in the two variables below and the service
      # further down can be deleted.
      - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
      - MEILI_KEY=${MEILI_KEY:-${SERVICE_PASSWORD_MEILI}}
      # SSRF allowlist: **empty is the production posture**, it blocks every internal-network
      # address.
      - EGRESS_ALLOW_HOSTS=${EGRESS_ALLOW_HOSTS:-}
      # The connector outbound allowlist (two separate policies from the one above: that one
      # governs what the backend itself dials out to, this one governs what the assembled
      # connectors can reach). Fill this in when the owner needs to reach their own internal
      # CalDAV / mail server.
      - CONNECTOR_EGRESS_ALLOW=${CONNECTOR_EGRESS_ALLOW:-}
      # The byte cap for one OpenAPI spec (default 2 MiB). GitHub's REST description is a
      # 12 MB file, so connecting to that kind of vendor needs this raised.
      - CONNECTOR_SPEC_MAX_BYTES=${CONNECTOR_SPEC_MAX_BYTES:-}
      # Which repo the skill marketplace reads from; empty = the public anthropics/skills.
      - MARKETPLACE_GITHUB_BASE_URL=${MARKETPLACE_GITHUB_BASE_URL:-}
      # Who the upgrade button on /admin/system calls. This instance has no host-level control
      # (docker.sock is deliberately not mounted below), so it can't pull images or rebuild
      # containers itself —— only Coolify can do that. Open a deploy webhook for this service
      # in Coolify and put that URL here, and the button actually works. Leaving it empty is
      # also fine: the button will honestly say it can't do it, and tell the owner how to
      # upgrade instead.
      - STANDMEET_REDEPLOY_HOOK=${STANDMEET_REDEPLOY_HOOK:-}
      # Where to ask "is there a new version." Empty = the official image registry.
      - STANDMEET_RELEASE_REGISTRY=${STANDMEET_RELEASE_REGISTRY:-}
      - STANDMEET_RELEASE_REPO=${STANDMEET_RELEASE_REPO:-}
      # ── Third-party sandboxed plugins (origin=managed): off by default, needs the host's
      # manifest + docker.sock mounted. The five built-in ones (retrieval / ask_visitor /
      # summarize / booker / mail-sender) **do not go through here** —— they're baked into
      # the image's /srv/plugins and run via the bwrap permissions granted below. Two
      # different things — don't conflate them.
      # - STANDMEET_PLUGINS=/etc/standmeet/plugins.json
      # - SANDBOX_DRIVER=docker
    # ── The bwrap sandbox for the built-in capabilities needs these lines; skip even one
    # and visitors get no answer at all ──────────────────────
    #
    # This used to be empty, and that wasn't "one setting short" — it **turned the product
    # off**: all five built-in capabilities go through `sandbox_stdio`, where the main process
    # starts an isolated environment with bwrap before spawning the plugin. The container's
    # default seccomp/apparmor profile blocks unshare(CLONE_NEW*), and the default cap set
    # has no SYS_ADMIN either, so bwrap can't start a single one —— and the failure is a
    # **silent degradation**: the failed dial folds into ErrHidden, chat isn't blocked, and
    # the turn just goes to the model with 0 tools (F-A-1).
    #
    # What it actually looked like in prod (sijie.xyz, 2026-08-27): the prompt fragments for
    # all three capabilities came back 0 bytes each (the same endpoints in dev return
    # 2002 / 1280 / 1558), the model had no tool schema at all, and so it followed the system
    # prompt's prose and **wrote the tool call as plain-text XML instead**:
    #   `<tool_calls><invoke name="search">…` —— even the tool name was made up (the real one
    # is corpus_search) —— and the backend returned `stop_reason=end_turn`, so the product
    # published that raw protocol text to the visitor as if it were the finished answer.
    #
    # I had originally made these lines an "optional, off by default" comment block. That
    # default was one I invented myself, and it left an instance that was **installed, running,
    # every health check green** unable to answer a single visitor
    # ([[invented-default-grants-privilege]]).
    #
    # Warning: the trade-off, stated plainly: seccomp/apparmor loosened + SYS_ADMIN — this
    # container's isolation is much weaker than the default.
    #    **But docker.sock is not mounted** —— that's the half that turns a container into
    #    the host's administrator, and the built-in capabilities don't need it (the plugin
    #    binaries are baked into the image). On a shared host this is the line that must hold.
    user: "0:0"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      # SYS_ADMIN: creates the user/mount/pid namespaces. NET_ADMIN: bwrap --unshare-net needs
      # this to bring up loopback inside the sandbox (otherwise "loopback: Failed RTM_NEWADDR").
      - SYS_ADMIN
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      # meilisearch —— deliberately **not** service_healthy: the backend starts fine without
      # it (search falls back to Postgres full-text, and honestly says it's degraded on
      # /admin/system). Waiting on it would turn an optional index into a reason the instance
      # can't come up.
      meilisearch:
        condition: service_started
    volumes:
      - custom_pages_data:/srv/custom-pages
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/internal/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # builder —— builds the React pages the owner writes themselves; output lands in
  # custom_pages_data.
  builder:
    image: ghcr.io/atmaxmoj/standmeet-builder:v0.1.3
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - CUSTOM_PAGES_ROOT=/srv/custom-pages
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - custom_pages_data:/srv/custom-pages

  # im-bridge —— lets someone holding an access code DM the owner's AI from a chat app.
  #
  # **This is wiring only, no settings**: the bot token is a credential the owner configures
  # in /admin/connectors (same category as mail / calendar), and the bridge fetches it from an
  # internal endpoint once it starts. The credential never goes into env, or into this file.
  # With no IM connector configured it just idles, without spamming errors.
  #
  # Uses long polling: listens on no port, needs no public inbound callback —— in a
  # self-hosted setup, most people can't do the webhook path.
  im-bridge:
    image: ghcr.io/atmaxmoj/standmeet-im-bridge:v0.1.3
    restart: unless-stopped
    environment:
      - STANDMEET_BASE_URL=http://app:3000
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      app:
        condition: service_started

  # db —— pgvector, with the schema already baked into the image (infra/db/Dockerfile).
  #
  # No need to mount `./backend/db/schema.sql`: a paste-in compose file has no repo, so that
  # mount would resolve empty, and postgres mounting something empty behaves as **silently
  # starting an empty database**, with no error —— and then every backend query blows up.
  #
  # Warning: the schema only runs **the first time the data volume is created**. Upgrades
  # don't go through here, they go through `backend/db/migrations/`: swapping in a newer db
  # image **will not** modify an existing database.
  db:
    image: ghcr.io/atmaxmoj/standmeet-db:v0.1.3
    restart: unless-stopped
    environment:
      - POSTGRES_DB=standmeet
      - POSTGRES_USER=standmeet
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "standmeet", "-d", "standmeet"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Capped + evicts the oldest once full. This holds visitor sessions, rate-limit buckets,
    # and the job pool (1-day TTL). Uncapped, it keeps growing until the host can't take it ——
    # and at that point it's not "the oldest session is gone," it's **the whole container
    # getting OOM-killed, every session gone at once**, and all the owner hears is "visitors
    # can't open the page."
    #
    # `allkeys-lru`, not `noeviction`: once full, something has to be dropped. `noeviction`
    # would make **writes fail** instead, and the visitor gets an error while the owner sees
    # nothing at all. Sessions and rate-limit buckets are both fine to lose and regenerate.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # meilisearch —— the lexical index for corpus search. It's in the stack because the
  # fallback (Postgres full-text) can't tokenize Chinese, see the MEILI_URL note above.
  #
  # No host port mapped: backend reaches it over the compose network, and the healthcheck runs
  # inside the container —— so it won't collide with another project's Meili already running
  # on the host (there is one on this machine).
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # gotenberg —— the headless Chromium rendering sidecar for resume PDFs.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Gotenberg 8's default deny-list blocks private / docker network ranges (172.x, 10.x) →
    # internal rendering would all 403. Clear the deny list and open up the allow list (this
    # port only exists on the container network).
    command:
      - gotenberg
      - --chromium-disable-javascript=false
      - --chromium-deny-list=
      - --chromium-allow-list=.*
      - --api-timeout=60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # minio —— the bundled S3-compatible object storage. The "standmeet" bucket is auto-created
  # by the backend on first boot.
  #
  # **It needs its own domain**: images the owner uploads are handed to the visitor's browser
  # as signed URLs, and that address has to be a publicly resolvable one, not `minio:9000`.
  # Configure a dedicated subdomain for this one in Coolify (e.g. files.your-domain).
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9201"
    environment:
      - SERVICE_FQDN_MINIO_9000
      - MINIO_ROOT_USER=standmeet
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MINIO}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  meilidata: {}
  custom_pages_data: {}

# ── Third-party sandboxed plugins (origin=managed) —— optional, off by default ──────────────
#
# **This section is not about the built-in capabilities.** The five built-in ones
# (retrieval / ask_visitor / summarize / booker / mail-sender) are baked into the image and
# run on the bwrap permissions granted to backend above; without them visitors can't get an
# answer at all —— that's not optional. This section is about third-party MCP servers the
# owner installs themselves.
#
# Add to backend:
#
#     environment:
#       - STANDMEET_PLUGINS=/etc/standmeet/plugins.json
#       - SANDBOX_DRIVER=docker
#     volumes:
#       - /var/run/docker.sock:/var/run/docker.sock
#       - ./infra/prod-plugins.json:/etc/standmeet/plugins.json:ro
#
# Warning: `docker.sock` makes this container **the host's administrator**, not just "a bit
#    more permission." Only mount it on a dedicated host. The reasoning, and the real incident
#    behind it, is written up in the README.
