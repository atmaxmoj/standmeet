# docker-compose.yml —— one StandMeet instance from prebuilt images, on any Docker host or PaaS
# (Coolify, Portainer, Dokploy, or plain `docker compose up`).
#
# This file carries wiring and the secrets the platform generates — never the owner's settings.
# Captcha, internal hosts, the skill catalogue, suppliers, providers: all set in the app, at
# /admin. Why each line is what it is, and the incidents behind them: docs/deploy.md.
#
# Variables: `${SERVICE_FQDN_*}` / `${SERVICE_PASSWORD_*}` / `${SERVICE_URL_*}` are Coolify's
# magic variables (it generates the secrets and assigns the domain). On any other host,
# `infra/scripts/install.sh` writes a `.env` with the same names and layers compose.caddy.yml
# (bundled TLS) or compose.port.yml (a host port for your own proxy) on top.

name: standmeet

services:
  app:
    # `latest` moves on every release; pin STANDMEET_IMAGE_TAG=vX.Y.Z to stay on one version.
    image: ghcr.io/atmaxmoj/standmeet-app:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000 # Coolify: assigns the domain and routes it to port 3000
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
      - STANDMEET_SERVICE_NAME=app
    # Do not declare `networks` here: a second network makes the proxy pick the wrong one (504).
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/app-health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    image: ghcr.io/atmaxmoj/standmeet-backend:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - STANDMEET_SERVICE_NAME=backend
      - STANDMEET_SELFSTAT_PEERS=http://app:3000/api/selfstat
      - DATABASE_URL=postgres://standmeet:${SERVICE_PASSWORD_POSTGRES}@db:5432/standmeet?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SESSION_KEY=${SERVICE_PASSWORD_64_SESSION}
      # Encrypts stored credentials. Never change it once generated: every stored credential
      # becomes unreadable.
      - INSTANCE_SECRET=${SERVICE_PASSWORD_64_INSTANCE}
      # Where gotenberg loads the print page: the instance's own public https URL.
      - PRINT_BASE_URL=${SERVICE_URL_APP}
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=standmeet
      - STORAGE_SECRET_KEY=${SERVICE_PASSWORD_64_MINIO}
      - STORAGE_BUCKET=standmeet
      - STORAGE_USE_SSL=false
      # The bundled search index; point both elsewhere to use your own Meilisearch.
      - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
      - MEILI_KEY=${MEILI_KEY:-${SERVICE_PASSWORD_MEILI}}
      # The upgrade button writes here; the updater sidecar reads it.
      - STANDMEET_UPGRADE_SIGNAL=/run/standmeet/upgrade.signal
    # The built-in capabilities run in a bwrap sandbox, which needs these. Without them visitors
    # get no answers at all. docker.sock is NOT mounted — the line that must hold on a shared host.
    user: "0:0"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN # user/mount/pid namespaces
      - NET_ADMIN # loopback inside the sandbox
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      meilisearch:
        condition: service_started # optional: search falls back to Postgres without it
    volumes:
      - microsites_data:/srv/microsites
      - upgrade_signal:/run/standmeet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/internal/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # builder —— builds the React pages the owner writes; output lands in microsites_data.
  builder:
    image: ghcr.io/atmaxmoj/standmeet-builder:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - microsites_data:/srv/microsites

  # im-bridge —— visitors with an access code chat from Telegram / Discord. Bot tokens are set on
  # /admin/suppliers; with none connected it idles.
  im-bridge:
    image: ghcr.io/atmaxmoj/standmeet-im-bridge:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - STANDMEET_BASE_URL=http://app:3000
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      app:
        condition: service_started

  # updater —— the one container with docker access: on the upgrade button it recreates this
  # stack's containers in place on the new images (same config, volumes, env).
  updater:
    image: ghcr.io/atmaxmoj/standmeet-updater:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - STANDMEET_UPGRADE_SIGNAL=/run/standmeet/upgrade.signal
      # A fork publishing its own images overrides the prefix.
      - STANDMEET_IMAGE_PREFIX=${STANDMEET_IMAGE_PREFIX:-ghcr.io/atmaxmoj/standmeet-}
      - STANDMEET_CHANNEL=${STANDMEET_CHANNEL:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - upgrade_signal:/run/standmeet

  # db —— pgvector with the schema baked in. It runs once, on a new volume; upgrades go through
  # the backend's migrations at boot.
  db:
    image: ghcr.io/atmaxmoj/standmeet-db:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - POSTGRES_DB=standmeet
      - POSTGRES_USER=standmeet
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "standmeet", "-d", "standmeet"]
      interval: 3s
      timeout: 3s
      retries: 10

  # redis —— capped, evicts the oldest when full (sessions and rate-limit buckets regenerate).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # meilisearch —— the corpus search index (Postgres full text cannot tokenize Chinese).
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # gotenberg —— renders résumé PDFs. Its default deny-list blocks the docker network.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=false
      - --chromium-deny-list=
      - --chromium-allow-list=.*
      - --api-timeout=60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # stt —— voice input: speech-to-text on this server (SenseVoice, CPU, ~400 MB RAM). Audio never
  # leaves the instance. Internal only. Optional: without it the chat simply offers no mic.
  stt:
    image: ghcr.io/atmaxmoj/standmeet-stt:${STANDMEET_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # minio —— bundled S3 storage, internal only (the backend serves uploads). Do not give it a
  # public domain. Silo is the maintained drop-in fork of MinIO.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9201"
    environment:
      - MINIO_ROOT_USER=standmeet
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MINIO}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  meilidata: {}
  microsites_data: {}
  upgrade_signal: {} # backend writes the upgrade signal, the updater reads it

# Third-party sandboxed MCP servers (optional): see docs/deploy.md. They need docker.sock on the
# backend, which makes it the host's administrator — only on a dedicated host.
