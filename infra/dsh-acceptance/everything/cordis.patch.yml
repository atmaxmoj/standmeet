# everything block — its mountable declaration for a dsh bundle. The MCP reference 'everything' demo
# server is bridged onto dsh through @deepseek-ai/dsh-mcp-client: the patch inserts one mcp-client row
# that runs the installed server over stdio; its tools register on ctx.tools as `mcp__everything__<raw>`.
- insert:
    - id: everything
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: everything
        command: node
        args:
          - dist/index.js
          - stdio
        # The server's installed directory: Node resolves this package from the running profile's
        # manifest, then the server from this package, so any profile name and pnpm layout works.
        cwd: !!js "process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').dir + '/package.json').resolve('standmeet-everything-mcp/package.json')).resolve('@modelcontextprotocol/server-everything/package.json'))"
        failOnStartupError: true
