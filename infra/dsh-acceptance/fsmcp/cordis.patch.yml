# fsmcp block — its mountable declaration for a dsh bundle. The third-party filesystem MCP server is
# bridged onto dsh through @deepseek-ai/dsh-mcp-client: the patch inserts one mcp-client row that runs
# the installed server; its tools register on ctx.tools as `mcp__fsmcp__<rawName>`. cwd = the installed
# dependency dir, and it doubles as the server's single allowed directory (args: ['dist/index.js', '.']).
- insert:
    - id: fsmcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: fsmcp
        command: node
        args:
          - dist/index.js
          - .
        # The server's installed directory: Node resolves this package from the running profile's
        # manifest, then the server from this package, so any profile name and pnpm layout works.
        cwd: !!js "process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').dir + '/package.json').resolve('standmeet-fsmcp-mcp/package.json')).resolve('@modelcontextprotocol/server-filesystem/package.json'))"
        failOnStartupError: true
