# mail-sender block — its mountable declaration for a dsh bundle. A JS stdio-MCP server bridged onto
# dsh through @deepseek-ai/dsh-mcp-client: the patch inserts one mcp-client row that runs the server
# with node; its tool registers on ctx.tools as `mcp__mail-sender__send_email`. Cross-platform (JS,
# no per-arch binary). The tool reaches the host over STANDMEET_HOST_SOCKET only at CALL time, so it
# boots and lists tools on a bare DSH with no socket present.
- insert:
    - id: mail-sender
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: mail-sender
        command: node
        args:
          - mail-sender-mcp.js
        # This package's installed directory, resolved by Node from the running profile's manifest,
        # so the bundle works in a profile of any name.
        cwd: !!js "process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').dir + '/package.json').resolve('standmeet-mail-sender-mcp/package.json'))"
        failOnStartupError: true
