# lefthook is this monorepo's git hook manager (following the same setup as Otium auth).
# After clone / after changing the HOOKS below, run `lefthook install` once to wire them into
# .git/hooks/ (changing a command's `run` needs no reinstall; adding/removing a hook type does).
#
# Two gates, by cost:
#
#   pre-commit — PARTITIONED BY SUBPROJECT (one glob-gated block per container: backend / app / sdk /
#     e2e / im-bridge). A block runs only when this commit touches that subproject, so a commit pays
#     only for what it changed (change e2e specs → only e2e-lint). secrets + env-lint are cross-cutting
#     and always run (cheap, and guard an irreversible leak / a silent deploy drift). And backend is
#     STAGED-ONLY: golangci runs on just the staged files' packages (seconds), not the whole module —
#     the whole-module golangci + arch + build + ~25 guards (~230s) is too slow to pay per commit and
#     belongs on pre-push. The commit gate still exists (a commit is not nothing), it is just scoped
#     to what this commit changed; pre-push is the unscoped real gate. Fast.
#
#   pre-push — the same lint targets, scoped to the subprojects this push changes against
#     origin/main (infra/scripts/lint-changed.sh); a shared path (infra/, Makefile, root manifests)
#     still runs the full `make lint`. The unscoped whole-repo chain took 5–11 minutes per push even
#     when no Go changed (646s on 2026-09-30). PLUS im-bridge's vitest. FULL_LINT=1 forces the full
#     chain.

pre-commit:
  parallel: false   # keep output legible + avoid several `make`/go/node runs contending at once
  commands:
    # cross-cutting, always
    secrets:
      run: infra/scripts/check-secrets.sh
    env-lint:
      run: make env-lint
    # one block per subproject — runs only when this commit touches it.
    # backend is STAGED-ONLY: golangci on the staged files' packages (fast). The whole-module chain
    # (all packages + arch + build + guards + backend-no-mock) runs unscoped on pre-push.
    backend:
      glob: "backend/**/*.go"
      run: bash infra/scripts/lint-go-staged.sh {staged_files}
    app:
      glob: "app/**"
      run: make app-lint
    sdk:
      glob: "sdk/**"
      run: make sdk-lint
    e2e:
      glob: "e2e/**"
      run: make e2e-lint
    im-bridge:
      glob: "im-bridge/**"
      run: make im-bridge-lint im-bridge-test
    verify-items:
      glob: "docs/real-env-verification/**"
      run: make verify-items

pre-push:
  parallel: false
  commands:
    # the lint targets for what this push changes (a shared path → the full chain) …
    lint:
      run: infra/scripts/lint-changed.sh
    # … plus im-bridge's vitest, which is a test (kept out of `make lint`) but must still run before
    # anything is pushed.
    im-bridge-test:
      run: make im-bridge-test
