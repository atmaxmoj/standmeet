# lefthook is this monorepo's git hook manager (following the same setup as Otium auth).
# After clone, run `lefthook install` once to wire the hooks into .git/hooks/.
#
# pre-commit is PARTITIONED BY SUBPROJECT (one block per container: backend / app / sdk / e2e /
# im-bridge), each gated on a `glob`: a block runs only when this commit touches that subproject.
# Change only e2e specs and only e2e-lint runs; touch only app/ and the backend/sdk/im-bridge blocks
# stay quiet. This replaces the old "every commit runs the whole ~165s `make lint` (plus im-bridge's
# vitest) over the entire repo" — the full aggregate still lives in `make lint` for CI / a manual
# pre-push check; here we only pay for what changed.
#
# Two blocks are cross-cutting and always run (both are cheap and guard against something a
# per-subproject scope would miss): the secret scan (an irreversible leak) and the env/config
# consistency check (a drift that breaks a fresh deploy silently).

pre-commit:
  parallel: false   # keep output legible + avoid several `make`/go/node runs contending at once
  commands:
    # 1) cross-cutting, always
    secrets:
      run: infra/scripts/check-secrets.sh
    env-lint:
      run: make env-lint

    # 2) one block per subproject — runs only when this commit touches it
    backend:
      glob: "backend/**"
      run: make backend-lint backend-no-mock
    app:
      glob: "app/**"
      run: make app-lint
    sdk:
      glob: "sdk/**"
      run: make sdk-lint
    e2e:
      glob: "e2e/**"
      run: make e2e-lint
    # im-bridge is standalone (an external visitor client), so its unit tests (vitest) can run right
    # here without the stack — but only when im-bridge/ actually changed, not on every commit.
    im-bridge:
      glob: "im-bridge/**"
      run: make im-bridge-lint im-bridge-test

    # 3) the real-env audit ledger — only when those items changed
    verify-items:
      glob: "docs/real-env-verification/**"
      run: make verify-items
