# lefthook is this monorepo's git hook manager (following the same setup as Otium auth).
# After clone / after changing the HOOKS below, run `lefthook install` once to wire them into
# .git/hooks/ (changing a command's `run` needs no reinstall; adding/removing a hook type does).
#
# Two gates, by cost:
#
#   pre-commit — PARTITIONED BY SUBPROJECT (one glob-gated block per container: backend / app / sdk /
#     e2e / im-bridge). A block runs only when this commit touches that subproject, so a commit pays
#     only for what it changed (change e2e specs → only e2e-lint). secrets + env-lint are cross-cutting
#     and always run (cheap, and guard an irreversible leak / a silent deploy drift). Fast.
#
#   pre-push — the WHOLE thing, GLOBALLY, unscoped: the full aggregate `make lint` across every
#     subproject PLUS im-bridge's vitest. This is the last line before code leaves the machine; CI /
#     Coolify run the same chain, so green here is green in the pipeline. lint-cached makes a tree
#     already linted green by hand a no-op.

pre-commit:
  parallel: false   # keep output legible + avoid several `make`/go/node runs contending at once
  commands:
    # cross-cutting, always
    secrets:
      run: infra/scripts/check-secrets.sh
    env-lint:
      run: make env-lint
    # one block per subproject — runs only when this commit touches it
    backend:
      glob: "backend/**"
      run: make backend-lint backend-no-mock
    app:
      glob: "app/**"
      run: make app-lint
    sdk:
      glob: "sdk/**"
      run: make sdk-lint
    e2e:
      glob: "e2e/**"
      run: make e2e-lint
    im-bridge:
      glob: "im-bridge/**"
      run: make im-bridge-lint im-bridge-test
    verify-items:
      glob: "docs/real-env-verification/**"
      run: make verify-items

pre-push:
  parallel: false
  commands:
    # everything, unscoped — the full lint chain (lint-cached skips a tree already green) …
    lint:
      run: make lint-cached
    # … plus im-bridge's vitest, which is a test (kept out of `make lint`) but must still run before
    # anything is pushed.
    im-bridge-test:
      run: make im-bridge-test
