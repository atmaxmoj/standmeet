# lefthook is this monorepo's git hook manager (following the same setup as Otium auth).
# After clone, run `lefthook install` once to wire the hooks into .git/hooks/.
#
# Single pre-commit entry point: runs root `make lint` (aggregates backend / app / sdk / e2e
# lint), plus an .env / .env.example consistency check.
# CI / Coolify run the same chain — green locally means green in the pipeline.

pre-commit:
  parallel: false   # subproject lints have an order; fmt failures die fastest, saving CPU
  commands:
    lint-env:
      run: infra/scripts/lint-env "$(git rev-parse --show-toplevel)"
    # lint-cached, not lint: the same tree only runs once. It's common for a person to
    # run lint by hand before committing (wanting to see green first), and if the tree
    # hasn't changed since, pre-commit running lint again is pure waiting — tonight, 6 of
    # 11 commits had this shape. The cache keys on content fingerprint, so it doesn't
    # matter whether anyone remembers. Escape hatch: FORCE_LINT=1.
    lint:
      run: make lint-cached
