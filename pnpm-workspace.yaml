# Top-level pnpm workspace covers every TS/JS subproject so SDK packages can
# be `link:` consumed from app/ (dogfood) and e2e/ (smoke). builder/ stays
# out of the workspace because it ships as a docker image and doesn't share
# deps with the rest.
packages:
  - 'app'
  - 'e2e'
  - 'sdk/packages/*'
  # im-bridge —— 进工作区（builder/ 不进）：它**要用 @standmeet/sdk-core**，
  # 桥本质就是又一个访客客户端，跟自定义页、embed 走同一个客户端。
  - 'im-bridge'
