# visitor-asks-projects.yml —— F.2 real-LLM scenario。
#
# Visitor 问 owner 项目；agent 应当：
#   1. 看 system prompt 知道有 corpus.search / corpus.read 两个 tool
#   2. 调 corpus.search({query: ...}) 拿候选
#   3. 选 1-2 个调 corpus.read 拿正文
#   4. 概括 + 给 visitor 答
#
# 预期 transcript 应该看到 search → read → final_text。如果 agent 没调
# read 直接答，说明 prompt 不够明确或模型有侥幸 — 那是 audit point。
#
# 跑：
#   DEEPSEEK_API_KEY=... node sdk/packages/eval-harness/bin/eval-harness.mjs \
#     run sdk/packages/eval-harness/scenarios/visitor-asks-projects.yml

scenario: visitor-asks-projects
description: visitor 问 owner 项目；agent 应 search + read + summarize

prompts:
  - visitor-header

capabilities:
  corpus.retrieval:
    enabled: true
    corpus_uris: [wiki://**, output://**]

toolSpecs:
  corpus.retrieval:
    - name: corpus.search
      description: |
        Search the owner's curated corpus by full-text query. Returns up to
        10 hits with {uri, title, snippet}. Use this to discover candidate
        documents before reading their full body.
      input_schema:
        type: object
        properties:
          query:
            type: string
            description: Free-text search query.
        required: [query]
    - name: corpus.read
      description: |
        Fetch the full body of one corpus document by URI (wiki://path or
        output://path). Use AFTER corpus.search to read the documents that
        look most relevant; don't read everything blindly.
      input_schema:
        type: object
        properties:
          uri:
            type: string
            description: wiki://… or output://… URI from a search hit.
        required: [uri]

tools:
  corpus.search:
    fixture: corpus-sample.json
    op: search
  corpus.read:
    fixture: corpus-sample.json
    op: read

user: tell me about your projects

# DeepSeek's flagship general chat model. owner 自己的 key 进 .env。
model: deepseek-chat
