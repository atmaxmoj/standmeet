# E2E test infrastructure

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: standmeet_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ../standmeet-server/backend
    entrypoint: ["uv", "run"]
    command: ["python", "-c", "import subprocess, sys, os; subprocess.check_call([sys.executable, 'manage.py', 'migrate', '--noinput']); subprocess.check_call([sys.executable, 'manage.py', 'seed_test_token']); subprocess.check_call([sys.executable, 'manage.py', 'shell', '-c', 'from infrastructure.storage.s3_client import MinioAssetStorage; MinioAssetStorage().ensure_bucket()']); os.execvp('uvicorn', ['uvicorn', 'standmeet.asgi:application', '--host', '0.0.0.0', '--port', '8000'])"]
    environment:
      - DB_HOST=db
      - DB_NAME=standmeet_test
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DJANGO_SETTINGS_MODULE=standmeet.settings
      - DJANGO_SECRET_KEY=test-secret-key-for-e2e
      - DJANGO_DEBUG=true
      - CORS_ALLOW_ALL_ORIGINS=true
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=standmeet-assets
      - S3_PUBLIC_URL=http://minio:9000
      - PAGE_BUILDER_URL=http://page-builder:5174
    volumes:
      - global-packages:/data/global-packages
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\", 8000), timeout=2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  page-builder:
    build: ../standmeet-server/page-builder
    command: ["node", "build-server.mjs"]

  gateway:
    build: ../standmeet-server/gateway
    environment:
      - DJANGO_URL=http://server:8000
      - OWNER_TOKEN=smo_e2e_test_token_fixed
      - GATEWAY_PORT=8001
      - MAX_CONCURRENT_QUERIES=2
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - MOCK_AI=${MOCK_AI:-true}
    depends_on:
      server:
        condition: service_healthy

  web:
    build:
      context: ../standmeet-server/frontend
      target: dev
    environment:
      - NEXT_PUBLIC_API_URL=http://server:8000
      - NEXT_PUBLIC_GATEWAY_URL=ws://gateway:8001
      - INTERNAL_API_URL=http://server:8000
      - OWNER_TOKEN=smo_e2e_test_token_fixed
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=standmeet-assets
    depends_on:
      - gateway

  # ── Test runner (profiles: test) ──

  test-e2e:
    build:
      context: ..
      dockerfile: standmeet-e2e/Dockerfile
    init: true
    environment:
      - WEB_URL=http://web:3000
      - DJANGO_URL=http://server:8000
      - GATEWAY_URL=ws://gateway:8001
      - OWNER_TOKEN=smo_e2e_test_token_fixed
      - ELECTRON_APP_PATH=/app/standmeet-client
      - PLAYWRIGHT_PROJECT=${PLAYWRIGHT_PROJECT:-mock}
      - PLAYWRIGHT_FILE=${PLAYWRIGHT_FILE:-}
    depends_on:
      - web
      - page-builder
    profiles: [test]

volumes:
  global-packages:
