[project]
name = "standmeet-server"
version = "0.1.0"
description = "StandMeet - AI-powered personal introduction platform (Server)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.6",
    "mcp>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.11.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "standmeet.settings"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PLR0915"]
ignore = ["E402"]

[tool.ruff.lint.pylint]
max-statements = 50
