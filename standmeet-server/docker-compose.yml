services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: standmeet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=standmeet
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=false
      - CORS_ALLOW_ALL_ORIGINS=true
      - STANDMEET_GENERATE_TOKEN=${STANDMEET_GENERATE_TOKEN:-false}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=standmeet-assets
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - PAGE_BUILDER_URL=http://page-builder:5174
    volumes:
      - global-packages:/data/global-packages
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "8001:8001"
    environment:
      - DJANGO_URL=http://server:8000
      - OWNER_TOKEN=${OWNER_TOKEN:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - server

  page-builder:
    build: ./page-builder
    depends_on:
      - server

  web:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_GATEWAY_URL=ws://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
  miniodata:
  global-packages:
